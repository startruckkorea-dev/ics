function formatDateTime(iso, lang) {
  if (!iso) return "-";
  const str = String(iso);
  // 옛 데이터는 시각 없이 날짜(YYYY-MM-DD)만 저장되어 있다.
  // 이 값을 KST 보정하면 실제로는 없는 09:00 이 붙어 오해를 부르므로 날짜만 표시한다.
  if (/^\d{4}-\d{2}-\d{2}$/.test(str.trim())) {
    const [y0, m0, d0] = str.trim().split("-");
    return lang === "en" ? `${y0}-${m0}-${d0}` : `${y0}년 ${m0}월 ${d0}일`;
  }
  const raw = new Date(iso);
  if (isNaN(raw.getTime())) return str.slice(0, 10); // 형식을 알 수 없는 값 폴백
  const d = new Date(raw.getTime() + 9 * 3600 * 1000); // UTC 저장값을 KST로 보정
  const y = d.getUTCFullYear();
  const mo = String(d.getUTCMonth() + 1).padStart(2, "0");
  const day = String(d.getUTCDate()).padStart(2, "0");
  const hh = String(d.getUTCHours()).padStart(2, "0");
  const mm = String(d.getUTCMinutes()).padStart(2, "0");
  return lang === "en" ? `${y}-${mo}-${day} ${hh}:${mm}` : `${y}년 ${mo}월 ${day}일 ${hh}:${mm}`;
}

function formatBytes(bytes) {
  if (bytes < 1024) return `${bytes}B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)}KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)}MB`;
}

// 평가 화면 4종(ISA 1차·FSA 최종·ISA 2차·FSA 2차)이 공유하는 검색·필터 로직.
// Admin은 전사 항목을 보게 되어 있어(설계 정책) 목록이 길어지므로, 스코프는 그대로 두고
// 찾기만 쉽도록 검색어·부서·담당자 필터를 제공한다.
function useAssessmentFilter(source, lang, users, departments) {
  const [q, setQ] = useState("");
  const [dept, setDept] = useState("");
  const [person, setPerson] = useState("");

  const deptOptions = [...new Set(source.map((c) => c.dept).filter(Boolean))]
    .map((id) => ({ id, label: deptName(id, lang, departments) }))
    .sort((a, b) => a.label.localeCompare(b.label));
  const personOptions = [...new Set(source.map((c) => (c.accessor || "").toLowerCase()).filter(Boolean))]
    .map((email) => ({ email, label: personByEmail(email, lang, users) }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const query = q.trim().toLowerCase();
  const apply = (list) => list.filter((c) => {
    if (dept && c.dept !== dept) return false;
    if (person && (c.accessor || "").toLowerCase() !== person) return false;
    if (!query) return true;
    return (c.code || "").toLowerCase().includes(query)
      || cName(c, lang).toLowerCase().includes(query)
      || personByEmail(c.accessor, lang, users).toLowerCase().includes(query);
  });

  const active = !!(query || dept || person);
  const reset = () => { setQ(""); setDept(""); setPerson(""); };
  return { q, setQ, dept, setDept, person, setPerson, deptOptions, personOptions, apply, active, reset };
}

// 평가 화면 공용 필터 바. 항목이 적을 때(12건 이하)는 표시하지 않는다.
function AssessmentFilterBar({ f, t, minItems }) {
  if (minItems <= 12 && !f.active) return null;
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-4 flex flex-wrap items-center gap-3">
      <div className="relative flex-1 min-w-[180px]">
        <Search size={15} className="absolute left-3 top-2.5 text-slate-400" />
        <input
          value={f.q}
          onChange={(e) => f.setQ(e.target.value)}
          placeholder={t("assess.searchPlaceholder")}
          className={`${inputCls} pl-8`}
        />
      </div>
      <select value={f.dept} onChange={(e) => f.setDept(e.target.value)} className={`${inputCls} w-auto`}>
        <option value="">{t("common.allDept")}</option>
        {f.deptOptions.map((d) => <option key={d.id} value={d.id}>{d.label}</option>)}
      </select>
      <select value={f.person} onChange={(e) => f.setPerson(e.target.value)} className={`${inputCls} w-auto`}>
        <option value="">{t("history.allAccessors")}</option>
        {f.personOptions.map((o) => <option key={o.email} value={o.email}>{o.label}</option>)}
      </select>
      {f.active && (
        <button onClick={f.reset} className="text-xs text-slate-500 hover:text-slate-700 flex items-center gap-1">
          <X size={13} /> {t("common.resetFilter")}
        </button>
      )}
    </div>
  );
}

function SelfAssessment({ controls, setControls, currentUser, addLog, isArchived, showToast, allowedDepts, usingSharePointData }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "", sampleSize: 0, attachments: [] });

  const myEmail = (currentUser.email || "").toLowerCase();
  // 자가평가는 역할과 무관하게 본인이 1차 담당자(Accessor)로 배정된 항목만 대상이다.
  // Admin 도 예외가 아니며, 부서 접근권한(allowedDepts)도 평가 대상 판단에는 쓰지 않는다.
  // 전사 현황은 부서별 통제 현황·통제 항목 관리·대시보드에서 확인한다.
  const myControls = controls.filter((c) => (c.accessor || "").toLowerCase() === myEmail);

  const f = useAssessmentFilter(myControls, lang, users, departments);

  // ── 통제 항목 수정 요청 ──
  // 통제명·설명 등은 담당자가 실제 내용을 가장 잘 알기 때문에, 자가평가 화면에서 바로
  // 수정 요청을 올릴 수 있게 한다. 요청은 3단계 결재를 거쳐야 실제로 반영된다.
  const [reqForm, setReqForm] = useState(null);   // { control, name, desc, cat }
  const [reqSaving, setReqSaving] = useState(false);
  const [mcOpen, setMcOpen] = useState(false);   // 결재자 선택 목록 펼침 여부
  const [mcQuery, setMcQuery] = useState("");    // 검색어 (이름·이메일·부서·팀)
  const [mcAll, setMcAll] = useState(false);     // true 면 전 임직원에서 고른다
  const [changeReqs, setChangeReqs] = useState({});
  useEffect(() => {
    if (!usingSharePointData) return;
    loadIcsChangeRequests()
      .then((list) => {
        const map = {};
        list.forEach((r) => {
          const prev = map[r.code];
          if (!prev || (r.status === "pending" && prev.status !== "pending")) map[r.code] = r;
        });
        setChangeReqs(map);
      })
      .catch((e) => console.warn("[ICS] 변경 요청 로드 실패:", e.message));
  }, []);

  function openRequest(c) {
    const r = changeReqs[c.code];
    if (r && r.status === "pending") { alert(t("manage.lockedPending")); return; }
    setReqForm({
      control: c, name: cName(c, lang), desc: cDesc(c, lang), cat: c.cat,
      mc: "",       // 1차 MC 는 요청자가 직접 지정한다
      reason: "",   // 요청 사유 — Steps JSON 에 함께 저장하므로 목록 컬럼 추가가 필요 없다
    });
  }

  // 1차 MC 후보 — employee_search.xlsx 의 H열에 등장하는 사람만, 요청자 본인은 제외.
  const _mcQ = mcQuery.trim().toLowerCase();
  // 기본은 H열 기준 MC 후보. MC 가 부재중이면 전 임직원에서 직접 고를 수 있다.
  const mcPool = mcAll ? ICS_EMPLOYEE_DIR : ICS_MC_CANDIDATES;
  const mcOptions = mcPool
    .filter((x) => x.email !== myEmail)
    .filter((x) => !_mcQ || [x.name, x.email, x.dept, x.team]
      .some((v) => String(v || "").toLowerCase().includes(_mcQ)))
    .sort((a, b) => a.name.localeCompare(b.name));
  const mcPicked = [...ICS_EMPLOYEE_DIR, ...ICS_MC_CANDIDATES].find((x) => x.email === reqForm?.mc) || null;

  // 결재선은 MC 선택에 따라 즉시 다시 계산한다. 중복이면 그 자리에서 안내가 뜬다.
  const reqSteps = reqForm ? buildApprovalSteps(currentUser.email, reqForm.mc) : [];

  async function submitRequest() {
    if (!reqForm) return;
    const c = reqForm.control;
    const name = (reqForm.name || "").trim();
    if (!name) return;
    const steps = reqSteps;
    if (!steps.length) {
      alert(lang === "en"
        ? "Approval line could not be determined. Please contact IT."
        : "결재선을 확인할 수 없습니다. IT로 문의해 주세요.");
      return;
    }
    setReqSaving(true);
    try {
      // 변경하지 않은 필드도 함께 담아야 최종 승인 시 원래 값이 유지된다.
      // 요청 사유는 결재선 JSON 첫머리에 담는다 (SharePoint 컬럼 추가 불필요)
      await icsCreateItem(ICS_LISTS.changeRequests, {
        Title: c.code, Year: c.year, ReqType: "edit",
        RequesterEmail: currentUser.email,
        Payload: JSON.stringify({
          dept: c.dept, cat: reqForm.cat, name, desc: (reqForm.desc || "").trim(),
          accessor: c.accessor, reviewer: c.reviewer,
          frequency: c.frequency, importance: c.importance,
          // 요청 사유. Payload 에 함께 담아 SharePoint 컬럼을 새로 만들지 않는다.
          reason: (reqForm.reason || "").trim(),
        }),
        Steps: JSON.stringify(steps), Step: 1, Status: "pending",
      });
      addLog(currentUser.email, "request_edit_control", c.code, name, name);
      setChangeReqs((prev) => ({ ...prev, [c.code]: { code: c.code, status: "pending" } }));
      setReqForm(null);
      setMcQuery(""); setMcOpen(false); setMcAll(false);
      showToast(lang === "en"
        ? "Change request submitted for approval."
        : "수정 요청이 결재로 상신되었습니다.");
    } catch (e) {
      console.warn("[ICS] 수정 요청 생성 실패:", e.message);
      alert(lang === "en"
        ? "Failed to submit the change request."
        : "수정 요청 상신에 실패했습니다. 잠시 후 다시 시도해 주세요.");
    } finally {
      setReqSaving(false);
    }
  }

  const todo = f.apply(myControls.filter((c) => c.status === "not_started" || c.status === "returned"));
  const inProgress = f.apply(myControls.filter((c) => c.status === "submitted_self" || c.status === "completed"));

  function startEdit(c) {
    setEditing(c.id);
    setDraft({ risk: c.selfRisk, comment: c.selfComment || "", frequency: c.frequency, importance: c.importance, sampleSize: c.actualSample ?? recommendedSample(c.importance, c.frequency), attachments: c.attachments || [] });
  }

  const [saving, setSaving] = useState(null);

  async function submit(c) {
    // 리스크 수준은 선택 사항이다. 비워두면 대시보드에 「미평가」로 집계된다.
    const today = new Date().toISOString();  // SharePoint 저장값과 동일한 ISO — 표시 시점에 formatDateTime 이 KST 로 변환
    setSaving(c.id);
    setEditing(null);
    try {
      // 1) 요청 항목이 아직 없으면 먼저 만들어서 SharePoint 아이템 ID를 확보 (첨부파일 업로드 폴더명으로 사용)
      let spId = c.requestSpId;
      if (!spId) {
        const created = await icsCreateItem(ICS_LISTS.requests, {
          Title: `ICS-${c.year}-${c.code}`,
          ControlId: c.code,
          Year: c.year,
          RequesterEmail: c.accessor,
          RequestDate: new Date().toISOString(),
          Status: "not_started",
        });
        spId = created.id;
        // 이후 단계(업로드/저장)가 실패하더라도 재시도 시 항목이 중복 생성되지 않도록 즉시 반영
        setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, requestSpId: spId } : x)));
      }

      // 2) 아직 업로드 안 된(webUrl 없는) 첨부만 실제 업로드, 이미 업로드된 것은 그대로 재사용
      const finalAttachments = [];
      for (const att of draft.attachments || []) {
        if (att.webUrl) {
          finalAttachments.push({ name: att.name, webUrl: att.webUrl });
        } else if (att.file) {
          const uploaded = await icsUploadAttachment(spId, att.file);
          finalAttachments.push({ name: att.file.name, webUrl: uploaded.webUrl });
        }
      }
      const attachedFilesField = finalAttachments.map((a) => `${a.name}|${a.webUrl}`).join(";");

      // 3-0) 점검빈도·중요도가 폼에서 변경되었으면 통제 항목(ICS_Controls)에 먼저 반영한다.
      //      권장 샘플링 건수의 근거가 되는 값이라 평가 내용과 함께 확정되어야 한다.
      const newFreq = draft.frequency ?? c.frequency;
      const newImp = draft.importance ?? c.importance;
      if (c.spId && (newFreq !== c.frequency || newImp !== c.importance)) {
        await icsUpdateItem(ICS_LISTS.controls, c.spId, { Frequency: newFreq, Importance: newImp });
        addLog(currentUser.email, "edit_control", c.code, c.name, c.nameEn);
      }

      // 3) 평가 내용 + 첨부파일 목록을 함께 저장
      await icsUpdateItem(ICS_LISTS.requests, spId, {
        Status: "submitted_self",
        SelfRisk: draft.risk,
        SelfCommentKo: draft.comment,
        SelfCommentEn: draft.comment,
        SelfDate: new Date().toISOString(),
        SampleCount: draft.sampleSize,
        AttachedFiles: attachedFilesField,
      });

      setControls((prev) =>
        prev.map((x) =>
          x.id === c.id
            ? { ...x, requestSpId: spId, frequency: newFreq, importance: newImp, status: "submitted_self", selfRisk: draft.risk, selfComment: draft.comment, selfCommentEn: draft.comment, selfDate: today, actualSample: draft.sampleSize, attachments: finalAttachments }
            : x
        )
      );
      addLog(currentUser.email, "submit_self", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Self-assessment submitted." : "자가평가가 제출되었습니다.");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    } finally {
      setSaving(null);
    }
  }

  // 검토자가 아직 처리 전(submitted_self)이면 담당자 본인이 제출을 철회해서 '평가 필요' 목록으로 되돌릴 수 있다.
  // (타 APS 시스템들의 Withdraw 공통 패턴 - 결재자가 아직 안 봤을 때만 가능, 서버 상태 재확인으로 경합 방지)
  async function withdrawSubmission(c) {
    if (c.status !== "submitted_self") return;
    const ok = window.confirm(lang === "en" ? "Withdraw this submission? It will move back to 'needs assessment'." : "제출을 철회하시겠습니까? '평가 필요' 상태로 되돌아갑니다.");
    if (!ok) return;
    setSaving(c.id);
    try {
      const stillPending = await icsCheckStillPending(ICS_LISTS.requests, c.requestSpId, "Status", "submitted_self");
      if (!stillPending) {
        alert(lang === "en" ? "The reviewer already processed this item, so it can no longer be withdrawn." : "검토자가 이미 처리한 항목이라 철회할 수 없습니다.");
        window.location.reload();
        return;
      }
      await icsUpdateItem(ICS_LISTS.requests, c.requestSpId, { Status: "not_started" });
      setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, status: "not_started" } : x)));
      addLog(currentUser.email, "withdraw_self", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Submission withdrawn." : "제출이 철회되었습니다.");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    } finally {
      setSaving(null);
    }
  }

  return (
    <div>
      {reqForm && (
        <Modal title={t("self.reqTitle")} onClose={() => setReqForm(null)}>
          <div className="bg-slate-50 rounded-lg px-4 py-3 mb-4">
            <p className="text-xs text-slate-400 font-mono mb-1.5">{reqForm.control.code}</p>
            <p className="text-xs text-slate-500">{t("self.reqCurrent")}</p>
            <p className="text-sm text-slate-700 mt-1">
              {catName(reqForm.control.cat, lang)} · {cName(reqForm.control, lang)}
            </p>
          </div>
          <div className="space-y-3">
            <Field label={t("manage.fieldName")}>
              <input className={inputCls} value={reqForm.name}
                     onChange={(e) => setReqForm({ ...reqForm, name: e.target.value })} />
              {reqForm.name !== cName(reqForm.control, lang) && (
                <p className="text-xs mt-1.5" style={{ color: BRAND.accent }}>{t("self.reqChanged")}</p>
              )}
            </Field>
            <Field label={t("manage.fieldCat")}>
              <select className={inputCls} value={reqForm.cat}
                      onChange={(e) => setReqForm({ ...reqForm, cat: e.target.value })}>
                {CATEGORIES.map((x) => <option key={x.id} value={x.id}>{x[lang]}</option>)}
              </select>
              {reqForm.cat !== reqForm.control.cat && (
                <p className="text-xs mt-1.5" style={{ color: BRAND.accent }}>{t("self.reqChanged")}</p>
              )}
            </Field>
            <Field label={t("manage.fieldDesc")}>
              <textarea
                className={inputCls}
                rows={4}
                maxLength={DESC_MAX}
                value={reqForm.desc}
                onChange={(e) => setReqForm({ ...reqForm, desc: e.target.value })}
              />
              <p className="text-xs text-slate-400 mt-1.5 text-right">
                {(reqForm.desc || "").length} / {DESC_MAX}
              </p>
            </Field>
          </div>

          <div className="mt-3">
            <Field label={t("self.reqMcLabel")}>
              <>
                {/* 접힌 상태: 선택된 사람만 보여주고, 누르면 검색 목록이 펼쳐진다. */}
                <button
                  type="button"
                  onClick={() => setMcOpen((v) => !v)}
                  className={`${inputCls} flex items-center justify-between text-left`}
                >
                  {mcPicked ? (
                    <span className="min-w-0 flex items-baseline gap-1.5">
                      <span className="text-[14px] font-medium text-slate-800 whitespace-nowrap">{mcPicked.name}</span>
                      <span className="text-[12px] text-slate-400 truncate">{mcPicked.email}</span>
                    </span>
                  ) : (
                    <span className="text-slate-400">{t("self.reqMcPlaceholder")}</span>
                  )}
                  <ChevronDown size={15} className="text-slate-400 flex-shrink-0 transition-transform"
                               style={{ transform: mcOpen ? "rotate(180deg)" : "none" }} />
                </button>

                {mcOpen && (
                  <div className="border border-slate-200 rounded-lg mt-1.5 overflow-hidden">
                    <div className="p-2 border-b border-slate-100 space-y-2">
                      <div className="relative">
                        <Search size={14} className="absolute left-3 top-2.5 text-slate-400" />
                        <input
                          autoFocus
                          value={mcQuery}
                          onChange={(e) => setMcQuery(e.target.value)}
                          placeholder={t("self.reqMcSearch")}
                          className={`${inputCls} pl-8 py-2 text-[13px]`}
                        />
                      </div>
                      {/* MC 가 휴가 등으로 부재일 때 전 임직원에서 고를 수 있게 한다. */}
                      <div className="flex gap-1">
                        {[false, true].map((v) => (
                          <button
                            key={String(v)}
                            type="button"
                            onClick={() => setMcAll(v)}
                            className="flex-1 text-[12px] py-1.5 rounded-md font-medium transition-colors"
                            style={{
                              backgroundColor: mcAll === v ? BRAND.accent : "#F1F5F9",
                              color: mcAll === v ? "#fff" : "#64748B",
                            }}
                          >
                            {v ? t("self.reqMcAll") : t("self.reqMcDefault")}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div className="overflow-y-auto divide-y divide-slate-100" style={{ maxHeight: 190 }}>
                      {mcOptions.length === 0 ? (
                        <p className="text-xs text-slate-400 px-3 py-4 text-center">
                          {mcAll ? t("common.emptySearch") : t("self.reqMcTryAll")}
                        </p>
                      ) : mcOptions.map((u) => {
                        const on = reqForm.mc === u.email;
                        return (
                          <button
                            key={u.email}
                            type="button"
                            onClick={() => {
                              setReqForm({ ...reqForm, mc: on ? "" : u.email });
                              if (!on) { setMcOpen(false); setMcQuery(""); }
                            }}
                            className="w-full flex items-center justify-between gap-2 px-3 py-2 text-left transition-colors"
                            style={{ backgroundColor: on ? "#E4F1F0" : "#fff" }}
                            onMouseEnter={(e) => { if (!on) e.currentTarget.style.backgroundColor = "#F8FAFC"; }}
                            onMouseLeave={(e) => { if (!on) e.currentTarget.style.backgroundColor = "#fff"; }}
                          >
                            <span className="min-w-0">
                              <span className="flex items-baseline gap-1.5">
                                <span className="text-[13px] font-medium text-slate-800 whitespace-nowrap">{u.name}</span>
                                <span className="text-[11px] text-slate-400 truncate">{u.email}</span>
                              </span>
                              {(u.dept || u.team) && (
                                <span className="block text-[11px] text-slate-400 truncate">
                                  {[u.dept, u.team].filter(Boolean).join(" · ")}
                                </span>
                              )}
                            </span>
                            {on && <Check size={15} className="flex-shrink-0" style={{ color: BRAND.accent }} />}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </>
            </Field>
          </div>

          <div className="mt-3">
            <Field label={t("self.reqReasonLabel")}>
              <textarea className={inputCls} rows={2} maxLength={REASON_MAX}
                        value={reqForm.reason}
                        onChange={(e) => setReqForm({ ...reqForm, reason: e.target.value })}
                        placeholder={t("self.reqReasonPlaceholder")} />
              <p className="text-xs text-slate-400 mt-1.5 text-right">{(reqForm.reason || "").length} / {REASON_MAX}</p>
            </Field>
          </div>

          {reqForm.mc && (
          <div className="bg-slate-50 rounded-lg px-4 py-3 mt-3">

                      {sk.role === "LM1" ? t("approval.stepLm1")

                      {" "}{t("self.reqSkipped")} — {personByEmail(sk.approver, lang, users)}
                      {" "}{sk.reason === "self" ? t("self.reqSkipSelf") : t("self.reqSkipDup")}

            )}

          <div className="bg-slate-50 rounded-lg px-4 py-3 mt-2 text-xs text-slate-500">

          </div>
          <div className="flex justify-end gap-2 mt-5">

              {t("common.cancel")}

            <button onClick={submitRequest} disabled={reqSaving || !(reqForm.name || "").trim() || !reqForm.mc}
                    className="px-4 py-2 text-sm text-white rounded-lg disabled:opacity-40 flex items-center gap-1.5"
                    style={{ backgroundColor: BRAND.accent }}>
              {reqSaving && <Loader2 size={14} className="animate-spin" />}{t("self.reqSubmit")}
            </button>

        </Modal>

        icon={ClipboardList}
        title={t("self.title")}
        subtitle={`${pName(currentUser.name, lang, users)}${t("self.subtitleUser")}`}
      />

      <AssessmentFilterBar f={f} t={t} minItems={myControls.length} />

      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
          <AlertTriangle size={15} className="text-amber-500" /> {t("self.needsAction")} ({todo.length})
        </h3>
        {todo.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm"><EmptyState text={t("self.noNeedsAction")} /></div>
        ) : (
          <div className="space-y-3">
            {todo.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                <div className="flex items-start justify-between gap-3 mb-2">
                  <p className="text-[13px] text-slate-400 font-mono">{c.code} · {deptName(c.dept, lang, departments)}</p>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    {changeReqs[c.code]?.status === "pending" ? (

                            style={{ backgroundColor: "#FEF3C7", color: "#B45309" }}>
                        <Clock size={11} /> {t("self.reqPending")}
                      </span>
                    ) : (!isArchived && (
                      <button

                        onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#CBD5E1"; e.currentTarget.style.color = "#475569"; }}
                        title={t("self.reqHint")}
                      >
                        <ClipboardEdit size={13} /> {t("self.reqBtn")}
                      </button>

                    <StatusBadge status={c.status} kind="isa" />

                {/* 수정 요청으로 바꿀 수 있는 값들을 라벨과 함께 보여준다.
                    담당자가 무엇을 요청할 수 있는지 화면에서 바로 알 수 있게 하기 위함이다. */}
                <div className="space-y-1 mb-3">
                  <div className="flex gap-2 text-[15px]">
                    <span className="text-slate-400 w-[76px] flex-shrink-0 text-[13px] pt-0.5">{t("list.colCat")}</span>
                    <span className="text-slate-700">{catName(c.cat, lang)}</span>
                  </div>
                  <div className="flex gap-2 text-[15px]">
                    <span className="text-slate-400 w-[76px] flex-shrink-0 text-[13px] pt-0.5">{t("list.colName")}</span>
                    <span className="font-medium text-slate-800">{cName(c, lang)}</span>
                  </div>
                  <div className="flex gap-2 text-[15px]">
                    <span className="text-slate-400 w-[76px] flex-shrink-0 text-[13px] pt-0.5">{t("manage.fieldDesc")}</span>
                    <span className="text-slate-500 whitespace-pre-wrap min-w-0">{cDesc(c, lang) || "-"}</span>

                {c.status === "returned" && (
                  <div className="bg-red-50 rounded-lg p-3 mb-3 text-sm">
                    <p className="text-xs font-medium text-red-700 mb-1">{t("self.rejectReasonTitle")} ({personByEmail(c.reviewer, lang, users)})</p>
                    <p className="text-red-700 whitespace-pre-wrap">{lang === "en" ? c.reviewCommentEn || c.reviewComment : c.reviewComment}</p>

                {/* 제출을 누르면 폼이 바로 닫혀서, 저장이 끝날 때까지 카드에 아무 변화가 없었다.
                    스로틀이 걸려 몇 초 걸리면 「눌리지 않았다」고 보고 다시 누르게 된다. */}
                {saving === c.id ? (
                  <div className="flex justify-end items-center gap-2 text-sm text-slate-500">
                    <Loader2 size={14} className="animate-spin" /> {t("common.saving")}
                  </div>

                  <SelfAssessForm control={c} draft={draft} setDraft={setDraft} onCancel={() => setEditing(null)} onSubmit={() => submit(c)} />
                ) : (
                  // 작성 버튼은 카드 하단 우측에 둔다. 상단 배지와 붙으면 구분이 어렵다.
                  !isArchived && (
                    <div className="flex justify-end">
                      <button onClick={() => startEdit(c)}
                              className="text-sm font-medium px-4 py-2 rounded-lg text-white whitespace-nowrap"

                        {t("self.writeBtn")}

      <div>
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("self.submitted")} ({inProgress.length})</h3>

          {inProgress.map((c) => (
            <div key={c.id} className="p-4">
              <div className="flex items-start justify-between gap-3 mb-1">
                <div>
                  <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                  <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <RiskBadge risk={c.selfRisk} />
                  <StatusBadge status={c.status} kind="isa" />

                  {c.status === "submitted_self" && !isArchived && (
                    <button onClick={() => withdrawSubmission(c)} className="text-xs text-red-400 hover:text-red-600 flex items-center gap-1 flex-shrink-0 ml-3">
                      <Undo2 size={12} /> {t("self.withdrawBtn")}
                    </button>

                <div className="flex items-center gap-3 mt-2 text-xs text-slate-400">
                  <span>{t("self.sampleCount")} {c.actualSample ?? "-"}{t("common.items")} ({t("self.recommendedShort")} {recommendedSample(c.importance, c.frequency)}{t("common.items")})</span>
                  <span className="flex items-center gap-1"><Paperclip size={11} /> {(c.attachments || []).length}</span>

function SelfAssessForm({ control, draft, setDraft, onCancel, onSubmit }) {
  const { lang, t } = useLang();
  const fileInputRef = useRef(null);
  // 점검빈도·중요도는 자가평가 폼에서 수정할 수 있다. 값이 바뀌면 권장 샘플링 건수도 따라 바뀐다.
  const curFreq = draft.frequency ?? control.frequency;
  const curImp = draft.importance ?? control.importance;
  const recommended = recommendedSample(curImp, curFreq);

  // 기준을 바꾸면 권장 건수도 맞춰준다.
  // 담당자가 실제 건수를 이미 직접 조정한 경우에는 그 값을 덮어쓰지 않는다.
  function changeCriteria(patch) {
    const nextFreq = patch.frequency ?? curFreq;
    const nextImp = patch.importance ?? curImp;
    const prevReco = recommendedSample(curImp, curFreq);
    const next = { ...draft, ...patch };
    if (Number(draft.sampleSize) === prevReco) next.sampleSize = recommendedSample(nextImp, nextFreq);
    setDraft(next);
  }

  // 제출 전 확인 항목. 하나라도 비면 제출 버튼이 잠기고 사유가 표시된다.
  const commentLen = (draft.comment || "").trim().length;
  const sampleNum = Number(draft.sampleSize);
  const hasAttach = (draft.attachments || []).length > 0;
  // 첨부 총 용량. SharePoint 에서 불러온 기존 첨부는 이름·URL 만 저장되어 크기를 알 수 없으므로,
  // 이번에 새로 고른 파일만 합산한다(재제출 시 기존 첨부는 다시 올리지 않는다).
  const attachBytes = (draft.attachments || []).reduce((n, a) => n + (a.rawSize || 0), 0);
  const missing = [];
  if (!draft.risk) missing.push(t("self.needRisk"));
  if (commentLen < COMMENT_MIN) missing.push(t("self.needComment"));
  if (!(sampleNum > 0)) missing.push(t("self.needSample"));
  if (!hasAttach) missing.push(t("self.needAttach"));

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    // 첨부 전체 합계가 상한을 넘으면 받지 않는다. 개별 파일이 아니라 총량 기준이다.
    const addBytes = files.reduce((n, f) => n + f.size, 0);
    if (attachBytes + addBytes > ATTACH_MAX_BYTES) {
      alert(`${t("self.attachTooBig")}\n\n`
        + `${t("self.attachCurrent")} ${formatBytes(attachBytes)}\n`
        + `${t("self.attachAdding")} ${formatBytes(addBytes)}`);
      e.target.value = "";
      return;
    }
    // file 원본은 실제 업로드(icsUploadAttachment) 시 필요, 이미 업로드된 기존 첨부(webUrl 있음)와 구분하는 용도
    const newAttachments = files.map((f) => ({ name: f.name, size: formatBytes(f.size), rawSize: f.size, file: f }));
    setDraft({ ...draft, attachments: [...(draft.attachments || []), ...newAttachments] });
    e.target.value = "";
  }
  function removeAttachment(idx) {
    setDraft({ ...draft, attachments: draft.attachments.filter((_, i) => i !== idx) });
  }

  return (
    <div className="bg-white border border-slate-300 rounded-xl p-5 mt-3 shadow-sm">
      {/* 리스크 수준(좌) 과 평가 기준·첨부(우) 를 나란히 배치해 세로 길이를 줄인다.
          좁은 화면에서는 자동으로 위아래로 쌓인다. */}
      <div className="grid grid-cols-1 xl:grid-cols-2 gap-x-6 gap-y-5">
        <div>
          <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-2.5">{t("self.riskLevel")}</p>
          <div className="grid grid-cols-3 gap-3">
        {["green", "orange", "red"].map((r) => (
          <button
            key={r}
            onClick={() => setDraft({ ...draft, risk: r })}
            className="flex flex-col items-center justify-center gap-1.5 py-3.5 rounded-xl text-sm font-semibold border-2 transition-all"
            style={{
              borderColor: draft.risk === r ? RISK_META[r].color : "#E5E9EF",
              backgroundColor: draft.risk === r ? RISK_META[r].bg : "#fff",
              color: draft.risk === r ? RISK_META[r].text : "#94A3B8",
              boxShadow: draft.risk === r ? `0 2px 8px ${RISK_META[r].color}22` : "none",
            }}
          >
            <span className="w-3 h-3 rounded-full" style={{ backgroundColor: draft.risk === r ? RISK_META[r].color : "#CBD3DD" }} />
            {RISK_META[r][lang]}
          </button>
        ))}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3 items-end xl:pl-6 xl:border-l xl:border-slate-200">
        <div>
          <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{t("manage.fieldFreq")}</p>
          <select
            className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400 bg-white"
            value={curFreq}
            onChange={(e) => changeCriteria({ frequency: e.target.value })}
          >
            {FREQUENCY_OPTIONS.map((f) => <option key={f.id} value={f.id}>{f[lang]}</option>)}
          </select>
        </div>
        <div>
          <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{t("manage.fieldImportance")}</p>
          <select
            className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400 bg-white"
            value={curImp}
            onChange={(e) => changeCriteria({ importance: e.target.value })}
          >
            {IMPORTANCE_OPTIONS.map((im) => <option key={im.id} value={im.id}>{im[lang]}</option>)}
          </select>
        </div>
        <div>
          <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5 truncate"
             title={`${t("self.recommendedNote")} ${recommended}${t("common.items")} · ${importanceLabel(curImp, lang)} · ${freqLabel(curFreq, lang)}`}>
            {t("self.sampleCount")} <span className="normal-case font-normal text-slate-400">({t("self.recommendedNote")} {recommended}{t("common.items")})</span>
          </p>
          <input
            type="number"
            min={0}
            className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400"
            value={draft.sampleSize}
            onChange={(e) => setDraft({ ...draft, sampleSize: Math.max(0, Number(e.target.value)) })}
          />
        </div>
        <div>
          <button
            type="button"
            onClick={() => fileInputRef.current?.click()}
            className="w-full flex flex-col items-center justify-center gap-0.5 border-2 border-dashed rounded-xl py-2 text-xs font-medium transition-colors"
            style={{ borderColor: "#B6C0CC", color: "#64748B" }}
            onMouseEnter={(e) => { e.currentTarget.style.borderColor = BRAND.accent; e.currentTarget.style.color = BRAND.accent; }}
            onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#B6C0CC"; e.currentTarget.style.color = "#64748B"; }}
          >
            <span className="inline-flex items-center gap-1.5">
              <UploadCloud size={15} /> {t("self.attachBtn")}
            </span>
            <span className="text-[11px] font-normal opacity-70">
              {attachBytes > 0
                ? `${formatBytes(attachBytes)} / ${ATTACH_MAX_MB}MB`
                : t("self.attachHint")}
            </span>
          </button>
          <input ref={fileInputRef} type="file" multiple className="hidden" onChange={handleFiles} />
        </div>
        </div>
      </div>

      <div className="border-t border-slate-200 mt-5 pt-4">
      <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
        {t("self.commentPlaceholder")}
        <span className="ml-1.5 font-normal normal-case"
              style={{ color: commentLen >= COMMENT_MIN ? "#94A3B8" : BRAND.accent }}>
          ({commentLen} / {COMMENT_MIN}{t("self.charsMin")})
        </span>
      </p>
      <textarea
        className="w-full border border-slate-300 rounded-xl px-3.5 py-3 text-[15px] text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400 resize-none"
        rows={3}
        placeholder={t("self.commentPlaceholder")}
        value={draft.comment}
        onChange={(e) => setDraft({ ...draft, comment: e.target.value })}
      />
      </div>

      {(draft.attachments || []).length > 0 && (
        <ul className="mt-3 space-y-1.5">
          {draft.attachments.map((a, i) => (
            <li key={i} className="flex items-center gap-2 text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
              <Paperclip size={12} className="text-slate-400 flex-shrink-0" />
              <span className="truncate">{a.name}</span>
              <span className="text-slate-400 flex-shrink-0">{a.size}</span>
              <button onClick={() => removeAttachment(i)} className="ml-auto text-slate-300 hover:text-red-500 flex-shrink-0"><X size={12} /></button>
            </li>
          ))}
        </ul>
      )}

      {missing.length > 0 && (
        <p className="text-xs mb-2 text-right" style={{ color: BRAND.accent }}>
          {t("self.needTitle")} {missing.join(" · ")}
        </p>
      )}
      <div className="flex justify-end gap-2 mt-4 pt-4 border-t border-slate-200">
        <button onClick={onCancel} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
        <button onClick={onSubmit} disabled={missing.length > 0}
                title={missing.length ? `${t("self.needTitle")}\n${missing.map((m) => "· " + m).join("\n")}` : ""}
                className="px-5 py-2 text-sm font-semibold text-white rounded-lg transition-opacity disabled:opacity-40 disabled:cursor-not-allowed" style={{ backgroundColor: BRAND.accent }}>
          {t("self.submitBtn")}
        </button>
      </div>
    </div>
  );
}

function FSAForm({ draft, setDraft, onCancel, onSubmit, control }) {
  const { lang, t } = useLang();
  const fileInputRef = useRef(null);
  const recommended = control ? recommendedSample(control.importance, control.frequency) : 0;

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    const newAttachments = files.map((f) => ({ name: f.name, size: formatBytes(f.size), file: f }));
    setDraft({ ...draft, attachments: [...(draft.attachments || []), ...newAttachments] });
    e.target.value = "";
  }
  function removeAttachment(idx) {
    setDraft({ ...draft, attachments: draft.attachments.filter((_, i) => i !== idx) });
  }

  return (
    <div className="bg-white border border-slate-200 rounded-xl p-5 mt-3 shadow-sm">
      <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-2.5">{t("fsa.riskLevel")}</p>
      <div className="grid grid-cols-3 gap-3 mb-4 max-w-2xl">
        {["green", "orange", "red"].map((r) => (
          <button
            key={r}
            onClick={() => setDraft({ ...draft, risk: r })}
            className="flex flex-col items-center justify-center gap-1.5 py-3.5 rounded-xl text-sm font-semibold border-2 transition-all"
            style={{
              borderColor: draft.risk === r ? RISK_META[r].color : "#E5E9EF",
              backgroundColor: draft.risk === r ? RISK_META[r].bg : "#fff",
              color: draft.risk === r ? RISK_META[r].text : "#94A3B8",
              boxShadow: draft.risk === r ? `0 2px 8px ${RISK_META[r].color}22` : "none",
            }}
          >
            <span className="w-3 h-3 rounded-full" style={{ backgroundColor: draft.risk === r ? RISK_META[r].color : "#CBD3DD" }} />
            {RISK_META[r][lang]}
          </button>
        ))}
      </div>
      <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{t("fsa.commentPlaceholder")}</p>
      <textarea
        className="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-[15px] text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400 resize-none"
        rows={3}
        placeholder={t("fsa.commentPlaceholder")}
        value={draft.comment}
        onChange={(e) => setDraft({ ...draft, comment: e.target.value })}
      />

      <div className="mt-4 grid grid-cols-2 gap-3 items-end">
        <div>
          <p className="text-[13px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{t("self.sampleCount")}</p>
          {control && (
            <p className="text-[11px] text-slate-400 mb-1.5">
              {t("self.recommendedNote")} {recommended}{t("common.items")} · {importanceLabel(control.importance, lang)} · {freqLabel(control.frequency, lang)}
            </p>
          )}
          <input
            type="number"
            min={0}
            className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400"
            value={draft.sampleSize}
            onChange={(e) => setDraft({ ...draft, sampleSize: Math.max(0, Number(e.target.value)) })}
          />
        </div>
        <div>
          <button
            type="button"
            onClick={() => fileInputRef.current?.click()}
            className="w-full flex items-center justify-center gap-1.5 border-2 border-dashed rounded-xl py-[13px] text-xs font-medium transition-colors"
            style={{ borderColor: "#B6C0CC", color: "#64748B" }}
            onMouseEnter={(e) => { e.currentTarget.style.borderColor = BRAND.accent; e.currentTarget.style.color = BRAND.accent; }}
            onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#B6C0CC"; e.currentTarget.style.color = "#64748B"; }}
          >
            <UploadCloud size={15} /> {t("self.attachBtn")}
          </button>
          <input ref={fileInputRef} type="file" multiple className="hidden" onChange={handleFiles} />
        </div>
      </div>

      {(draft.attachments || []).length > 0 && (
        <ul className="mt-3 space-y-1.5">
          {draft.attachments.map((a, i) => (
            <li key={i} className="flex items-center gap-2 text-xs text-slate-600 bg-slate-50 border border-slate-100 rounded-lg px-3 py-2">
              <Paperclip size={12} className="text-slate-400 flex-shrink-0" />
              <span className="truncate">{a.name}</span>
              {a.size && <span className="text-slate-400 flex-shrink-0">{a.size}</span>}
              <button onClick={() => removeAttachment(i)} className="ml-auto text-slate-300 hover:text-red-500 flex-shrink-0"><X size={12} /></button>
            </li>
          ))}
        </ul>
      )}

      <div className="flex justify-end gap-2 mt-4 pt-4 border-t border-slate-100">
        <button onClick={onCancel} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
        <button onClick={onSubmit} className="px-5 py-2 text-sm font-semibold text-white rounded-lg" style={{ backgroundColor: BRAND.accent }}>
          {t("fsa.submitBtn")}
        </button>
      </div>
    </div>
  );
}

function FSAPage({ controls, setControls, currentUser, addLog, isArchived, showToast, allowedDepts }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "" });
  const [detail, setDetail] = useState(null);

  const myEmail = (currentUser.email || "").toLowerCase();
  // FSA 최종 자가평가도 역할과 무관하게 본인이 1차 담당자(Accessor)로 배정된 항목만 대상이다.
  // Admin 도 예외가 아니며, 전사 현황은 부서별 통제 현황·대시보드에서 확인한다.
  const myControls = controls.filter((c) => (c.accessor || "").toLowerCase() === myEmail);

  const f = useAssessmentFilter(myControls, lang, users, departments);
  const isaDone = myControls.filter((c) => c.status === "completed");
  const todo = f.apply(isaDone.filter((c) => c.fsaStatus === "not_started" || c.fsaStatus === "returned" || !c.fsaStatus));
  const submitted = f.apply(isaDone.filter((c) => c.fsaStatus === "submitted_self" || c.fsaStatus === "completed"));
  const waitingIsa = myControls.filter((c) => c.status !== "completed").length;

  function startEdit(c) {
    setEditing(c.id);
    setDraft({
      risk: c.fsaRisk,
      comment: c.fsaComment || "",
      attachments: c.fsaAttachments || [],
      sampleSize: c.actualSample ?? recommendedSample(c.importance, c.frequency),
    });
  }
  async function submit(c) {
    // 리스크 수준은 선택 사항이다. 비워두면 대시보드에 「미평가」로 집계된다.
    const today = new Date().toISOString();  // SharePoint 저장값과 동일한 ISO — 표시 시점에 formatDateTime 이 KST 로 변환
    setEditing(null);
    try {
      // ISA 자가평가 첨부와 겹치지 않도록 별도 하위 폴더(FSA)에 업로드해서 SharePoint에 구분되게 쌓이게 한다.
      const finalAttachments = [];
      for (const att of draft.attachments || []) {
        if (att.webUrl) {
          finalAttachments.push({ name: att.name, webUrl: att.webUrl });
        } else if (att.file) {
          const uploaded = await icsUploadAttachment(c.requestSpId, att.file, "FSA");
          finalAttachments.push({ name: att.file.name, webUrl: uploaded.webUrl });
        }
      }
      const fsaAttachedFilesField = finalAttachments.map((a) => `${a.name}|${a.webUrl}`).join(";");

      await icsUpdateItem(ICS_LISTS.requests, c.requestSpId, {
        FsaStatus: "submitted_self",
        FsaRisk: draft.risk,
        FsaCommentKo: draft.comment,
        FsaCommentEn: draft.comment,
        FsaDate: new Date().toISOString(),
        FsaAttachedFiles: fsaAttachedFilesField,
        SampleCount: draft.sampleSize,
      });
      setControls((prev) =>
        prev.map((x) =>
          x.id === c.id
            ? { ...x, fsaStatus: "submitted_self", fsaRisk: draft.risk, fsaComment: draft.comment, fsaCommentEn: draft.comment, fsaDate: today, fsaAttachments: finalAttachments, actualSample: draft.sampleSize }
            : x
        )
      );
      addLog(currentUser.email, "fsa_submit", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Final self-assessment submitted." : "최종 자가평가가 제출되었습니다.");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    }
  }

  async function withdrawSubmission(c) {
    if (c.fsaStatus !== "submitted_self") return;
    const ok = window.confirm(lang === "en" ? "Withdraw this submission? It will move back to 'needs final assessment'." : "제출을 철회하시겠습니까? '최종평가 필요' 상태로 되돌아갑니다.");
    if (!ok) return;
    try {
      const stillPending = await icsCheckStillPending(ICS_LISTS.requests, c.requestSpId, "FsaStatus", "submitted_self");
      if (!stillPending) {
        alert(lang === "en" ? "The reviewer already processed this item, so it can no longer be withdrawn." : "검토자가 이미 처리한 항목이라 철회할 수 없습니다.");
        window.location.reload();
        return;
      }
      await icsUpdateItem(ICS_LISTS.requests, c.requestSpId, { FsaStatus: "not_started" });
      setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, fsaStatus: "not_started" } : x)));
      addLog(currentUser.email, "withdraw_fsa", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Submission withdrawn." : "제출이 철회되었습니다.");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    }
  }

  return (
    <div>
      <SectionHeader
        icon={ShieldCheck}
        title={t("fsa.title")}
        subtitle={`${pName(currentUser.name, lang, users)}${t("fsa.subtitleUser")}`}
      />
      <p className="text-sm text-slate-500 bg-white border border-slate-100 rounded-xl p-4 mb-6">{t("fsa.desc")}</p>

      <AssessmentFilterBar f={f} t={t} minItems={isaDone.length} />

      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
          <AlertTriangle size={15} className="text-amber-500" /> {t("fsa.needsAction")} ({todo.length})
        </h3>
        {todo.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm">
            <EmptyState text={waitingIsa > 0 ? t("fsa.waitingIsa") : t("fsa.noNeedsAction")} />
          </div>
        ) : (
          <div className="space-y-3">
            {todo.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                <div className="flex items-start justify-between gap-3 mb-1 cursor-pointer" onClick={() => setDetail(c)}>
                  <div>
                    <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                    <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <RiskBadge risk={c.selfRisk} />
                    {c.fsaStatus === "returned" && <StatusBadge status="returned" kind="fsa" />}
                  </div>
                </div>
                <p className="text-sm text-slate-500 mb-3 whitespace-pre-wrap">{cDesc(c, lang)}</p>
                <div className="bg-slate-50 rounded-lg p-3 mb-3 text-xs text-slate-500">
                  <p className="font-medium text-slate-600 mb-1">{t("review.selfAssessmentBy")}</p>
                  <p className="whitespace-pre-wrap">{lang === "en" ? c.selfCommentEn || c.selfComment : c.selfComment}</p>
                </div>

                {c.fsaStatus === "returned" && (
                  <div className="bg-red-50 rounded-lg p-3 mb-3 text-sm">
                    <p className="text-xs font-medium text-red-700 mb-1">{t("fsa.rejectReasonTitle")} ({personByEmail(c.reviewer, lang, users)})</p>
                    <p className="text-red-700 whitespace-pre-wrap">{lang === "en" ? c.fsaReviewCommentEn || c.fsaReviewComment : c.fsaReviewComment}</p>
                  </div>
                )}

                {editing === c.id && !isArchived ? (
                  <FSAForm draft={draft} setDraft={setDraft} onCancel={() => setEditing(null)} onSubmit={() => submit(c)} control={c} />
                ) : (
                  !isArchived && (
                    <button onClick={() => startEdit(c)} className="text-sm font-medium px-4 py-2 rounded-lg text-white" style={{ backgroundColor: BRAND.accent }}>
                      {t("fsa.writeBtn")}
                    </button>
                  )
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("fsa.submitted")} ({submitted.length})</h3>
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm divide-y divide-slate-100">
          {submitted.map((c) => (
            <div key={c.id} className="p-4">
              <div className="flex items-start justify-between gap-3 mb-1 cursor-pointer" onClick={() => setDetail(c)}>
                <div>
                  <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                  <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <RiskBadge risk={c.fsaRisk} />
                  <StatusBadge status={c.fsaStatus} kind="fsa" />
                </div>
              </div>
              <div>
                <div className="flex items-center justify-between">
                  <p className="text-sm text-slate-500 whitespace-pre-wrap">{lang === "en" ? c.fsaCommentEn || c.fsaComment : c.fsaComment}</p>
                  {c.fsaStatus === "submitted_self" && !isArchived && (
                    <button onClick={() => withdrawSubmission(c)} className="text-xs text-red-400 hover:text-red-600 flex items-center gap-1 flex-shrink-0 ml-3">
                      <Undo2 size={12} /> {t("fsa.withdrawBtn")}
                    </button>
                  )}
                </div>
                {c.fsaStatus === "completed" && c.fsaReviewComment && (
                  <div className="bg-slate-50 rounded-lg p-2.5 mt-2 text-xs text-slate-500">
                    <span className="font-medium text-slate-600">{t("fsaReview.title")} ({personByEmail(c.reviewer, lang, users)})</span>{" "}
                    <span className="whitespace-pre-wrap">{lang === "en" ? c.fsaReviewCommentEn || c.fsaReviewComment : c.fsaReviewComment}</span>
                  </div>
                )}
              </div>
            </div>
          ))}
          {submitted.length === 0 && <EmptyState text={t("fsa.noSubmitted")} />}
        </div>
      </div>

      {detail && (
        <Modal title={`${detail.code} · ${cName(detail, lang)}`} onClose={() => setDetail(null)} wide>
          <ControlDetailBody control={detail} />
        </Modal>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* FSA 2차검토 (담당자가 제출한 최종 자가평가를 검토자가 승인/반려)                 */
/* ------------------------------------------------------------------ */

function FSAReviewPage({ controls, setControls, currentUser, addLog, isArchived, showToast, allowedDepts }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "" });
  const [returning, setReturning] = useState(null);
  const [returnComment, setReturnComment] = useState("");
  const [detail, setDetail] = useState(null);

  // 이메일은 마스터 표기(대문자 혼입)와 M365 토큰 값이 다를 수 있어 항상 소문자로 맞춰 비교한다.
  const myEmail = (currentUser.email || "").toLowerCase();
  const isMyReview = (c) => (c.reviewer || "").toLowerCase() === myEmail;
  // 검토도 본인이 2차 검토자(Reviewer)로 배정된 항목만 대상이다.
  // 부서 접근권한(allowedDepts)은 조회 범위를 정하는 값이라 검토 대상 판단에는 쓰지 않는다.
  const inScope = controls.filter((c) => isMyReview(c));
  const f = useAssessmentFilter(inScope, lang, users, departments);
  const pending = f.apply(inScope.filter((c) => c.fsaStatus === "submitted_self"));
  const done = f.apply(inScope.filter((c) => c.fsaStatus === "completed" || c.fsaStatus === "returned"));

  function startEdit(c) {
    setEditing(c.id);
    setDraft({ risk: c.fsaRisk, comment: "" });
  }
  async function approve(c) {
    if (!draft.risk) return;
    const today = new Date().toISOString();  // SharePoint 저장값과 동일한 ISO — 표시 시점에 formatDateTime 이 KST 로 변환
    setEditing(null);
    try {
      const stillPending = await icsCheckStillPending(ICS_LISTS.requests, c.requestSpId, "FsaStatus", "submitted_self");
      if (!stillPending) {
        alert(lang === "en" ? "This item was already processed by someone else. Refreshing the list." : "이미 다른 사람이 처리한 항목입니다. 목록을 새로고침합니다.");
        window.location.reload();
        return;
      }
      await icsUpdateItem(ICS_LISTS.requests, c.requestSpId, {
        FsaStatus: "completed",
        FsaReviewRisk: draft.risk,
        FsaReviewCommentKo: draft.comment,
        FsaReviewCommentEn: draft.comment,
        FsaReviewDate: new Date().toISOString(),
      });
      setControls((prev) =>
        prev.map((x) =>
          x.id === c.id ? { ...x, fsaStatus: "completed", fsaReviewRisk: draft.risk, fsaReviewComment: draft.comment, fsaReviewCommentEn: draft.comment, fsaReviewDate: today } : x
        )
      );
      addLog(currentUser.email, "fsa_review_complete", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "FSA review confirmed." : "FSA 검토가 완료되었습니다.");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    }
  }
  async function reject(c) {
    const today = new Date().toISOString();  // SharePoint 저장값과 동일한 ISO — 표시 시점에 formatDateTime 이 KST 로 변환
    setReturning(null);
    try {
      const stillPending = await icsCheckStillPending(ICS_LISTS.requests, c.requestSpId, "FsaStatus", "submitted_self");
      if (!stillPending) {
        alert(lang === "en" ? "This item was already processed by someone else. Refreshing the list." : "이미 다른 사람이 처리한 항목입니다. 목록을 새로고침합니다.");
        window.location.reload();
        return;
      }
      await icsUpdateItem(ICS_LISTS.requests, c.requestSpId, {
        FsaStatus: "returned",
        FsaReviewRisk: "red",
        FsaReviewCommentKo: returnComment,
        FsaReviewCommentEn: returnComment,
        FsaReviewDate: new Date().toISOString(),
      });
      setControls((prev) =>
        prev.map((x) =>
          x.id === c.id ? { ...x, fsaStatus: "returned", fsaReviewRisk: "red", fsaReviewComment: returnComment, fsaReviewCommentEn: returnComment, fsaReviewDate: today } : x
        )
      );
      addLog(currentUser.email, "fsa_review_reject", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Returned to the accessor." : "담당자에게 반려되었습니다.");
      setReturnComment("");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    }
  }

  return (
    <div>
      <SectionHeader
        icon={CheckCircle2}
        title={t("fsaReview.title")}
        subtitle={`${pName(currentUser.name, lang, users)}${t("fsaReview.subtitleUser")}`}
      />

      <AssessmentFilterBar f={f} t={t} minItems={inScope.length} />

      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("fsaReview.pending")} ({pending.length})</h3>
        {pending.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm"><EmptyState text={t("fsaReview.noPending")} /></div>
        ) : (
          <div className="space-y-3">
            {pending.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                <div className="flex items-start justify-between gap-3 mb-2 cursor-pointer" onClick={() => setDetail(c)}>
                  <div>
                    <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                    <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                  </div>
                  <StatusBadge status={c.fsaStatus} kind="fsa" />
                </div>
                <div className="bg-slate-50 rounded-lg p-3 mb-3">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-xs font-medium text-slate-500">{t("fsaReview.selfAssessmentBy")} ({personByEmail(c.accessor, lang, users)})</p>
                    <RiskBadge risk={c.fsaRisk} />
                  </div>
                  <p className="text-sm text-slate-600 whitespace-pre-wrap">{lang === "en" ? c.fsaCommentEn || c.fsaComment : c.fsaComment}</p>
                </div>

                {editing === c.id && !isArchived ? (
                  <div className="border border-slate-200 rounded-xl p-4 max-w-xl bg-white">
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2.5">{t("review.reviewResult")}</p>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      {["green", "orange", "red"].map((r) => (
                        <button
                          key={r}
                          onClick={() => setDraft({ ...draft, risk: r })}
                          className="flex flex-col items-center justify-center gap-1 py-3 rounded-lg text-sm font-semibold border-2 transition-all"
                          style={{ borderColor: draft.risk === r ? RISK_META[r].color : "#E5E9EF", backgroundColor: draft.risk === r ? RISK_META[r].bg : "#fff", color: draft.risk === r ? RISK_META[r].text : "#94A3B8" }}
                        >
                          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: draft.risk === r ? RISK_META[r].color : "#CBD3DD" }} />
                          {RISK_META[r][lang]}
                        </button>
                      ))}
                    </div>
                    <textarea className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400 resize-none" rows={2} placeholder={t("review.reviewCommentPlaceholder")} value={draft.comment} onChange={(e) => setDraft({ ...draft, comment: e.target.value })} />
                    <div className="flex justify-end gap-2 mt-3">
                      <button onClick={() => setEditing(null)} className="px-3 py-1.5 text-xs text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
                      <button onClick={() => approve(c)} disabled={!draft.risk} className="px-4 py-1.5 text-xs font-medium text-white rounded-lg disabled:opacity-40 flex items-center gap-1" style={{ backgroundColor: BRAND.accent }}>
                        <Check size={13} /> {t("review.confirmBtn")}
                      </button>
                    </div>
                  </div>
                ) : returning === c.id && !isArchived ? (
                  <div className="border border-red-100 rounded-lg p-3">
                    <p className="text-xs font-medium text-red-600 mb-2">{t("review.rejectReasonLabel")}</p>
                    <textarea className={inputCls} rows={2} placeholder={t("review.rejectReasonPlaceholder")} value={returnComment} onChange={(e) => setReturnComment(e.target.value)} />
                    <div className="flex justify-end gap-2 mt-3">
                      <button onClick={() => setReturning(null)} className="px-3 py-1.5 text-xs text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
                      <button onClick={() => reject(c)} disabled={!returnComment.trim()} className="px-4 py-1.5 text-xs font-medium text-white bg-red-500 rounded-lg disabled:opacity-40 flex items-center gap-1">
                        <Undo2 size={13} /> {t("review.rejectBtn")}
                      </button>
                    </div>
                  </div>
                ) : (
                  !isArchived && (
                    <div className="flex gap-2">
                      <button onClick={() => startEdit(c)} className="text-sm font-medium px-4 py-2 rounded-lg text-white" style={{ backgroundColor: BRAND.accent }}>{t("review.reviewBtn")}</button>
                      <button onClick={() => setReturning(c.id)} className="text-sm font-medium px-4 py-2 rounded-lg text-red-600 border border-red-200 hover:bg-red-50">{t("review.rejectBtn")}</button>
                    </div>
                  )
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("fsaReview.done")} ({done.length})</h3>
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm divide-y divide-slate-100">
          {done.map((c) => (
            <div key={c.id} className="p-4 flex items-start justify-between gap-3 cursor-pointer hover:bg-slate-50" onClick={() => setDetail(c)}>
              <div>
                <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                <p className="font-medium text-slate-800 mb-1">{cName(c, lang)}</p>
                <p className="text-sm text-slate-500 whitespace-pre-wrap">{lang === "en" ? c.fsaReviewCommentEn || c.fsaReviewComment : c.fsaReviewComment}</p>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <RiskBadge risk={c.fsaReviewRisk} />
                <StatusBadge status={c.fsaStatus} kind="fsa" />
              </div>
            </div>
          ))}
          {done.length === 0 && <EmptyState text={t("fsaReview.noDone")} />}
        </div>
      </div>

      {detail && (
        <Modal title={`${detail.code} · ${cName(detail, lang)}`} onClose={() => setDetail(null)} wide>
          <ControlDetailBody control={detail} />
        </Modal>
      )}
    </div>
  );
}

function ReviewPage({ controls, setControls, currentUser, addLog, isArchived, showToast, allowedDepts }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "" });
  const [returning, setReturning] = useState(null);
  const [returnComment, setReturnComment] = useState("");
  const [detail, setDetail] = useState(null);

  // 이메일은 마스터 표기(대문자 혼입)와 M365 토큰 값이 다를 수 있어 항상 소문자로 맞춰 비교한다.
  const myEmail = (currentUser.email || "").toLowerCase();
  const isMyReview = (c) => (c.reviewer || "").toLowerCase() === myEmail;
  // 검토도 본인이 2차 검토자(Reviewer)로 배정된 항목만 대상이다.
  // 부서 접근권한(allowedDepts)은 조회 범위를 정하는 값이라 검토 대상 판단에는 쓰지 않는다.
  const inScope = controls.filter((c) => isMyReview(c));
  const f = useAssessmentFilter(inScope, lang, users, departments);
  const pending = f.apply(inScope.filter((c) => c.status === "submitted_self"));
  const done = f.apply(inScope.filter((c) => c.status === "completed" || c.status === "returned"));

  function startEdit(c) {
    setEditing(c.id);
    setDraft({ risk: c.selfRisk, comment: "" });
  }
  async function approve(c) {
    if (!draft.risk) return;
    const today = new Date().toISOString();  // SharePoint 저장값과 동일한 ISO — 표시 시점에 formatDateTime 이 KST 로 변환
    setEditing(null);
    try {
      const stillPending = await icsCheckStillPending(ICS_LISTS.requests, c.requestSpId, "Status", "submitted_self");
      if (!stillPending) {
        alert(lang === "en" ? "This item was already processed by someone else. Refreshing the list." : "이미 다른 사람이 처리한 항목입니다. 목록을 새로고침합니다.");
        window.location.reload();
        return;
      }
      await icsUpdateItem(ICS_LISTS.requests, c.requestSpId, {
        Status: "completed",
        ReviewRisk: draft.risk,
        ReviewCommentKo: draft.comment,
        ReviewCommentEn: draft.comment,
        ReviewDate: new Date().toISOString(),
      });
      setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, status: "completed", reviewRisk: draft.risk, reviewComment: draft.comment, reviewCommentEn: draft.comment, reviewDate: today } : x)));
      addLog(currentUser.email, "review_complete", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Review confirmed." : "검토가 완료되었습니다.");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    }
  }
  async function reject(c) {
    const today = new Date().toISOString();  // SharePoint 저장값과 동일한 ISO — 표시 시점에 formatDateTime 이 KST 로 변환
    setReturning(null);
    try {
      const stillPending = await icsCheckStillPending(ICS_LISTS.requests, c.requestSpId, "Status", "submitted_self");
      if (!stillPending) {
        alert(lang === "en" ? "This item was already processed by someone else. Refreshing the list." : "이미 다른 사람이 처리한 항목입니다. 목록을 새로고침합니다.");
        window.location.reload();
        return;
      }
      await icsUpdateItem(ICS_LISTS.requests, c.requestSpId, {
        Status: "returned",
        ReviewRisk: "red",
        ReviewCommentKo: returnComment,
        ReviewCommentEn: returnComment,
        ReviewDate: new Date().toISOString(),
      });
      setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, status: "returned", reviewRisk: "red", reviewComment: returnComment, reviewCommentEn: returnComment, reviewDate: today } : x)));
      addLog(currentUser.email, "review_reject", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Returned to the accessor." : "담당자에게 반려되었습니다.");
      setReturnComment("");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    }
  }

  return (
    <div>
      <SectionHeader
        icon={ClipboardCheck}
        title={t("review.title")}
        subtitle={`${pName(currentUser.name, lang, users)}${t("review.subtitleUser")}`}
      />

      <AssessmentFilterBar f={f} t={t} minItems={inScope.length} />


      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("review.pending")} ({pending.length})</h3>
        {pending.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm"><EmptyState text={t("review.noPending")} /></div>
        ) : (
          <div className="space-y-3">
            {pending.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                <div className="flex items-start justify-between gap-3 mb-2 cursor-pointer" onClick={() => setDetail(c)}>
                  <div>
                    <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                    <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                  </div>
                  <StatusBadge status={c.status} kind="isa" />
                </div>
                <div className="bg-slate-50 rounded-lg p-3 mb-3">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-xs font-medium text-slate-500">{t("review.selfAssessmentBy")} ({personByEmail(c.accessor, lang, users)})</p>
                    <RiskBadge risk={c.selfRisk} />
                  </div>
                  <p className="text-sm text-slate-600 mb-2 whitespace-pre-wrap">{lang === "en" ? c.selfCommentEn || c.selfComment : c.selfComment}</p>
                  <div className="flex items-center gap-3 text-xs text-slate-500">
                    <span>{t("self.sampleCount")} {c.actualSample ?? "-"}{t("common.items")} ({t("self.recommendedShort")} {recommendedSample(c.importance, c.frequency)}{t("common.items")})</span>
                  </div>
                  {(c.attachments || []).length > 0 ? (
                    <ul className="mt-2 space-y-1">
                      {c.attachments.map((a, i) => (
                        <li key={i} className="flex items-center gap-2 text-xs text-slate-600 bg-white border border-slate-100 rounded-lg px-3 py-1.5">
                          <Paperclip size={12} className="text-slate-400 flex-shrink-0" />
                          {a.webUrl ? (
                            <button type="button" onClick={() => icsDownloadAttachment(c.requestSpId, a.name)} className="truncate hover:underline text-left bg-transparent border-0 p-0 cursor-pointer" style={{ color: BRAND.accent }}>{a.name}</button>
                          ) : (
                            <span className="truncate">{a.name}</span>
                          )}
                          {a.size && <span className="text-slate-400 flex-shrink-0 ml-auto">{a.size}</span>}
                        </li>
                      ))}
                    </ul>
                  ) : (
                    <p className="text-xs text-slate-400 mt-2 flex items-center gap-1"><Paperclip size={11} /> {t("review.noAttachments")}</p>
                  )}
                </div>

                {editing === c.id && !isArchived ? (
                  <div className="border border-slate-200 rounded-xl p-4 max-w-xl bg-white">
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2.5">{t("review.reviewResult")}</p>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      {["green", "orange", "red"].map((r) => (
                        <button
                          key={r}
                          onClick={() => setDraft({ ...draft, risk: r })}
                          className="flex flex-col items-center justify-center gap-1 py-3 rounded-lg text-sm font-semibold border-2 transition-all"
                          style={{ borderColor: draft.risk === r ? RISK_META[r].color : "#E5E9EF", backgroundColor: draft.risk === r ? RISK_META[r].bg : "#fff", color: draft.risk === r ? RISK_META[r].text : "#94A3B8" }}
                        >
                          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: draft.risk === r ? RISK_META[r].color : "#CBD3DD" }} />
                          {RISK_META[r][lang]}
                        </button>
                      ))}
                    </div>
                    <textarea className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400 resize-none" rows={2} placeholder={t("review.reviewCommentPlaceholder")} value={draft.comment} onChange={(e) => setDraft({ ...draft, comment: e.target.value })} />
                    <div className="flex justify-end gap-2 mt-3">
                      <button onClick={() => setEditing(null)} className="px-3 py-1.5 text-xs text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
                      <button onClick={() => approve(c)} disabled={!draft.risk} className="px-4 py-1.5 text-xs font-medium text-white rounded-lg disabled:opacity-40 flex items-center gap-1" style={{ backgroundColor: BRAND.accent }}>
                        <Check size={13} /> {t("review.confirmBtn")}
                      </button>
                    </div>
                  </div>
                ) : returning === c.id && !isArchived ? (
                  <div className="border border-red-100 rounded-lg p-3">
                    <p className="text-xs font-medium text-red-600 mb-2">{t("review.rejectReasonLabel")}</p>
                    <textarea className={inputCls} rows={2} placeholder={t("review.rejectReasonPlaceholder")} value={returnComment} onChange={(e) => setReturnComment(e.target.value)} />
                    <div className="flex justify-end gap-2 mt-3">
                      <button onClick={() => setReturning(null)} className="px-3 py-1.5 text-xs text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
                      <button onClick={() => reject(c)} disabled={!returnComment.trim()} className="px-4 py-1.5 text-xs font-medium text-white bg-red-500 rounded-lg disabled:opacity-40 flex items-center gap-1">
                        <Undo2 size={13} /> {t("review.rejectBtn")}
                      </button>
                    </div>
                  </div>
                ) : (
                  !isArchived && (
                    <div className="flex gap-2">
                      <button onClick={() => startEdit(c)} className="text-sm font-medium px-4 py-2 rounded-lg text-white" style={{ backgroundColor: BRAND.accent }}>{t("review.reviewBtn")}</button>
                      <button onClick={() => setReturning(c.id)} className="text-sm font-medium px-4 py-2 rounded-lg text-red-600 border border-red-200 hover:bg-red-50">{t("review.rejectBtn")}</button>
                    </div>
                  )
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("review.done")} ({done.length})</h3>
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm divide-y divide-slate-100">
          {done.map((c) => (
            <div key={c.id} className="p-4 flex items-start justify-between gap-3 cursor-pointer hover:bg-slate-50" onClick={() => setDetail(c)}>
              <div>
                <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                <p className="font-medium text-slate-800 mb-1">{cName(c, lang)}</p>
                <p className="text-sm text-slate-500 whitespace-pre-wrap">{lang === "en" ? c.reviewCommentEn || c.reviewComment : c.reviewComment}</p>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <RiskBadge risk={c.reviewRisk} />
                <StatusBadge status={c.status} kind="isa" />
              </div>
            </div>
          ))}
          {done.length === 0 && <EmptyState text={t("review.noDone")} />}
        </div>
      </div>

      {detail && (
        <Modal title={`${detail.code} · ${cName(detail, lang)}`} onClose={() => setDetail(null)} wide>
          <ControlDetailBody control={detail} />
        </Modal>
      )}
    </div>
  );
}
