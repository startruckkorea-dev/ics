function exportControlsToExcel(controls, lang, departments = INITIAL_DEPARTMENTS, users = INITIAL_USERS) {
  const en = lang === "en";
  const L = (ko, eng) => (en ? eng : ko);
  const risk = (r) => (r ? RISK_META[r][lang] : RISK_META.none[lang]);
  // 첨부는 이름만 모아 한 칸에 담는다. 줄바꿈으로 구분해 엑셀에서 셀 안에서 읽힌다.
  const attNames = (list) => (list || []).map((a) => a.name).filter(Boolean).join("\n");

  const rows = controls.map((c) => ({
    [L("코드", "Code")]: c.code,
    [L("통제명", "Control name")]: cName(c, lang),
    [L("통제 설명", "Description")]: cDesc(c, lang) || "",
    [L("부서", "Department")]: deptName(c.dept, lang, departments),
    [L("통제영역", "Component")]: catName(c.cat, lang),
    [L("1차 담당자", "1st Accessor")]: personByEmail(c.accessor, lang, users),
    [L("2차 검토자", "2nd Reviewer")]: personByEmail(c.reviewer, lang, users),
    [L("점검빈도", "Frequency")]: freqLabel(c.frequency, lang),
    [L("중요도", "Importance")]: importanceLabel(c.importance, lang),
    [L("권장 샘플링(건)", "Recommended sample")]: recommendedSample(c.importance, c.frequency),
    [L("실제 샘플링(건)", "Actual sample")]: c.actualSample ?? "",
    [L("상태", "Status")]: STATUS_META[c.status][lang],
    [L("최종 신호등", "Final result")]: risk(finalRisk(c) === "none" ? null : finalRisk(c)),

    // ── ISA 1차 자가평가 ──
    [L("1차 신호등", "ISA 1st result")]: risk(c.selfRisk),
    [L("1차 평가 근거", "ISA 1st rationale")]: (en ? c.selfCommentEn || c.selfComment : c.selfComment) || "",
    [L("1차 제출일시", "ISA 1st submitted")]: formatDateTime(c.selfDate, lang),
    [L("1차 첨부 수", "ISA 1st attachments")]: (c.attachments || []).length,
    [L("1차 첨부 파일명", "ISA 1st file names")]: attNames(c.attachments),

    // ── ISA 2차 검토 ──
    [L("2차 신호등", "ISA 2nd result")]: risk(c.reviewRisk),
    [L("2차 검토 의견", "ISA 2nd comment")]: (en ? c.reviewCommentEn || c.reviewComment : c.reviewComment) || "",
    [L("2차 검토일시", "ISA 2nd reviewed")]: formatDateTime(c.reviewDate, lang),

    // ── FSA 최종 자가평가 ──
    [L("FSA 상태", "FSA status")]: STATUS_META[c.fsaStatus || "not_started"][lang],
    [L("FSA 신호등", "FSA result")]: risk(c.fsaRisk),
    [L("FSA 평가 근거", "FSA rationale")]: (en ? c.fsaCommentEn || c.fsaComment : c.fsaComment) || "",
    [L("FSA 제출일시", "FSA submitted")]: formatDateTime(c.fsaDate, lang),
    [L("FSA 첨부 수", "FSA attachments")]: (c.fsaAttachments || []).length,
    [L("FSA 첨부 파일명", "FSA file names")]: attNames(c.fsaAttachments),

    // ── FSA 2차 검토 ──
    [L("FSA 2차 신호등", "FSA 2nd result")]: risk(c.fsaReviewRisk),
    [L("FSA 2차 의견", "FSA 2nd comment")]: (en ? c.fsaReviewCommentEn || c.fsaReviewComment : c.fsaReviewComment) || "",
    [L("FSA 2차 검토일시", "FSA 2nd reviewed")]: formatDateTime(c.fsaReviewDate, lang),
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  const keys = Object.keys(rows[0] || {});
  // 긴 글이 들어가는 열은 넓게, 나머지는 기본 폭으로 잡는다.
  const WIDE = new Set([
    L("통제명", "Control name"), L("통제 설명", "Description"),
    L("1차 평가 근거", "ISA 1st rationale"), L("2차 검토 의견", "ISA 2nd comment"),
    L("FSA 평가 근거", "FSA rationale"), L("FSA 2차 의견", "FSA 2nd comment"),
    L("1차 첨부 파일명", "ISA 1st file names"), L("FSA 첨부 파일명", "FSA file names"),
  ]);
  ws["!cols"] = keys.map((k) => ({ wch: WIDE.has(k) ? 42 : 16 }));
  // 첫 행 고정 + 자동 필터로 248건을 다루기 쉽게 한다.
  ws["!freeze"] = { xSplit: 0, ySplit: 1 };
  if (rows.length) ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: keys.length - 1 } }) };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, en ? "Internal Control Status" : "내부통제 현황");
  XLSX.writeFile(wb, `internal_control_status_${new Date(new Date().getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10)}.xlsx`);
}

// 통제 항목 변경(수정·삭제) 결재 승인 화면.
// 별도 접근 권한 없이 전 직원이 들어올 수 있고, 본인에게 배정된 건만 표시된다.
function ApprovalPage({ controls, setControls, currentUser, addLog, showToast, isArchived }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [requests, setRequests] = useState([]);
  const [loading, setLoading] = useState(true);
  const [acting, setActing] = useState(null);
  const [comment, setComment] = useState({});
  const myEmail = (currentUser.email || "").toLowerCase();

  async function reload() {
    setLoading(true);
    try { setRequests(await loadIcsChangeRequests()); }
    catch (e) { console.warn("[ICS] 변경 요청 로드 실패:", e.message); setRequests([]); }
    finally { setLoading(false); }
  }
  useEffect(() => { reload(); }, []);

  // 내 차례인 건 = 진행 중 && 현재 단계의 승인자가 나
  const myTurn = requests.filter((r) => {
    if (r.status !== "pending") return false;
    const cur = r.steps[r.step - 1];
    return cur && (cur.approver || "").toLowerCase() === myEmail && cur.status === "pending";
  });
  // 내가 올린 요청
  const mine = requests.filter((r) => r.requester === myEmail && r.status !== "cancelled");

  function labelOf(r) {
    const c = controls.find((x) => x.code === r.code && x.year === r.year);
    return c ? cName(c, lang) : r.code;
  }

  // 요청자가 아직 진행 중인 자기 요청을 거둔다.
  // 이미 한 단계라도 승인된 경우에도 취소할 수 있다 (원본은 아직 바뀌지 않았으므로).
  async function cancelRequest(r) {
    if (r.requester !== myEmail || r.status !== "pending") return;
    const ok = window.confirm(lang === "en"
      ? "Withdraw this change request? Approvers will no longer see it."
      : "이 변경 요청을 취소하시겠습니까? 결재자 목록에서도 사라집니다.");
    if (!ok) return;
    setActing(r.spId);
    try {
      await icsUpdateItem(ICS_LISTS.changeRequests, r.spId, { Status: "cancelled" });
      addLog(currentUser.email, "cancel_change", r.code, labelOf(r), labelOf(r));
      showToast(lang === "en" ? "Request withdrawn." : "요청이 취소되었습니다.");
      await reload();
    } catch (e) {
      console.warn("[ICS] 요청 취소 실패:", e.message);
      alert(lang === "en" ? "Failed to withdraw the request." : "요청 취소에 실패했습니다.");
    } finally {
      setActing(null);
    }
  }

  async function act(r, approved) {
    if (isArchived) return;
    setActing(r.spId);
    try {
      // 다른 결재자나 다른 탭에서 이미 처리했는지 확인한다.
      // 확인 없이 진행하면 뒤 요청이 앞 결과를 덮어써 승인이 반려로 뒤집힐 수 있다.
      // Step 만 보면 안 된다 — 반려·취소는 Step 을 그대로 두고 Status 만 바꾸기 때문에,
      // 목록을 열어둔 다른 결재자가 이미 반려된 건을 승인으로 뒤집고 통제 항목까지
      // 실제로 반영해 버릴 수 있었다. Status 와 Step 을 함께 확인한다.
      const stillMyTurn = await icsCheckChangeRequestTurn(r.spId, r.step);
      if (!stillMyTurn) {
        alert(lang === "en"
          ? "This request has already been processed by someone else. The list will be refreshed."
          : "이미 다른 결재자가 처리한 요청입니다. 목록을 새로 불러옵니다.");
        await reload();
        return;
      }
      const steps = r.steps.map((st, i) => (i === r.step - 1
        ? { ...st, status: approved ? "approved" : "rejected",
            comment: (comment[r.spId] || "").trim(), date: new Date().toISOString() }
        : st));
      const isLast = r.step >= steps.length;
      const nextStep = approved && !isLast ? r.step + 1 : r.step;
      const nextStatus = !approved ? "rejected" : (isLast ? "approved" : "pending");

      // 최종 승인이면 통제 항목을 먼저 반영하고, 성공한 뒤에 요청을 승인으로 닫는다.
      // 순서를 반대로 하면(예전 코드) 반영이 실패했을 때 요청만 approved 로 남는다.
      // 그러면 그 건은 결재 대기 목록에서 사라지는데 통제 항목은 바뀌지 않은 채라
      // 되돌릴 방법도, 알아챌 방법도 없다. 지금 순서에서는 반영이 실패하면 요청이
      // pending 으로 남아 결재자가 다시 시도할 수 있다. 반대로 반영은 됐는데 요청
      // PATCH 가 실패하면 같은 건이 한 번 더 보이지만, 같은 값을 다시 쓰는 것이라
      // 결과가 달라지지 않는다(삭제는 이미 사라진 항목이라 아래 「없음」 안내로 빠진다).
      let applied = null;
      if (nextStatus === "approved") {
        const target = controls.find((x) => x.code === r.code && x.year === r.year);
        if (!target) {
          // 결재 진행 중에 대상 통제 항목이 사라진 경우(다른 삭제 요청이 먼저 승인되는 등).
          // 예전에는 조용히 넘어가 승인자가 반영된 것으로 오해할 수 있었다.
          alert(lang === "en"
            ? `The control item (${r.code}) no longer exists, so the change could not be applied. The request has been closed as approved — please contact IT.`
            : `대상 통제 항목(${r.code})이 존재하지 않아 변경 내용을 반영하지 못했습니다. 요청은 승인 상태로 종료되었습니다. IT로 문의해 주세요.`);
        }
        if (target) {
          if (r.reqType === "delete") {
            if (target.spId) await icsDeleteItem(ICS_LISTS.controls, target.spId);
            applied = { kind: "delete", target };
          } else {
            const pl = r.payload || {};
            if (target.spId) {
              await icsUpdateItem(ICS_LISTS.controls, target.spId, {
                Dept: pl.dept, Category: pl.cat, NameKo: pl.name, NameEn: pl.name,
                DescKo: pl.desc, DescEn: pl.desc,
                AccessorEmail: pl.accessor, ReviewerEmail: pl.reviewer,
                Frequency: pl.frequency, Importance: pl.importance,
              });
            }
            applied = { kind: "edit", target, pl };
          }
        }
      }

      await icsUpdateItem(ICS_LISTS.changeRequests, r.spId, {
        Steps: JSON.stringify(steps), Step: nextStep, Status: nextStatus,
      });

      // 화면 반영은 두 저장이 모두 끝난 뒤에 한다. 먼저 지워 버리면 요청 PATCH 가
      // 실패했을 때 화면과 서버가 어긋난다.
      if (applied && applied.kind === "delete") {
        setControls((prev) => prev.filter((x) => x.id !== applied.target.id));
      } else if (applied && applied.kind === "edit") {
        const pl = applied.pl;
        setControls((prev) => prev.map((x) => (x.id === applied.target.id
          ? { ...x, dept: pl.dept, cat: pl.cat, name: pl.name, nameEn: pl.name,
              desc: pl.desc, descEn: pl.desc, accessor: pl.accessor, reviewer: pl.reviewer,
              frequency: pl.frequency, importance: pl.importance }
          : x)));
      }

      addLog(currentUser.email, approved ? "approve_change" : "reject_change", r.code, labelOf(r), labelOf(r));
      showToast(approved
        ? (nextStatus === "approved"
            ? (lang === "en" ? "Approved. The change has been applied." : "승인되었습니다. 변경 내용이 반영되었습니다.")
            : (lang === "en" ? "Approved. Sent to the next approver." : "승인되었습니다. 다음 결재자에게 전달됩니다."))
        : (lang === "en" ? "Request rejected." : "요청이 반려되었습니다."));
      setComment((prev) => ({ ...prev, [r.spId]: "" }));
      await reload();
    } catch (e) {
      console.warn("[ICS] 결재 처리 실패:", e.message);
      alert(lang === "en" ? "Failed to process the approval." : "결재 처리에 실패했습니다. 잠시 후 다시 시도해 주세요.");
    } finally {
      setActing(null);
    }
  }

  const stepLabel = (st) => {
    if (st.role === "LM1" || st.role === "MC") return t("approval.stepLm1");
    if (st.role === "LM2") return t("approval.stepLm2");
    if (st.role === "ICS_CONTACT") return t("approval.stepContact");
    return t("approval.stepFinal");
  };

  function StepTrail({ r }) {
    return (
      <div className="flex flex-wrap items-center gap-2 mt-2">
        {r.steps.map((st, i) => {
          const cur = r.status === "pending" && i === r.step - 1;
          const bg = st.status === "approved" ? "#DCFCE7" : st.status === "rejected" ? "#FEE2E2" : cur ? "#E4F1F0" : "#F1F5F9";
          const fg = st.status === "approved" ? "#15803D" : st.status === "rejected" ? "#B91C1C" : cur ? BRAND.accent : "#94A3B8";
          return (
            <span key={i} className="text-xs px-2.5 py-1 rounded-full whitespace-nowrap"
                  style={{ backgroundColor: bg, color: fg }}
                  title={`${personByEmail(st.approver, lang, users)}${st.comment ? " · " + st.comment : ""}`}>
              {i + 1}. {stepLabel(st)} · {personByEmail(st.approver, lang, users)}
              {st.status === "approved" ? " ✓" : st.status === "rejected" ? " ✕" : ""}
            </span>
          );
        })}
      </div>
    );
  }

  return (
    <div>
      <SectionHeader icon={ClipboardCheck} title={t("approval.title")} subtitle={t("approval.subtitle")} />

      {loading ? (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-8 flex items-center justify-center gap-2 text-sm text-slate-500">
          <Loader2 size={16} className="animate-spin" /> {t("common.loading")}
        </div>
      ) : (
        <>
          <div className="mb-6">
            <h3 className="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
              <AlertTriangle size={15} className="text-amber-500" /> {t("approval.myTurn")} ({myTurn.length})
            </h3>
            {myTurn.length === 0 ? (
              <EmptyState text={t("approval.noTurn")} />
            ) : (
              <div className="space-y-3">
                {myTurn.map((r) => (
                  <div key={r.spId} className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                    <div className="flex items-start justify-between gap-3 flex-wrap">
                      <div className="min-w-0">
                        <p className="text-xs text-slate-400 font-mono">{r.code} · {r.year}</p>
                        <p className="text-sm font-semibold text-slate-800 mt-0.5">{labelOf(r)}</p>
                      </div>
                      <span className="text-xs px-2.5 py-1 rounded-full font-medium whitespace-nowrap"
                            style={{ backgroundColor: r.reqType === "delete" ? "#FEE2E2" : "#E4F1F0",
                                     color: r.reqType === "delete" ? "#B91C1C" : BRAND.accent }}>
                        {r.reqType === "delete" ? t("approval.typeDelete") : t("approval.typeEdit")}
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 mt-1.5">
                      {t("approval.requestedBy")} {personByEmail(r.requester, lang, users)} · {formatDateTime(r.created, lang)}
                    </p>

                    {r.payload?.reason && (
                      <div className="rounded-lg p-3 mt-3 text-xs" style={{ backgroundColor: "#FEF9E7", color: "#7A5C10" }}>
                        <p className="font-medium mb-1">{t("self.reqReasonLabel")}</p>
                        <p className="whitespace-pre-wrap">{r.payload.reason}</p>
                      </div>
                    )}
                    {r.reqType === "edit" && (
                      <div className="bg-slate-50 rounded-lg p-3 mt-3 text-xs text-slate-600 space-y-1">
                        <p className="font-medium text-slate-500 mb-1">{t("approval.changeContent")}</p>
                        <p>{t("list.colName")}: <span className="whitespace-pre-wrap">{r.payload.name || "-"}</span></p>
                        <p>{t("list.colDept")}: {deptName(r.payload.dept, lang, departments)} · {t("list.colCat")}: {catName(r.payload.cat, lang)}</p>
                        <p>{t("list.colAccessor")}: {personByEmail(r.payload.accessor, lang, users)} · {t("list.colReviewer")}: {personByEmail(r.payload.reviewer, lang, users)}</p>
                        <p>{t("manage.fieldFreq")}: {freqLabel(r.payload.frequency, lang)} · {t("manage.fieldImportance")}: {importanceLabel(r.payload.importance, lang)}</p>
                        {r.payload.desc && <p className="whitespace-pre-wrap">{t("manage.fieldDesc")}: {r.payload.desc}</p>}
                      </div>
                    )}
                    {r.reqType === "delete" && (
                      <div className="bg-red-50 rounded-lg p-3 mt-3 text-xs text-red-700">
                        {t("approval.deleteNotice")}
                      </div>
                    )}

                    <StepTrail r={r} />

                    <textarea
                      className={`${inputCls} mt-3`}
                      rows={2}
                      value={comment[r.spId] || ""}
                      onChange={(e) => setComment((prev) => ({ ...prev, [r.spId]: e.target.value }))}
                      placeholder={t("approval.commentPlaceholder")}
                    />
                    <div className="flex justify-end gap-2 mt-3">
                      <button
                        onClick={() => act(r, false)}
                        disabled={acting === r.spId || isArchived}
                        className="px-4 py-2 text-sm rounded-lg border border-red-200 text-red-600 hover:bg-red-50 disabled:opacity-40"
                      >
                        {t("approval.reject")}
                      </button>
                      <button
                        onClick={() => act(r, true)}
                        disabled={acting === r.spId || isArchived}
                        className="px-4 py-2 text-sm rounded-lg text-white disabled:opacity-40 flex items-center gap-1.5"
                        style={{ backgroundColor: BRAND.accent }}
                      >
                        {acting === r.spId && <Loader2 size={14} className="animate-spin" />}
                        {t("approval.approve")}
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="mb-6">
            <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("approval.myRequests")} ({mine.length})</h3>
            {mine.length === 0 ? (
              <EmptyState text={t("approval.noRequests")} />
            ) : (
              <div className="space-y-2">
                {mine.map((r) => (
                  <div key={r.spId} className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                    <div className="flex items-start justify-between gap-3 flex-wrap">
                      <div className="min-w-0">
                        <p className="text-xs text-slate-400 font-mono">{r.code} · {r.reqType === "delete" ? t("approval.typeDelete") : t("approval.typeEdit")}</p>
                        <p className="text-sm text-slate-700 mt-0.5">{labelOf(r)}</p>
                      </div>
                      <span className="text-xs px-2.5 py-1 rounded-full font-medium whitespace-nowrap"
                            style={{ backgroundColor: r.status === "approved" ? "#DCFCE7" : r.status === "rejected" ? "#FEE2E2" : "#FEF3C7",
                                     color: r.status === "approved" ? "#15803D" : r.status === "rejected" ? "#B91C1C" : "#B45309" }}>
                        {r.status === "approved" ? t("approval.done") : r.status === "rejected" ? t("approval.rejected") : t("approval.inProgress")}
                      </span>
                    </div>
                    <StepTrail r={r} />
                    {r.steps.filter((st) => st.status === "rejected" && st.comment).map((st, i) => (
                      <p key={i} className="text-xs text-red-600 mt-2 whitespace-pre-wrap">
                        {t("approval.rejectReason")}: {st.comment}
                      </p>
                    ))}
                    {r.status === "pending" && !isArchived && (
                      <div className="flex justify-end mt-2">
                        <button
                          onClick={() => cancelRequest(r)}
                          disabled={acting === r.spId}
                          className="text-xs text-slate-400 hover:text-red-500 flex items-center gap-1 disabled:opacity-40"
                        >
                          <Undo2 size={12} /> {t("approval.cancelBtn")}
                        </button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>

        </>
      )}
    </div>
  );
}

function ChangeHistoryPage({ controls, currentUser }) {
  const { lang, t } = useLang();
  const { users } = useAppData();
  const [requests, setRequests] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState("");

  useEffect(() => {
    (async () => {
      setLoading(true);
      try { setRequests(await loadIcsChangeRequests()); }
      catch (e) { console.warn("[ICS] 변경 요청 로드 실패:", e.message); setRequests([]); }
      setLoading(false);
    })();
  }, []);

  function labelOf(r) {
    const c = controls.find((x) => x.code === r.code && x.year === r.year);
    return c ? cName(c, lang) : r.code;
  }
  function stepLabel(st) {
    const k = { lm1: "stepLm1", lm2: "stepLm2", contact: "stepContact", final: "stepFinal" }[st.role];
    return k ? t(`approval.${k}`) : "";
  }

  // 결재가 끝난 요청만. 최근 처리 순.
  const done = requests
    .filter((r) => r.status === "approved" || r.status === "rejected" || r.status === "cancelled")
    .sort((a, b) => new Date(b.created || 0) - new Date(a.created || 0));

  // 통제 코드·항목명·요청자로 걸러 본다. 건수가 쌓이면 눈으로 찾기 어렵다.
  const kw = q.trim().toLowerCase();
  const rows = !kw ? done : done.filter((r) =>
    (r.code || "").toLowerCase().includes(kw) ||
    labelOf(r).toLowerCase().includes(kw) ||
    personByEmail(r.requester, lang, users).toLowerCase().includes(kw));

  return (
    <div className="p-8">
      <SectionHeader icon={History} title={t("nav.changeHistory")} subtitle={t("changeHistory.subtitle")} />
      <div className="mb-4">
        <input
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder={t("changeHistory.searchPh")}
          className="w-full max-w-md text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-slate-400"
        />
      </div>
      {loading ? (
        <EmptyState text="..." />
      ) : (
        <div>
          <h3 className="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
            <History size={15} /> {t("approval.historyTitle")} ({done.length})
          </h3>
          {done.length === 0 ? (
            <EmptyState text={t("approval.noHistory")} />
          ) : (
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm divide-y divide-slate-100">
              {done.map((r) => {
                const last = [...r.steps].reverse().find((st) => st.status !== "pending");
                const decided = r.steps.filter((st) => st.status !== "pending");
                return (
                  <div key={r.spId} className="p-4">
                    <div className="flex items-start justify-between gap-3 flex-wrap mb-2">
                      <div className="min-w-0">
                        <p className="text-xs text-slate-400 font-mono">{r.code} · {r.year}</p>
                        <p className="text-sm font-medium text-slate-800 mt-0.5">{labelOf(r)}</p>
                      </div>
                      <div className="flex items-center gap-2 flex-shrink-0">
                        <span className="text-xs px-2.5 py-1 rounded-full font-medium whitespace-nowrap"
                              style={{ backgroundColor: r.reqType === "delete" ? "#FEE2E2" : "#E4F1F0",
                                       color: r.reqType === "delete" ? "#B91C1C" : BRAND.accent }}>
                          {r.reqType === "delete" ? t("approval.typeDelete") : t("approval.typeEdit")}
                        </span>
                        <span className="text-xs px-2.5 py-1 rounded-full font-medium whitespace-nowrap"
                              style={{ backgroundColor: r.status === "approved" ? "#DCFCE7" : r.status === "cancelled" ? "#F1F5F9" : "#FEE2E2",
                                       color: r.status === "approved" ? "#15803D" : r.status === "cancelled" ? "#64748B" : "#B91C1C" }}>
                          {r.status === "approved" ? t("approval.done")
                            : r.status === "cancelled" ? t("approval.cancelled")
                            : t("approval.rejected")}
                        </span>
                      </div>
                    </div>

                    <div className="bg-slate-50 rounded-lg px-3 py-2.5 text-xs text-slate-600 space-y-1">
                      <div className="flex gap-2">
                        <span className="text-slate-400 w-[86px] flex-shrink-0">{t("approval.hRequester")}</span>
                        <span>{personByEmail(r.requester, lang, users)}</span>
                      </div>
                      <div className="flex gap-2">
                        <span className="text-slate-400 w-[86px] flex-shrink-0">{t("approval.hRequestedAt")}</span>
                        <span>{formatDateTime(r.created, lang)}</span>
                      </div>
                      <div className="flex gap-2">
                        <span className="text-slate-400 w-[86px] flex-shrink-0">{t("approval.hApprovers")}</span>
                        <span className="min-w-0">
                          {decided.map((st, i) => (
                            <span key={i} className="inline-block mr-2">
                              {stepLabel(st)} {personByEmail(st.approver, lang, users)}
                              <span style={{ color: st.status === "approved" ? "#15803D" : "#B91C1C" }}>
                                {st.status === "approved" ? " 승인" : " 반려"}
                              </span>
                            </span>
                          ))}
                        </span>
                      </div>
                      {r.payload?.reason && (
                        <div className="flex gap-2">
                          <span className="text-slate-400 w-[86px] flex-shrink-0">{t("self.reqReasonLabel")}</span>
                          <span className="whitespace-pre-wrap min-w-0">{r.payload.reason}</span>
                        </div>
                      )}
                      {decided.some((st) => st.comment) && (
                        <div className="flex gap-2">
                          <span className="text-slate-400 w-[86px] flex-shrink-0">{t("approval.hReason")}</span>
                          <span className="whitespace-pre-wrap min-w-0">
                            {decided.filter((st) => st.comment)
                              .map((st) => `${personByEmail(st.approver, lang, users)}: ${st.comment}`)
                              .join("\n")}
                          </span>
                        </div>
                      )}
                      <div className="flex gap-2">
                        <span className="text-slate-400 w-[86px] flex-shrink-0">{t("approval.hDecidedAt")}</span>
                        <span>{last?.date ? formatDateTime(last.date, lang) : "-"}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function HistoryPage({ controls: allControls, log: allLog, currentUser, allowedDepts }) {

  const { departments, users } = useAppData();
  const [detail, setDetail] = useState(null);

  const [accessorFilter, setAccessorFilter] = useState("");
  const [tablePage, setTablePage] = useState(0);

  // 전사 현황은 부서별 통제 현황·통제 항목 관리·대시보드에서 확인한다.
  // 본인이 Accessor 또는 Reviewer 로 배정된 항목만 조회한다 (Admin 포함).
  const controls = allControls.filter(
    (c) => (c.accessor || "").toLowerCase() === myEmail || (c.reviewer || "").toLowerCase() === myEmail
  );
  const myCodes = new Set(controls.map((c) => c.code));
  // 활동 로그는 ISA/FSA 평가 흐름(자가평가·검토·FSA)에서 발생한 기록만 보여준다 - 권한 변경, 부서 초기화 등 시스템/관리 로그는 제외.
  const ASSESSMENT_ACTIONS = new Set(["submit_self", "review_complete", "review_reject", "fsa_submit", "fsa_review_complete", "fsa_review_reject", "withdraw_self", "withdraw_fsa"]);
  const log = allLog
    .filter((l) => ASSESSMENT_ACTIONS.has(l.actionKey))
    .filter((l) => (l.actor || "").toLowerCase() === myEmail || myCodes.has(l.code));
  const pieData = ["green", "orange", "red", "none"].map((r) => ({
    name: RISK_META[r][lang], value: controls.filter((c) => finalRisk(c) === r).length, color: RISK_META[r].color,
  })).filter((d) => d.value > 0);

  const qTable = tableSearch.trim().toLowerCase();
  // 담당자 선택 목록 — 현재 조회 가능한 항목에 실제로 배정된 Accessor만 추린다.
  const accessorOptions = [...new Set(controls.map((c) => (c.accessor || "").toLowerCase()).filter(Boolean))]
    .map((email) => ({ email, label: personByEmail(email, lang, users) }))
    .sort((a, b) => a.label.localeCompare(b.label));
  const filteredTableControls = controls.filter((c) => {
    if (accessorFilter && (c.accessor || "").toLowerCase() !== accessorFilter) return false;
    if (!qTable) return true;
    return c.code.toLowerCase().includes(qTable)
      || cName(c, lang).toLowerCase().includes(qTable)
      || deptName(c.dept, lang, departments).toLowerCase().includes(qTable)
      || personByEmail(c.accessor, lang, users).toLowerCase().includes(qTable);
  });
  // 검색어·담당자 필터가 바뀌면 첫 페이지로 되돌린다 (빈 화면 방지)
  useEffect(() => { setTablePage(0); }, [tableSearch, accessorFilter]);
  const tableTotalPages = Math.max(1, Math.ceil(filteredTableControls.length / TABLE_PAGE_SIZE));
  const clampedTablePage = Math.min(tablePage, tableTotalPages - 1);
  const pagedTableControls = filteredTableControls.slice(clampedTablePage * TABLE_PAGE_SIZE, (clampedTablePage + 1) * TABLE_PAGE_SIZE);

  return (
    <div>
      <SectionHeader icon={History} title={t("history.title")} subtitle={t("history.subtitle")} />

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5 mb-6">
        <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <h3 className="text-sm font-semibold text-slate-700 mb-4">{t("history.pieTitle")}</h3>
          <ResponsiveContainer width="100%" height={220}>
            <PieChart>
              <Pie data={pieData} dataKey="value" nameKey="name" innerRadius={50} outerRadius={80} paddingAngle={2}>
                {pieData.map((d, i) => <Cell key={i} fill={d.color} />)}
              </Pie>
              <Legend />
              <Tooltip />
            </PieChart>
          </ResponsiveContainer>
        </div>

        <div className="lg:col-span-3 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <h3 className="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2"><FileText size={15} /> {t("history.logTitle")}</h3>
          <div className="divide-y divide-slate-100 max-h-56 overflow-y-auto pr-2">
            {log.map((l) => {
              const ctrl = controls.find((c) => c.code === l.code);
              const label = ctrl ? cName(ctrl, lang) : (lang === "en" ? l.nameEn : l.name);
              return (
                <div key={l.id} className="py-2.5 flex items-center justify-between text-sm gap-3">
                  <div className="min-w-0">
                    <p className="text-slate-700 truncate">
                      <span className="font-medium">{personByEmail(l.actor, lang, users)}</span> · {ACTION_LABELS[l.actionKey][lang]}
                    </p>
                    <p className="text-xs text-slate-400 truncate">{l.code} · {label}</p>
                  </div>
                  <span className="text-xs text-slate-400 flex-shrink-0 whitespace-nowrap pr-1">{formatDateTime(l.dateTime, lang)}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3 flex-wrap">
          <h3 className="text-sm font-semibold text-slate-700">{t("history.tableTitle")}</h3>
          <div className="flex items-center gap-2">
            <input
              type="text"
              value={tableSearch}
              onChange={(e) => { setTableSearch(e.target.value); setTablePage(0); }}
              placeholder={t("common.search")}
              className={`${inputCls} w-52`}
            />
            <select
              value={accessorFilter}
              onChange={(e) => setAccessorFilter(e.target.value)}
              className={`${inputCls} w-auto flex-shrink-0`}
            >
              <option value="">{t("history.allAccessors")}</option>
              {accessorOptions.map((o) => <option key={o.email} value={o.email}>{o.label}</option>)}
            </select>
            <button onClick={() => exportControlsToExcel(filteredTableControls, lang, departments, users)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:border-teal-400 hover:text-teal-600 flex-shrink-0">
              <Download size={13} /> {t("history.downloadBtn")}
            </button>
          </div>
        </div>
        <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{t("list.colCode")}</th>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{t("list.colName")}</th>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{t("list.colDept")}</th>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{t("list.colAccessor")}</th>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{t("history.colSample")}</th>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{lang === "en" ? "1st result" : "1차평가"}</th>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{lang === "en" ? "2nd result" : "2차검토"}</th>
              <th className="text-left font-medium px-4 py-3 whitespace-nowrap">{t("list.colStatus")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {pagedTableControls.map((c) => (
              <tr key={c.id} onClick={() => setDetail(c)} className="cursor-pointer hover:bg-slate-50">
                <td className="px-4 py-2.5 text-slate-500 text-xs font-mono whitespace-nowrap">{c.code}</td>
                <td className="px-4 py-2.5 text-slate-700"><div className="max-w-[360px] truncate" title={cName(c, lang)}>{cName(c, lang)}</div></td>
                <td className="px-4 py-2.5 text-slate-600 whitespace-nowrap">{deptName(c.dept, lang, departments)}</td>
                <td className="px-4 py-2.5 text-slate-600"><div className="max-w-[170px] truncate" title={personByEmail(c.accessor, lang, users)}>{personByEmail(c.accessor, lang, users)}</div></td>
                <td className="px-4 py-2.5 text-slate-500 text-xs whitespace-nowrap">{c.actualSample ?? "-"}/{recommendedSample(c.importance, c.frequency)}{t("common.items")}</td>
                <td className="px-4 py-2.5 whitespace-nowrap"><RiskBadge risk={c.selfRisk || "none"} /></td>
                <td className="px-4 py-2.5 whitespace-nowrap"><RiskBadge risk={c.reviewRisk || "none"} /></td>
                <td className="px-4 py-2.5 whitespace-nowrap"><StatusBadge status={c.status} kind="isa" /></td>
              </tr>
            ))}
            {filteredTableControls.length === 0 && (
              <tr><td colSpan={8}><EmptyState text={t("list.emptyText")} /></td></tr>
            )}
          </tbody>
        </table>
        </div>
        {filteredTableControls.length > 0 && (
          <div className="flex items-center justify-between px-5 py-3 border-t border-slate-100 text-xs text-slate-500">
            <span>{clampedTablePage * TABLE_PAGE_SIZE + 1}–{Math.min((clampedTablePage + 1) * TABLE_PAGE_SIZE, filteredTableControls.length)} / {filteredTableControls.length}{t("common.items")}</span>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setTablePage((p) => Math.max(0, p - 1))}
                disabled={clampedTablePage === 0}
                className="px-2.5 py-1 rounded-lg border border-slate-200 disabled:opacity-40 hover:border-teal-400 hover:text-teal-600"
              >
                <ChevronLeft size={14} />
              </button>
              <span>{clampedTablePage + 1} / {tableTotalPages}</span>
              <button
                onClick={() => setTablePage((p) => Math.min(tableTotalPages - 1, p + 1))}
                disabled={clampedTablePage >= tableTotalPages - 1}
                className="px-2.5 py-1 rounded-lg border border-slate-200 disabled:opacity-40 hover:border-teal-400 hover:text-teal-600"
              >
                <ChevronRight size={14} />
              </button>
            </div>
          </div>
        )}
      </div>

      {detail && (
        <Modal title={`${detail.code} · ${cName(detail, lang)}`} onClose={() => setDetail(null)} wide>
          <ControlDetailBody control={detail} />
        </Modal>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 최종 결과 보고 (CFO/RD 컨펌)                                          */
/* ------------------------------------------------------------------ */

function FinalReportPage({ controls, currentUser, activeYear, yearConfirmation, confirmYear, cancelYearConfirm, showToast }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [confirmingRole, setConfirmingRole] = useState(null);
  const [detail, setDetail] = useState(null);

  const stats = useMemo(() => {
    const counts = { green: 0, orange: 0, red: 0, none: 0 };
    controls.forEach((c) => (counts[finalRisk(c)] += 1));
    const total = controls.length;
    const isaDone = controls.filter((c) => c.status === "completed").length;
    const fsaDone = controls.filter((c) => c.fsaStatus === "completed").length;
    return {
      counts,
      total,
      isaRate: total ? Math.round((isaDone / total) * 100) : 0,
      fsaRate: total ? Math.round((fsaDone / total) * 100) : 0,
    };
  }, [controls]);

  const matrix = departments
    .filter((d) => controls.some((c) => c.dept === d.id))
    .map((d) => ({
      dept: d,
      cells: CATEGORIES.map((cat) => {
        const items = controls.filter((c) => c.dept === d.id && c.cat === cat.id);
        if (items.length === 0) return { cat, risk: null, count: 0, assessed: 0, by: null };
        const by = { green: 0, orange: 0, red: 0, none: 0 };
        items.forEach((c) => { by[finalRisk(c)] = (by[finalRisk(c)] || 0) + 1; });
        return { cat, risk: matrixCellRisk(items), count: items.length, assessed: matrixAssessedCount(items), by };
      }),
    }));

  const redItems = controls.filter((c) => finalRisk(c) === "red");

  const isCfo = currentUser.role === "cfo" || currentUser.role === "admin";
  const isRd = currentUser.role === "rd" || currentUser.role === "admin";
  const bothConfirmed = !!(yearConfirmation.cfo && yearConfirmation.rd);

  return (
    <div>
      <SectionHeader icon={FileCheck2} title={t("finalReport.title")} subtitle={`${activeYear} ${t("finalReport.subtitle")}`} />

      <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
          <p className="text-xs text-slate-500 mb-1">{t("dashboard.kpiTotal")}</p>
          <p className="text-2xl font-semibold text-slate-800">{stats.total}</p>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
          <p className="text-xs text-slate-500 mb-1">{t("finalReport.isaRate")}</p>
          <p className="text-2xl font-semibold text-slate-800">{stats.isaRate}%</p>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
          <p className="text-xs text-slate-500 mb-1">{t("finalReport.fsaRate")}</p>
          <p className="text-2xl font-semibold text-slate-800">{stats.fsaRate}%</p>
        </div>
        {["orange", "red"].map((r) => (
          <div key={r} className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <p className="text-xs text-slate-500 mb-1 flex items-center gap-1.5">
              <RiskDot risk={r} size={8} /> {RISK_META[r][lang]}
            </p>
            <p className="text-2xl font-semibold" style={{ color: RISK_META[r].color }}>{stats.counts[r]}</p>
          </div>
        ))}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-6">
        <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
          <h3 className="text-sm font-semibold text-slate-700">{t("dashboard.matrixTitle")}</h3>
          <div className="flex items-center gap-3 text-xs text-slate-500">
            {["green", "orange", "red", "none"].map((r) => (
              <span key={r} className="flex items-center gap-1">
                <RiskDot risk={r} size={8} /> {RISK_META[r][lang]}
              </span>
            ))}
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-[13px] table-fixed">
            <colgroup>
              <col style={{ width: "34%" }} />
              {CATEGORIES.map((c) => <col key={c.id} style={{ width: `${66 / CATEGORIES.length}%` }} />)}
            </colgroup>
            <thead>
              <tr>
                <th className="text-left text-slate-500 font-semibold pb-2 pr-3 border-b-2 border-slate-200 w-20">{t("list.colDept")}</th>
                {CATEGORIES.map((cat) => (
                  <th key={cat.id} className="text-center text-slate-500 font-semibold pb-2 px-1 leading-tight border-b-2 border-slate-200 border-l border-l-slate-100">{cat[lang]}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {matrix.map((row) => (
                <tr key={row.dept.id} className="border-t border-slate-100">
                  <td className="py-1 pr-3 font-medium text-slate-700 truncate" title={row.dept[lang]}>{row.dept[lang]}</td>
                  {row.cells.map((cell, i) => (
                    <td key={i} className="text-center py-1 px-2 border-l border-l-slate-100">
                      {cell.count > 0 ? (
                        <span
                          title={`${row.dept[lang]} · ${cell.cat[lang]} — ${t("dashboard.matrixTotal")} ${cell.count}${t("common.items")} · ${t("dashboard.matrixAssessed")} ${cell.assessed}${t("common.items")}`}
                          className="inline-flex flex-col items-center gap-1"
                        >
                          <span className="min-w-[34px] px-2 py-0.5 rounded-md border font-semibold leading-none text-[13px]"
                                style={{ borderColor: RISK_META[cell.risk].color, color: RISK_META[cell.risk].text }}>
                            {cell.count}
                          </span>
                          <span className="inline-flex items-center gap-1.5 text-[10px] leading-none font-semibold">
                            {["green", "orange", "red", "none"]
                              .filter((k) => cell.by && cell.by[k] > 0)
                              .map((k) => (
                                <span key={k} className="inline-flex items-center gap-[3px]"
                                      style={{ color: RISK_META[k].color }}
                                      title={`${RISK_META[k][lang]} ${cell.by[k]}${t("common.items")}`}>
                                  <span className="rounded-full inline-block"
                                        style={{ width: 5, height: 5, backgroundColor: RISK_META[k].color }} />
                                  {cell.by[k]}
                                </span>
                              ))}
                          </span>
                        </span>
                      ) : (
                        <span className="text-slate-300">–</span>
                      )}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm mb-6">
        <div className="p-5 pb-3">
          <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2">
            <AlertTriangle size={15} className="text-red-500" /> {t("finalReport.redListTitle")} ({redItems.length})
          </h3>
        </div>
        <div className="divide-y divide-slate-100">
          {redItems.map((c) => (
            <div key={c.id} onClick={() => setDetail(c)} className="px-5 py-3 flex items-start justify-between gap-3 cursor-pointer hover:bg-slate-50">
              <div>
                <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                <p className="text-sm font-medium text-slate-700">{cName(c, lang)}</p>
              </div>
              <RiskBadge risk="red" />
            </div>
          ))}
          {redItems.length === 0 && (
            <div className="px-5 py-4">
              <EmptyState text={t("finalReport.noRedItems")} />
            </div>
          )}
        </div>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
        {[
          { role: "cfo", allowed: isCfo, info: yearConfirmation.cfo },
          { role: "rd", allowed: isRd, info: yearConfirmation.rd },
        ].map(({ role, allowed, info }) => {
          // CFO는 RD가 먼저 취소(=RD 미컨펌 상태)해야만 자신의 컨펌을 취소할 수 있음. RD는 제약 없음.
          const cancelBlocked = role === "cfo" && !!yearConfirmation.rd;
          // RD는 CFO가 먼저 컨펌해야만 컨펌할 수 있음.
          const confirmBlocked = role === "rd" && !yearConfirmation.cfo;
          const designatedUser = users.find((u) => u.role === role); // ics_category_access.xlsx의 Users 시트에서 Role=cfo/rd로 지정된 실제 담당자
          return (
          <div key={role} className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
            <div className="flex items-center justify-between mb-1">
              <h3 className="text-sm font-semibold text-slate-700">{t(`roles.${role}`)} {t("finalReport.confirmTitle")}</h3>
              {info ? (
                <span className="text-xs font-medium px-2 py-0.5 rounded-full" style={{ backgroundColor: "#E4F3EC", color: "#166A43" }}>
                  {t("finalReport.confirmed")}
                </span>
              ) : (
                <span className="text-xs font-medium px-2 py-0.5 rounded-full" style={{ backgroundColor: "#F1F5F9", color: "#64748B" }}>
                  {t("finalReport.notConfirmed")}
                </span>
              )}
            </div>
            <p className="text-[11px] text-slate-400 mb-3">
              {lang === "en" ? "Designated approver: " : "지정된 승인자: "}
              {designatedUser ? designatedUser.email : (lang === "en" ? "not set in config" : "config에 미설정")}
            </p>
            {info ? (
              <div>
                <p className="text-sm text-slate-500 mb-0.5">{lang === "en" ? "Approver: " : "결재자: "}{personByEmail(info.by, lang, users)}</p>
                <p className="text-sm text-slate-500 mb-2">{lang === "en" ? "Approved at: " : "결재 시간: "}{formatDateTime(info.at, lang)}</p>
                <button
                  onClick={() => {
                    if (!allowed) {
                      alert(lang === "en" ? "You must be signed in with the CFO/RD account for this role to cancel." : "이 역할(CFO/RD)의 계정으로 로그인해야 취소할 수 있습니다.");
                      return;
                    }
                    if (cancelBlocked) return;
                    cancelYearConfirm(role);
                    showToast(lang === "en" ? "Confirmation cancelled." : "컨펌이 취소되었습니다.");
                  }}
                  disabled={allowed && cancelBlocked}
                  className="w-full py-2 rounded-lg text-xs font-medium border transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
                  style={{ borderColor: "#F0B8B4", color: "#C1352E" }}
                >
                  {lang === "en" ? "Cancel confirmation" : "컨펌 취소"}
                </button>
                {allowed && cancelBlocked && (
                  <p className="text-[11px] text-slate-400 mt-1.5">
                    {lang === "en" ? "RD must cancel first before CFO can cancel." : "RD가 먼저 취소해야 CFO도 취소할 수 있습니다."}
                  </p>
                )}
              </div>
            ) : (
              <div>
                <button
                  onClick={() => {
                    if (!allowed) {
                      alert(lang === "en" ? "You must be signed in with the CFO/RD account for this role to confirm." : "이 역할(CFO/RD)의 계정으로 로그인해야 컨펌할 수 있습니다.");
                      return;
                    }
                    if (confirmBlocked) {
                      alert(lang === "en" ? "CFO must confirm first before RD can confirm." : "CFO가 먼저 컨펌해야 RD도 컨펌할 수 있습니다.");
                      return;
                    }
                    setConfirmingRole(role);
                  }}
                  disabled={allowed && confirmBlocked}
                  className="w-full py-2.5 rounded-lg text-sm font-medium text-white flex items-center justify-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed"
                  style={{ backgroundColor: allowed && !confirmBlocked ? BRAND.accent : "#B9C2CE" }}
                >
                  <Check size={15} /> {t("finalReport.confirmBtn")}
                </button>
                {allowed && confirmBlocked && (
                  <p className="text-[11px] text-slate-400 mt-1.5">
                    {lang === "en" ? "CFO must confirm first before RD can confirm." : "CFO가 먼저 컨펌해야 RD도 컨펌할 수 있습니다."}
                  </p>
                )}
              </div>
            )}
          </div>
          );
        })}
      </div>

      {!bothConfirmed && (
        <p className="text-xs text-slate-400 mt-4 flex items-center gap-1.5">
          <Clock size={13} /> {t("settings.yearConfirmRequired")}
        </p>
      )}

      {confirmingRole && (
        <Modal title={`${t(`roles.${confirmingRole}`)} ${t("finalReport.confirmTitle")}`} onClose={() => setConfirmingRole(null)}>
          {(stats.isaRate < 100 || stats.fsaRate < 100) && (
            <div className="bg-amber-50 text-amber-700 text-sm px-4 py-3 rounded-lg mb-4 flex items-start gap-2">
              <AlertTriangle size={16} className="flex-shrink-0 mt-0.5" />
              <span>
                {lang === "en"
                  ? "Some control items are not fully assessed yet. Confirming now finalizes results as-is."
                  : "아직 평가가 끝나지 않은 통제 항목이 있습니다. 지금 컨펌하면 현재 상태 그대로 최종 확정됩니다."}
              </span>
            </div>
          )}
          <div className="grid grid-cols-2 gap-3 mb-4">
            <div className="bg-slate-50 rounded-lg p-3">
              <p className="text-xs text-slate-400 mb-1">{t("finalReport.isaRate")}</p>
              <p className="text-xl font-bold" style={{ color: stats.isaRate < 100 ? "#D9822B" : BRAND.accent }}>{stats.isaRate}%</p>
            </div>
            <div className="bg-slate-50 rounded-lg p-3">
              <p className="text-xs text-slate-400 mb-1">{t("finalReport.fsaRate")}</p>
              <p className="text-xl font-bold" style={{ color: stats.fsaRate < 100 ? "#D9822B" : BRAND.accent }}>{stats.fsaRate}%</p>
            </div>
          </div>
          <p className="text-sm text-slate-600 mb-5">
            {lang === "en"
              ? "This action is recorded with your name and cannot be undone. Proceed?"
              : "이 작업은 회원님 이름으로 기록되며 되돌릴 수 없습니다. 진행하시겠습니까?"}
          </p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setConfirmingRole(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
            <button
              onClick={() => {
                confirmYear(confirmingRole);
                setConfirmingRole(null);
                showToast(lang === "en" ? "Final results confirmed." : "최종 결과가 컨펌되었습니다.");
              }}
              className="px-4 py-2 text-sm font-medium text-white rounded-lg"
              style={{ backgroundColor: BRAND.accent }}
            >
              {t("finalReport.confirmBtn")}
            </button>
          </div>
        </Modal>
      )}

      {detail && (
        <Modal title={`${detail.code} · ${cName(detail, lang)}`} onClose={() => setDetail(null)} wide>
          <ControlDetailBody control={detail} />
        </Modal>
      )}
    </div>
  );
}
