function ReviewPage({ controls, setControls, currentUser, addLog, isArchived, showToast }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "" });
  const [returning, setReturning] = useState(null);
  const [returnComment, setReturnComment] = useState("");

  const isAdmin = currentUser.role === "admin";
  const pending = controls.filter((c) => c.status === "submitted_self" && (isAdmin || c.reviewer === currentUser.email));
  const done = controls.filter((c) => (c.status === "completed" || c.status === "returned") && (isAdmin || c.reviewer === currentUser.email));
  const pendingEdits = controls.filter((c) => c.pendingEdit && (isAdmin || c.reviewer === currentUser.email));

  function approveEdit(c) {
    setControls((prev) =>
      prev.map((x) =>
        x.id === c.id
          ? { ...x, ...x.pendingEdit, sampleSize: recommendedSample(x.pendingEdit.importance, x.pendingEdit.frequency), pendingEdit: null }
          : x
      )
    );
    addLog(currentUser.email, "edit_approved", c.code, c.pendingEdit.name, c.pendingEdit.name);
  }
  function rejectEdit(c) {
    setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, pendingEdit: null } : x)));
    addLog(currentUser.email, "edit_rejected", c.code, c.name, c.nameEn);
  }

  function startEdit(c) {
    setEditing(c.id);
    setDraft({ risk: c.selfRisk, comment: "" });
  }
  function approve(c) {
    if (!draft.risk) return;
    const today = new Date().toISOString().slice(0, 10);
    setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, status: "completed", reviewRisk: draft.risk, reviewComment: draft.comment, reviewCommentEn: draft.comment, reviewDate: today } : x)));
    addLog(c.reviewer, "review_complete", c.code, c.name, c.nameEn);
    showToast(lang === "en" ? "Review confirmed." : "검토가 완료됐습니다.");
    setEditing(null);
  }
  function reject(c) {
    const today = new Date().toISOString().slice(0, 10);
    setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, status: "returned", reviewRisk: "red", reviewComment: returnComment, reviewCommentEn: returnComment, reviewDate: today } : x)));
    addLog(c.reviewer, "review_reject", c.code, c.name, c.nameEn);
    showToast(lang === "en" ? "Returned to the accessor." : "담당자에게 반려됐습니다.");
    setReturning(null);
    setReturnComment("");
  }

  return (
    <div>
      <SectionHeader
        icon={ClipboardCheck}
        title={t("review.title")}
        subtitle={isAdmin ? t("review.subtitleAdmin") : `${pName(currentUser.name, lang, users)}${t("review.subtitleUser")}`}
      />

      {pendingEdits.length > 0 && (
        <div className="mb-6">
          <h3 className="text-sm font-semibold text-slate-700 mb-1 flex items-center gap-2">
            <Clock size={15} className="text-amber-500" /> {t("review.pendingEditTitle")} ({pendingEdits.length})
          </h3>
          <p className="text-xs text-slate-400 mb-3">{t("review.pendingEditDesc")}</p>
          <div className="space-y-3">
            {pendingEdits.map((c) => {
              const p = c.pendingEdit;
              const rows = [
                { label: t("manage.fieldName"), before: c.name, after: p.name },
                { label: t("manage.fieldDept"), before: deptName(c.dept, lang, departments), after: deptName(p.dept, lang, departments) },
                { label: t("manage.fieldCat"), before: catName(c.cat, lang), after: catName(p.cat, lang) },
                { label: t("manage.fieldDesc"), before: c.desc, after: p.desc },
                { label: t("manage.fieldAccessor"), before: c.accessor, after: p.accessor },
                { label: t("manage.fieldReviewer"), before: c.reviewer, after: p.reviewer },
                { label: t("manage.fieldFreq"), before: freqLabel(c.frequency, lang), after: freqLabel(p.frequency, lang) },
                { label: t("manage.fieldImportance"), before: importanceLabel(c.importance, lang), after: importanceLabel(p.importance, lang) },
              ].filter((r) => r.before !== r.after);
              return (
                <div key={c.id} className="bg-white rounded-xl border border-amber-200 p-4">
                  <div className="flex items-start justify-between gap-3 mb-2">
                    <div>
                      <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                      <p className="font-medium text-slate-800">{c.name}</p>
                    </div>
                    <span className="text-xs text-slate-400 flex-shrink-0 text-right">
                      {t("review.requestedBy")}: {personByEmail(p.requestedBy, lang, users)}
                      <br />
                      {t("review.requestedAt")}: {p.requestedAt}
                    </span>
                  </div>
                  <div className="border border-slate-100 rounded-lg overflow-hidden text-sm mb-3">
                    <div className="grid grid-cols-[110px_1fr_1fr] bg-slate-50 text-xs font-medium text-slate-500 px-3 py-1.5">
                      <span></span>
                      <span>{t("review.beforeLabel")}</span>
                      <span>{t("review.afterLabel")}</span>
                    </div>
                    <div className="divide-y divide-slate-50">
                      {rows.map((r, i) => (
                        <div key={i} className="grid grid-cols-[110px_1fr_1fr] px-3 py-2 text-xs gap-2">
                          <span className="text-slate-500 font-medium">{r.label}</span>
                          <span className="text-slate-400 whitespace-pre-wrap break-words">{r.before || "-"}</span>
                          <span className="text-teal-700 font-medium whitespace-pre-wrap break-words">{r.after || "-"}</span>
                        </div>
                      ))}
                      {rows.length === 0 && <div className="px-3 py-2 text-xs text-slate-400">-</div>}
                    </div>
                  </div>
                  {!isArchived && (
                    <div className="flex justify-end gap-2">
                      <button onClick={() => rejectEdit(c)} className="px-4 py-1.5 text-xs font-medium text-red-600 border border-red-200 rounded-lg hover:bg-red-50">
                        {t("review.rejectEditBtn")}
                      </button>
                      <button onClick={() => approveEdit(c)} className="px-4 py-1.5 text-xs font-medium text-white rounded-lg" style={{ backgroundColor: BRAND.accent }}>
                        {t("review.approveEditBtn")}
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("review.pending")} ({pending.length})</h3>
        {pending.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-100"><EmptyState text={t("review.noPending")} /></div>
        ) : (
          <div className="space-y-3">
            {pending.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-100 p-4">
                <div className="flex items-start justify-between gap-3 mb-2">
                  <div>
                    <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                    <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                  </div>
                  <StatusBadge status={c.status} />
                </div>
                <div className="bg-slate-50 rounded-lg p-3 mb-3">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-xs font-medium text-slate-500">{t("review.selfAssessmentBy")} ({personByEmail(c.accessor, lang, users)})</p>
                    <RiskBadge risk={c.selfRisk} />
                  </div>
                  <p className="text-sm text-slate-600 mb-2">{lang === "en" ? c.selfCommentEn || c.selfComment : c.selfComment}</p>
                  <div className="flex items-center gap-3 text-xs text-slate-500">
                    <span>{t("self.sampleCount")} {c.actualSample ?? "-"}{t("common.items")} ({t("self.recommendedShort")} {recommendedSample(c.importance, c.frequency)}{t("common.items")})</span>
                  </div>
                  {(c.attachments || []).length > 0 ? (
                    <ul className="mt-2 space-y-1">
                      {c.attachments.map((a, i) => (
                        <li key={i} className="flex items-center gap-2 text-xs text-slate-600 bg-white border border-slate-100 rounded-lg px-3 py-1.5">
                          <Paperclip size={12} className="text-slate-400 flex-shrink-0" />
                          {a.webUrl ? (
                            <a href={a.webUrl} target="_blank" rel="noreferrer" className="truncate hover:underline" style={{ color: BRAND.accent }}>{a.name}</a>
                          ) : (
                            <span className="truncate">{a.name}</span>
                          )}
                          {a.size && <span className="text-slate-400 flex-shrink-0 ml-auto">{a.size}</span>}
                        </li>
                      ))}
                    </ul>
                  ) : (
                    <p className="text-xs text-slate-400 mt-2 flex items-center gap-1"><Paperclip size={11} /> {t("review.noAttachments")}</p>
                  )}
                </div>

                {editing === c.id && !isArchived ? (
                  <div className="border border-slate-100 rounded-lg p-3">
                    <p className="text-xs font-medium text-slate-500 mb-2">{t("review.reviewResult")}</p>
                    <div className="flex gap-2 mb-3">
                      {["green", "orange", "red"].map((r) => (
                        <button key={r} onClick={() => setDraft({ ...draft, risk: r })} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-medium border-2"
                          style={{ borderColor: draft.risk === r ? RISK_META[r].color : "#E5E9EF", backgroundColor: draft.risk === r ? RISK_META[r].bg : "#fff", color: draft.risk === r ? RISK_META[r].text : "#94A3B8" }}>
                          <RiskDot risk={r} /> {RISK_META[r][lang]}
                        </button>
                      ))}
                    </div>
                    <textarea className={inputCls} rows={2} placeholder={t("review.reviewCommentPlaceholder")} value={draft.comment} onChange={(e) => setDraft({ ...draft, comment: e.target.value })} />
                    <div className="flex justify-end gap-2 mt-3">
                      <button onClick={() => setEditing(null)} className="px-3 py-1.5 text-xs text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
                      <button onClick={() => approve(c)} disabled={!draft.risk} className="px-4 py-1.5 text-xs font-medium text-white rounded-lg disabled:opacity-40 flex items-center gap-1" style={{ backgroundColor: BRAND.accent }}>
                        <Check size={13} /> {t("review.confirmBtn")}
                      </button>
                    </div>
                  </div>
                ) : returning === c.id && !isArchived ? (
                  <div className="border border-red-100 rounded-lg p-3">
                    <p className="text-xs font-medium text-red-600 mb-2">{t("review.rejectReasonLabel")}</p>
                    <textarea className={inputCls} rows={2} placeholder={t("review.rejectReasonPlaceholder")} value={returnComment} onChange={(e) => setReturnComment(e.target.value)} />
                    <div className="flex justify-end gap-2 mt-3">
                      <button onClick={() => setReturning(null)} className="px-3 py-1.5 text-xs text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
                      <button onClick={() => reject(c)} disabled={!returnComment.trim()} className="px-4 py-1.5 text-xs font-medium text-white bg-red-500 rounded-lg disabled:opacity-40 flex items-center gap-1">
                        <Undo2 size={13} /> {t("review.rejectBtn")}
                      </button>
                    </div>
                  </div>
                ) : (
                  !isArchived && (
                    <div className="flex gap-2">
                      <button onClick={() => startEdit(c)} className="text-sm font-medium px-4 py-2 rounded-lg text-white" style={{ backgroundColor: BRAND.accent }}>{t("review.reviewBtn")}</button>
                      <button onClick={() => setReturning(c.id)} className="text-sm font-medium px-4 py-2 rounded-lg text-red-600 border border-red-200 hover:bg-red-50">{t("review.rejectBtn")}</button>
                    </div>
                  )
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("review.done")} ({done.length})</h3>
        <div className="bg-white rounded-xl border border-slate-100 divide-y divide-slate-50">
          {done.map((c) => (
            <div key={c.id} className="p-4 flex items-start justify-between gap-3">
              <div>
                <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                <p className="font-medium text-slate-800 mb-1">{cName(c, lang)}</p>
                <p className="text-sm text-slate-500">{lang === "en" ? c.reviewCommentEn || c.reviewComment : c.reviewComment}</p>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <RiskBadge risk={c.reviewRisk} />
                <StatusBadge status={c.status} />
              </div>
            </div>
          ))}
          {done.length === 0 && <EmptyState text={t("review.noDone")} />}
        </div>
      </div>
    </div>
  );
}

function exportControlsToExcel(controls, lang, departments = INITIAL_DEPARTMENTS, users = INITIAL_USERS) {
  const rows = controls.map((c) => ({
    [lang === "en" ? "Code" : "코드"]: c.code,
    [lang === "en" ? "Control name" : "통제명"]: cName(c, lang),
    [lang === "en" ? "Department" : "부서"]: deptName(c.dept, lang, departments),
    [lang === "en" ? "Component" : "통제영역"]: catName(c.cat, lang),
    [lang === "en" ? "1st Accessor" : "1차 담당자"]: personByEmail(c.accessor, lang, users),
    [lang === "en" ? "2nd Reviewer" : "2차 검토자"]: personByEmail(c.reviewer, lang, users),
    [lang === "en" ? "Frequency" : "점검빈도"]: freqLabel(c.frequency, lang),
    [lang === "en" ? "Importance" : "중요도"]: importanceLabel(c.importance, lang),
    [lang === "en" ? "Recommended sample" : "권장 샘플링(건)"]: recommendedSample(c.importance, c.frequency),
    [lang === "en" ? "Actual sample" : "실제 샘플링(건)"]: c.actualSample ?? "",
    [lang === "en" ? "Attachments" : "첨부파일 수"]: (c.attachments || []).length,
    [lang === "en" ? "1st result" : "1차평가"]: c.selfRisk ? RISK_META[c.selfRisk][lang] : RISK_META.none[lang],
    [lang === "en" ? "2nd result" : "2차평가"]: c.reviewRisk ? RISK_META[c.reviewRisk][lang] : RISK_META.none[lang],
    [lang === "en" ? "Status" : "상태"]: STATUS_META[c.status][lang],
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = Object.keys(rows[0] || {}).map(() => ({ wch: 16 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, lang === "en" ? "Internal Control Status" : "내부통제 현황");
  XLSX.writeFile(wb, `internal_control_status_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

function FinalReportPage({ controls, currentUser, activeYear, yearConfirmation, confirmYear, showToast }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [confirmingRole, setConfirmingRole] = useState(null);

  const stats = useMemo(() => {
    const counts = { green: 0, orange: 0, red: 0, none: 0 };
    controls.forEach((c) => (counts[finalRisk(c)] += 1));
    const total = controls.length;
    const isaDone = controls.filter((c) => c.status === "completed").length;
    const fsaDone = controls.filter((c) => c.fsaStatus === "completed").length;
    return {
      counts,
      total,
      isaRate: total ? Math.round((isaDone / total) * 100) : 0,
      fsaRate: total ? Math.round((fsaDone / total) * 100) : 0,
    };
  }, [controls]);

  const matrix = departments.map((d) => ({
    dept: d,
    cells: CATEGORIES.map((cat) => {
      const items = controls.filter((c) => c.dept === d.id && c.cat === cat.id);
      if (items.length === 0) return { cat, risk: null, count: 0 };
      const risks = items.map(finalRisk);
      let worst = "green";
      if (risks.includes("red")) worst = "red";
      else if (risks.includes("orange")) worst = "orange";
      else if (risks.every((r) => r === "none")) worst = "none";
      return { cat, risk: worst, count: items.length };
    }),
  }));

  const redItems = controls.filter((c) => finalRisk(c) === "red");

  const isCfo = currentUser.role === "cfo" || currentUser.role === "admin";
  const isRd = currentUser.role === "rd" || currentUser.role === "admin";
  const bothConfirmed = !!(yearConfirmation.cfo && yearConfirmation.rd);

  return (
    <div>
      <SectionHeader icon={FileCheck2} title={t("finalReport.title")} subtitle={`${activeYear} ${t("finalReport.subtitle")}`} />

      <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">

          <p className="text-xs text-slate-500 mb-1">{t("dashboard.kpiTotal")}</p>
          <p className="text-2xl font-semibold text-slate-800">{stats.total}</p>
        </div>
        <div className="bg-white rounded-xl border border-slate-100 p-4">
          <p className="text-xs text-slate-500 mb-1">{t("finalReport.isaRate")}</p>
          <p className="text-2xl font-semibold text-slate-800">{stats.isaRate}%</p>
        </div>
        <div className="bg-white rounded-xl border border-slate-100 p-4">
          <p className="text-xs text-slate-500 mb-1">{t("finalReport.fsaRate")}</p>
          <p className="text-2xl font-semibold text-slate-800">{stats.fsaRate}%</p>
        </div>
        {["orange", "red"].map((r) => (
          <div key={r} className="bg-white rounded-xl border border-slate-100 p-4">
            <p className="text-xs text-slate-500 mb-1 flex items-center gap-1.5">
              <RiskDot risk={r} size={8} /> {RISK_META[r][lang]}
            </p>
            <p className="text-2xl font-semibold" style={{ color: RISK_META[r].color }}>{stats.counts[r]}</p>
          </div>
        ))}
      </div>

      <div className="bg-white rounded-xl border border-slate-100 p-5 mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-4">{t("dashboard.matrixTitle")}</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr>
                <th className="text-left text-slate-400 font-medium pb-2 pr-2 w-20">{t("list.colDept")}</th>
                {CATEGORIES.map((cat) => (
                  <th key={cat.id} className="text-center text-slate-400 font-medium pb-2 px-1">{cat[lang]}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {matrix.map((row) => (
                <tr key={row.dept.id} className="border-t border-slate-50">
                  <td className="py-2.5 pr-2 font-medium text-slate-600 whitespace-nowrap">{row.dept[lang]}</td>
                  {row.cells.map((cell, i) => (
                    <td key={i} className="text-center py-2.5 px-1">
                      {cell.count > 0 ? (
                        <span
                          title={`${row.dept[lang]} · ${cell.cat[lang]} (${cell.count}${t("common.items")})`}
                          className="w-6 h-6 rounded-md inline-flex items-center justify-center"
                          style={{ backgroundColor: RISK_META[cell.risk].bg }}
                        >
                          <RiskDot risk={cell.risk} size={9} />
                        </span>
                      ) : (
                        <span className="text-slate-200">–</span>
                      )}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-100 mb-6">
        <div className="p-5 pb-3">
          <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2">
            <AlertTriangle size={15} className="text-red-500" /> {t("finalReport.redListTitle")} ({redItems.length})
          </h3>
        </div>
        <div className="divide-y divide-slate-50">
          {redItems.map((c) => (
            <div key={c.id} className="px-5 py-3 flex items-start justify-between gap-3">
              <div>
                <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>

              </div>
              <RiskBadge risk="red" />

          ))}
          {redItems.length === 0 && (
            <div className="px-5 py-4">

      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
        {[
          { role: "cfo", allowed: isCfo, info: yearConfirmation.cfo },

            </div>
            <div className="bg-slate-50 rounded-lg p-3">
              <p className="text-xs text-slate-400 mb-1">{t("finalReport.fsaRate")}</p>
              <p className="text-xl font-bold" style={{ color: stats.fsaRate < 100 ? "#D9822B" : BRAND.accent }}>{stats.fsaRate}%</p>
            </div>
          </div>
          <p className="text-sm text-slate-600 mb-5">
            {lang === "en"
              ? "This action is recorded with your name and cannot be undone. Proceed?"
              : "이 작업은 회원님 이름으로 기록되며 되돌릴 수 없습니다. 진행하시겠습니까?"}
          </p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setConfirmingRole(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
            <button
              onClick={() => {

              }}
              className="px-4 py-2 text-sm font-medium text-white rounded-lg"
              style={{ backgroundColor: BRAND.accent }}
            >

      )}
    </div>
  );
}

function PermissionsPage({ permissions, setPermissions }) {
  const { lang, t } = useLang();
  const { departments, users, setUsers } = useAppData();

  // 최초 시드 데모 계정(9명)은 설정 페이지에서만 이름 등 상세정보를 관리하도록, 권한관리 화면에서는 삭제할 수 없게 보호한다.
  const protectedEmails = new Set(INITIAL_USERS.filter((u) => u.role !== "admin").map((u) => u.email));
  const fixedEmails = new Set(users.filter((u) => u.role !== "admin").map((u) => u.email));
  const adminEmails = new Set(users.filter((u) => u.role === "admin").map((u) => u.email));
  const allEmails = Array.from(new Set([...fixedEmails, ...Object.keys(permissions).filter((e) => !adminEmails.has(e))]));
  const rows = allEmails
    .map((email) => {
      const u = users.find((x) => x.email === email);
      return {
        email,
        name: u ? pName(u.name, lang, users) : null,
        role: u?.role || permissions[email]?.role || "accessor",
        depts: permissions[email]?.depts || [],
        isCustom: !protectedEmails.has(email),
      };
    })
    .filter((r) => r.role !== "admin" && r.role !== "rd");

  function toggle(email, deptId) {
    setPermissions((prev) => {
      const cur = prev[email]?.depts || [];
      const next = cur.includes(deptId) ? cur.filter((d) => d !== deptId) : [...cur, deptId];
      return { ...prev, [email]: { ...(prev[email] || { role: "accessor" }), depts: next } };
    });
  }
  function setAll(email, allOn) {
    setPermissions((prev) => ({ ...prev, [email]: { ...(prev[email] || { role: "accessor" }), depts: allOn ? departments.map((d) => d.id) : [] } }));
  }
  function removeEmail(email) {
    setPermissions((prev) => {
      const next = { ...prev };
      delete next[email];
      return next;
    });
    // 보호된 시드 계정이 아니라면 사용자 목록에서도 함께 제거해 두 화면이 어긋나지 않도록 한다.
    if (!protectedEmails.has(email)) {
      setUsers((prev) => prev.filter((u) => u.email !== email));
    }
  }

  return (
    <div>
      <SectionHeader icon={KeyRound} title={t("permissions.title")} subtitle={t("permissions.subtitle")} />

      <div className="rounded-xl border p-4 mb-4" style={{ backgroundColor: BRAND.accentSoft, borderColor: BRAND.accent + "40" }}>
        <p className="text-sm font-semibold mb-2" style={{ color: BRAND.navy }}>{t("permissions.requestGuideTitle")}</p>
        <ol className="text-sm space-y-1 list-decimal list-inside" style={{ color: BRAND.navy }}>
          <li>{t("permissions.requestGuideStep1")}</li>
          <li>
            {t("permissions.requestGuideStep2")}{" "}
            <a href="https://itsm-ticket.startruckkorea.com/" target="_blank" rel="noreferrer" className="underline font-medium" style={{ color: BRAND.accent }}>
              itsm-ticket.startruckkorea.com
            </a>
          </li>
        </ol>
      </div>

      <div className="bg-white rounded-xl border border-slate-100 overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="text-left font-medium px-4 py-3">{t("permissions.colUser")}</th>
              <th className="text-left font-medium px-4 py-3">{t("permissions.colRole")}</th>
              {departments.map((d) => <th key={d.id} className="text-center font-medium px-2 py-3">{d[lang]}</th>)}
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {rows.map((r) => (

export default function InternalControlApp({ initialUserId, initialControls, initialLog }) {
  const [lang, setLang] = useState("ko");
  const t = useMemo(() => makeT(lang), [lang]);

  const [departments, setDepartments] = useState(INITIAL_DEPARTMENTS);
  const [users, setUsers] = useState(INITIAL_USERS);

  // SharePoint(ICS_Controls/ICS_Requests, ICS_Log)에서 불러온 데이터가 있으면 그걸 쓰고,
  // 로드에 실패했을 때만(네트워크 오류 등) 코드 내 목업 데이터로 안전하게 대체한다.
  const usingSharePointData = !!(initialControls && initialControls.length);
  const [page, setPage] = useState("dashboard");
  const [controls, setControls] = useState(usingSharePointData ? initialControls : INITIAL_CONTROLS);
  const [log, setLog] = useState(initialLog && initialLog.length ? initialLog : INITIAL_LOG);
  const [currentUserId] = useState(initialUserId || INITIAL_USERS[0]?.id);
  const [listFilter, setListFilter] = useState({ dept: "", cat: "", risk: "", status: "" });
  const [permissions, setPermissions] = useState(() => computeInitialPermissions(usingSharePointData ? initialControls : INITIAL_CONTROLS));
  const [learnContent, setLearnContent] = useState({
    ko: { intro: STR.ko.learn.intro, tips: [...STR.ko.learn.tips] },
    en: { intro: STR.en.learn.intro, tips: [...STR.en.learn.tips] },
  });
  const [learnVideos, setLearnVideos] = useState([]);
  const [learnImages, setLearnImages] = useState([]);

  // 연도(회계연도) 아카이브: years는 오래된순으로 정렬, 마지막 값이 현재 진행 중인(수정 가능한) 연도.
  const [years, setYears] = useState(["2026"]);
  const [selectedYear, setSelectedYear] = useState("2026");
  const activeYear = years[years.length - 1];
  const isArchived = selectedYear !== activeYear;

  // CFO/RD의 연도별 최종 결과 컨펌 상태. 별도 저장 없이, 이미 SharePoint(ICS_Log)에 저장된
  // cfo_confirm/rd_confirm 로그를 읽어서 복원한다 (addLog가 항상 ICS_Log에 실제로 기록하므로 새로고침해도 유지됨).
  const [yearConfirmations, setYearConfirmations] = useState(() => {
    const result = { [activeYear]: { cfo: null, rd: null } };
    (initialLog || []).forEach((entry) => {
      if (entry.actionKey !== "cfo_confirm" && entry.actionKey !== "rd_confirm") return;
      const y = entry.name || activeYear; // addLog는 연도를 name/nameEn 자리(SharePoint Detail 필드)에 기록함
      if (!result[y]) result[y] = { cfo: null, rd: null };
      const role = entry.actionKey === "cfo_confirm" ? "cfo" : "rd";
      const existing = result[y][role];
      if (!existing || entry.date > existing.at) {
        result[y][role] = { by: entry.actor, at: entry.date };
      }
    });
    return result;
  });

  // 관리자 데이터 초기화(전체 삭제) 시 요구되는 비밀번호. 관리자가 설정 페이지에서 변경 가능 (데모 기본값: 0000).
  const [resetPassword, setResetPassword] = useState("0000");

  // 저장/제출 등 작업이 성공했을 때 잠깐 보여주는 토스트 알림 (조용히 끝나서 반영됐는지 헷갈리는 문제 방지)
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);
  function showToast(message) {
    setToast(message);
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToast(null), 2800);
  }

  const controlsForYear = useMemo(() => controls.filter((c) => c.year === selectedYear), [controls, selectedYear]);
  const logForYear = useMemo(() => log.filter((l) => l.year === selectedYear), [log, selectedYear]);
  const controlsForActiveYear = useMemo(() => controls.filter((c) => c.year === activeYear), [controls, activeYear]);

  const currentUser = users.find((u) => u.id === currentUserId) || users[0];
  const isAdmin = currentUser.role === "admin";
  const allowedDepts = getAllowedDepts(currentUser, permissions, departments);

  function addLog(actor, actionKey, code, name, nameEn) {
    const today = new Date().toISOString().slice(0, 10);
    setLog((prev) => [{ id: uid("log"), date: today, actor, actionKey, code, name, nameEn, year: selectedYear }, ...prev]);
    if (usingSharePointData) {
      const detail = name ? (nameEn && nameEn !== name ? `${name} / ${nameEn}` : name) : "";
      icsCreateItem(ICS_LISTS.log, { Title: actionKey, ActorEmail: actor, ControlId: code, Detail: detail }).catch((e) =>
        console.warn("[ICS] 로그 저장 실패:", e.message)
      );
    }
  }

  function goTo(pageKey, filter) {
    if (filter) setListFilter({ dept: "", cat: "", risk: "", status: "", ...filter });
    setPage(pageKey);
  }

  function startNewYear(newYear) {
    const newControls = buildArchiveYearControls(controls, activeYear, newYear);
    setControls((prev) => [...prev, ...newControls]);
    setYears((prev) => [...prev, newYear]);
    setYearConfirmations((prev) => ({ ...prev, [newYear]: { cfo: null, rd: null } }));
    setSelectedYear(newYear);
    setListFilter({ dept: "", cat: "", risk: "", status: "" });
  }

  function confirmYear(role) {
    const today = new Date().toISOString().slice(0, 10);
    setYearConfirmations((prev) => ({
      ...prev,
      [activeYear]: { ...(prev[activeYear] || { cfo: null, rd: null }), [role]: { by: currentUser.email, at: today } },
    }));
    addLog(currentUser.email, role === "cfo" ? "cfo_confirm" : "rd_confirm", "-", activeYear, activeYear);
  }

  const currentYearConfirmation = yearConfirmations[activeYear] || { cfo: null, rd: null };
  const bothConfirmed = !!(currentYearConfirmation.cfo && currentYearConfirmation.rd);

  const canEditControls = currentUser.role === "accessor" || currentUser.role === "admin";

  return (

    <AppDataContext.Provider value={{ departments, setDepartments, users, setUsers }}>

        {toast && (

            <div className="bg-white rounded-2xl shadow-2xl px-8 py-7 flex flex-col items-center gap-3 pointer-events-auto" style={{ minWidth: 260, maxWidth: 360 }}>
              <div className="w-12 h-12 rounded-full flex items-center justify-center" style={{ backgroundColor: BRAND.accentSoft }}>
                <CheckCircle2 size={26} style={{ color: BRAND.accent }} />
              </div>
              <p className="text-sm font-medium text-slate-700 text-center leading-relaxed">{toast}</p>
            </div>
          </div>
        )}
        <Sidebar page={page} setPage={setPage} currentUser={currentUser} />

        <div className="flex-1 flex flex-col min-w-0">
          <div className="h-14 flex-shrink-0 bg-white border-b border-slate-100 flex items-center justify-between px-6">
            <div className="flex items-center gap-2 text-sm text-slate-400">
              <span>Startruck Korea</span>
              <span>/</span>
              <span className="text-slate-700 font-medium">{t(`nav.${page}`)}</span>
            </div>
            <div className="flex items-center gap-4">
              <div className="relative flex items-center gap-1.5 rounded-lg border border-slate-200 pl-2.5 pr-1 py-1">
                <CalendarClock size={14} className="text-slate-400" />
                <select
                  value={selectedYear}
                  onChange={(e) => setSelectedYear(e.target.value)}
                  className="text-xs font-semibold text-slate-600 bg-transparent pr-1 py-0.5 focus:outline-none"
                >
                  {[...years].reverse().map((y) => (
                    <option key={y} value={y}>
                      {y} · {y === activeYear ? t("common.currentYear") : t("common.archivedYear")}

                  ))}

              </div>
              <div className="flex items-center rounded-lg border border-slate-200 overflow-hidden">
                <button
                  onClick={() => setLang("ko")}

                  KOR

                <button
                  onClick={() => setLang("en")}
                  className="px-3 py-1.5 text-xs font-semibold border-l border-slate-200"
                  style={{ backgroundColor: lang === "en" ? BRAND.accent : "#fff", color: lang === "en" ? "#fff" : "#64748B" }}

              </div>
              <div className="flex items-center gap-2 text-sm text-slate-500">
                <div className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs font-medium text-slate-600">
                  {pName(currentUser.name, lang, users)[0]}

// (Entra ID portal → 앱 등록 → 새 등록 → 리디렉션 URI: 이 페이지의 실제 배포 URL 추가)

  auth: {
    clientId: "432976c2-b43a-492e-8213-ece505fa1f51", // APS-MasterData-App과 동일 App 등록 (ICS용 리디렉션 URI 추가 등록됨)

  },

};
const MSAL_SCOPES = ["User.Read", "Sites.ReadWrite.All", "Files.ReadWrite.All"]; // 다른 APS 시스템들과 동일 조합(이미 동의된 권한 재사용, 이 앱은 실제로는 읽기만 함)
const SITE_PATH = "startruckkorea.sharepoint.com:/sites/STK-DB:"; // 다른 APS 시스템들과 동일한 사이트 재사용
const GRAPH = "https://graph.microsoft.com/v1.0";

const msalApp = new msal.PublicClientApplication(MSAL_CONFIG);
let _siteId = null;

function showLoginErr(msg) {
  const el = document.getElementById("login-err");
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

async function apiGet(path, token) {
  const res = await fetch(GRAPH + path, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error(path + " → " + res.status);
  return res.json();
}

/* ------------------------------------------------------------------
 * ICS_* SharePoint 목록 연동 (Controls / Requests / Log)
 * 목록 GUID를 하드코딩하지 않고 displayName으로 조회해서 캐싱한다 (오타/재생성에 안전).
 * ------------------------------------------------------------------ */
const ICS_LISTS = { controls: "ICS_Controls", requests: "ICS_Requests", approvals: "ICS_Approvals", log: "ICS_Log" };
const _icsListIds = {};

async function getGraphToken() {
  const account = msalApp.getActiveAccount();
  const tokenRes = await msalApp.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
  return tokenRes.accessToken;
}

async function getIcsListId(listName) {
  if (_icsListIds[listName]) return _icsListIds[listName];
  const token = await getGraphToken();
  const res = await apiGet(`/sites/${_siteId}/lists?$filter=displayName eq '${listName}'`, token);
  if (!res.value || !res.value.length) throw new Error(`SharePoint 목록을 찾을 수 없습니다: ${listName}`);
  _icsListIds[listName] = res.value[0].id;
  return _icsListIds[listName];
}

// 5,000건 임계값 대비 apiAll() 패턴과 동일하게 nextLink를 따라가며 전체 조회
async function icsListAll(listName, extraQuery = "") {
  const token = await getGraphToken();
  const listId = await getIcsListId(listName);
  let items = [];
  let url = `${GRAPH}/sites/${_siteId}/lists/${listId}/items?expand=fields&$top=200${extraQuery}`;
  while (url) {
    const res = await fetch(url, {
      headers: { Authorization: "Bearer " + token, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" },
    });
    if (!res.ok) throw new Error(`${listName} 조회 실패 (${res.status})`);
    const data = await res.json();
    items = items.concat(data.value || []);
    url = data["@odata.nextLink"] || null;
  }
  return items;
}

// AttachedFiles 문서 라이브러리(다른 APS 시스템들과 동일한 공용 라이브러리)의 driveId를 이름으로 찾아 캐싱.
// GW에서 겪었던 문제(첫 번째 드라이브를 그냥 써버려서 잘못된 드라이브로 업로드되던 버그)를 피하려고
// 반드시 name === 'AttachedFiles'로 정확히 매칭한다.
let _icsAttachedFilesDriveId = null;
async function getIcsAttachedFilesDriveId() {
  if (_icsAttachedFilesDriveId) return _icsAttachedFilesDriveId;
  const token = await getGraphToken();
  const drivesData = await apiGet(`/sites/${_siteId}/drives`, token);
  const drive = (drivesData.value || []).find((d) => d.name === "AttachedFiles");
  if (!drive) throw new Error("AttachedFiles 문서 라이브러리를 찾을 수 없습니다.");
  _icsAttachedFilesDriveId = drive.id;
  return _icsAttachedFilesDriveId;
}

// ICS_Requests_AttachedFiles/{requestItemId}/{파일명} 경로에 업로드하고 webUrl을 돌려준다.
// (BP_Requests/GW_Requests와 동일 패턴: filename|webUrl 쌍으로 목록 필드에 이어 붙여 저장)
async function icsUploadAttachment(requestItemId, file) {
  const token = await getGraphToken();
  const driveId = await getIcsAttachedFilesDriveId();
  const buf = await file.arrayBuffer();
  const res = await fetch(
    `${GRAPH}/drives/${driveId}/root:/ICS_Requests_AttachedFiles/${requestItemId}/${encodeURIComponent(file.name)}:/content`,
    { method: "PUT", headers: { Authorization: "Bearer " + token, "Content-Type": file.type || "application/octet-stream" }, body: buf }
  );
  if (!res.ok) throw new Error(`파일 업로드 실패: ${file.name} (${res.status})`);
  return res.json(); // { webUrl, name, ... }
}

async function icsCreateItem(listName, fields) {
  const token = await getGraphToken();
  const listId = await getIcsListId(listName);
  const res = await fetch(`${GRAPH}/sites/${_siteId}/lists/${listId}/items`, {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    throw new Error(`${listName} 생성 실패 (${res.status}): ${detail.slice(0, 300)}`);
  }
  return res.json();
}

async function icsUpdateItem(listName, itemId, fields) {
  const token = await getGraphToken();
  const listId = await getIcsListId(listName);
  const res = await fetch(`${GRAPH}/sites/${_siteId}/lists/${listId}/items/${itemId}/fields`, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(fields),
  });
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    throw new Error(`${listName} 수정 실패 (${res.status}): ${detail.slice(0, 300)}`);
  }
  return res.json();
}


// ICS_Controls(마스터) + ICS_Requests(평가 진행 상태)를 읽어서 화면에서 쓰는 통제 항목 배열로 합친다.
// SharePoint 여러 줄 텍스트 컬럼이 "서식 있는 텍스트(리치 텍스트)"로 설정되어 있으면,
// Graph API로 일반 텍스트를 저장해도 <div class="ExternalClassXXXX">내용</div> 형태로 자동으로 감싸버린다.
// 화면에는 항상 순수 텍스트만 보이도록 이 껍데기를 벗겨내는 방어 함수.
function stripSpRichText(value) {
  if (!value) return value;
  const s = String(value);
  if (!s.includes("<") || !s.includes(">")) return s; // HTML 태그 자체가 없으면 그대로 반환
  const div = document.createElement("div");
  div.innerHTML = s;
  return div.textContent || div.innerText || "";
}

async function loadIcsControls() {
  const [controlItems, requestItems] = await Promise.all([
    icsListAll(ICS_LISTS.controls),
    icsListAll(ICS_LISTS.requests),
  ]);

  const controls = controlItems.map((it) => {
    const f = it.fields;
    return {
      id: uid(),
      spId: it.id,
      requestSpId: null,
      code: f.Title || "",
      dept: f.Dept || "",
      cat: f.Category || "",
      name: f.NameKo || "",
      nameEn: f.NameEn || f.NameKo || "",
      desc: stripSpRichText(f.DescKo) || "",
      descEn: stripSpRichText(f.DescEn) || stripSpRichText(f.DescKo) || "",
      accessor: (f.AccessorEmail || "").trim().toLowerCase(),
      reviewer: (f.ReviewerEmail || "").trim().toLowerCase(),
      year: String(f.Year || "2026"),
      frequency: f.Frequency || "quarterly",
      importance: f.Importance || "medium",
      status: "not_started",
      selfRisk: null, selfComment: "", selfCommentEn: "", selfDate: null,
      reviewRisk: null, reviewComment: "", reviewCommentEn: "", reviewDate: null,
      actualSample: null, attachments: [], history: [],
      fsaStatus: "not_started", fsaRisk: null, fsaComment: "", fsaCommentEn: "", fsaDate: null,
      fsaReviewRisk: null, fsaReviewComment: "", fsaReviewCommentEn: "", fsaReviewDate: null,
      pendingEdit: null,
    };
  });
  controls.forEach((c) => { c.sampleSize = recommendedSample(c.importance, c.frequency); });

  requestItems.forEach((it) => {
    const f = it.fields;
    const match = controls.find((c) => c.code === f.ControlId && c.year === String(f.Year));
    if (!match) return; // 통제 마스터에 없는 고아 Request는 무시 (삭제된 통제 등)
    match.requestSpId = it.id;
    match.status = f.Status || "not_started";
    match.selfRisk = f.SelfRisk || null;
    match.selfComment = stripSpRichText(f.SelfCommentKo) || "";
    match.selfCommentEn = stripSpRichText(f.SelfCommentEn) || "";
    match.selfDate = f.SelfDate ? String(f.SelfDate).slice(0, 10) : null;
    match.actualSample = f.SampleCount !== undefined && f.SampleCount !== "" && f.SampleCount !== null ? Number(f.SampleCount) : null;
    match.reviewRisk = f.ReviewRisk || null;
    match.reviewComment = stripSpRichText(f.ReviewCommentKo) || "";
    match.reviewCommentEn = stripSpRichText(f.ReviewCommentEn) || "";
    match.reviewDate = f.ReviewDate ? String(f.ReviewDate).slice(0, 10) : null;
    match.fsaStatus = f.FsaStatus || "not_started";
    match.fsaRisk = f.FsaRisk || null;
    match.fsaComment = stripSpRichText(f.FsaCommentKo) || "";
    match.fsaCommentEn = stripSpRichText(f.FsaCommentEn) || "";
    match.fsaDate = f.FsaDate ? String(f.FsaDate).slice(0, 10) : null;
    match.fsaReviewRisk = f.FsaReviewRisk || null;
    match.fsaReviewComment = stripSpRichText(f.FsaReviewCommentKo) || "";
    match.fsaReviewCommentEn = stripSpRichText(f.FsaReviewCommentEn) || "";
    match.fsaReviewDate = f.FsaReviewDate ? String(f.FsaReviewDate).slice(0, 10) : null;
    match.attachments = f.AttachedFiles
      ? stripSpRichText(f.AttachedFiles).split(";").filter(Boolean).map((pair) => {
          const [name, webUrl] = pair.split("|");
          return { name, webUrl };
        })
      : [];
  });

  return controls;
}

async function loadIcsLog() {
  const items = await icsListAll(ICS_LISTS.log, "&$orderby=lastModifiedDateTime desc");
  return items
    .map((it) => {
      const f = it.fields;
      const created = it.createdDateTime || (it.fields && it.fields.Created) || null;
      return {
        id: it.id,
        date: created ? String(created).slice(0, 10) : new Date().toISOString().slice(0, 10),
        actor: f.ActorEmail || "",
        actionKey: f.Title || "edit_control",
        code: f.ControlId || "-",
        name: f.Detail || "",
        nameEn: f.Detail || "",
        year: "2026",
      };
    })
    .sort((a, b) => (a.date < b.date ? 1 : -1));
}

// system_config_final.xlsx (다른 APS 시스템들과 완전히 동일한 공용 config 파일)에서
// ICS_ACCESSOR_{부서id} / ICS_REVIEWER_N / ICS_ADMIN_N / ICS_CFO / ICS_RD 키를 읽어 INITIAL_USERS를 구성.
// 3열(KEY/이름/이메일) 뿐인 단순 포맷, 헤더 없이 그대로 읽음 (loadSystemConfig()와 동일 파싱 규칙)
// INITIAL_DEPARTMENTS는 부서 목록 자체(한글/영문명)라 config 대상이 아니고 코드 내 값 그대로 유지.
// KEY_PATH(예: "learn.tips[0]")를 따라가며 STR.ko/STR.en 안에 값을 채워 넣는 헬퍼.
// 경로 중간 객체/배열이 없으면 자동 생성한다.
function setByKeyPath(obj, path, value) {
  const parts = path.split(".").flatMap((seg) => {
    const m = seg.match(/^(\w+)\[(\d+)\]$/);
    return m ? [m[1], m[2]] : [seg];
  });
  let node = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const key = parts[i];
    if (node[key] === undefined || node[key] === null) {
      node[key] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    }
    node = node[key];
  }
  node[parts[parts.length - 1]] = value;
}

// system_config_final.xlsx / ics_ui_strings.xlsx가 들어있는 문서 라이브러리(driveId)를 한 번만 조회해서 캐싱.
// loadIcsConfig와 loadIcsUiStrings가 같은 라이브러리를 각자 따로 조회하던 중복 호출을 줄인다.
let _icsDocDriveId = null;
async function getIcsDocDriveId(token) {
  if (_icsDocDriveId) return _icsDocDriveId;
  const drives = await apiGet(`/sites/${_siteId}/drives`, token);
  const docDrive = (drives.value || []).find(d => ["Documents", "문서", "Shared Documents"].includes(d.name)) || (drives.value || [])[0];
  _icsDocDriveId = docDrive.id;
  return _icsDocDriveId;
}

// 화면에 보이는 모든 문구(STR.ko/STR.en)를 ics_ui_strings.xlsx(같은 문서 라이브러리, system_config_final.xlsx 옆)에서 덮어쓴다.
// 파일이 없거나 일부 KEY만 있어도 문제없음 — 못 찾은 문구는 코드 내 기본 문구가 그대로 쓰인다 (실패해도 화면이 깨지지 않음).
async function loadIcsUiStrings(token) {
  const docDriveId = await getIcsDocDriveId(token);
  const res = await fetch(`${GRAPH}/drives/${docDriveId}/root:/ics_ui_strings.xlsx:/content`, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error(`ics_ui_strings.xlsx not found (${res.status})`);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });

  let applied = 0;
  rows.forEach((row) => {
    const key = (row[0] || "").toString().trim();
    if (!key || key.startsWith("──") || key === "KEY_PATH") return;
    const ko = row[1] !== undefined && row[1] !== null ? row[1].toString() : "";
    const en = row[2] !== undefined && row[2] !== null ? row[2].toString() : "";
    if (ko) { setByKeyPath(STR.ko, key, ko); applied++; }
    if (en) setByKeyPath(STR.en, key, en);
  });
  if (!applied) throw new Error("ics_ui_strings.xlsx에서 유효한 KEY_PATH를 하나도 찾지 못함");
}

async function loadIcsConfig(token) {
  const docDriveId = await getIcsDocDriveId(token);
  const res = await fetch(`${GRAPH}/drives/${docDriveId}/root:/system_config_final.xlsx:/content`, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error(`system_config_final.xlsx not found in STK-DB (${res.status})`);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });

  const cfg = {};
  rows.forEach(row => {
    const key = (row[0] || "").toString().trim();
    if (!key || key.startsWith("[") || key === "설정 키 (KEY)" || key.startsWith("이 파일") || key.startsWith("STK Korea")) return;
    cfg[key] = { name: (row[1] || "").toString().trim(), email: (row[2] || "").toString().trim().toLowerCase() };
  });

  // 부서 목록(ICS_DEPT_{코드}: 값1=한글명, 값2=영문명)이 config에 있으면 코드 내 기본값을 완전히 교체.
  // deptIds를 구하기 전에 먼저 반영해야, config에 새 부서코드가 추가된 경우에도 그 아래 ICS_ACCESSOR_{새부서}가 정상 인식된다.
  const deptKeys = Object.keys(cfg).filter((k) => k.startsWith("ICS_DEPT_"));
  if (deptKeys.length) {
    const newDepts = deptKeys.map((k) => {
      const code = k.replace("ICS_DEPT_", "");
      const v = cfg[k];
      return { id: code, ko: v.name || code, en: v.email || v.name || code };
    });
    INITIAL_DEPARTMENTS.length = 0;
    newDepts.forEach((d) => INITIAL_DEPARTMENTS.push(d));
  }

  // 샘플링 권장 건수(ICS_SAMPLE_{중요도}_{빈도}: 값1=건수)가 config에 있으면 해당 칸만 덮어씀 (일부만 등록돼도 나머지는 코드 기본값 유지)
  Object.keys(cfg).forEach((k) => {
    const m = k.match(/^ICS_SAMPLE_(high|medium|low)_(continuous|monthly|quarterly|semiannual|annual)$/);
    if (m) {
      const num = Number(cfg[k].name);
      if (!Number.isNaN(num)) SAMPLE_TABLE[m[1]][m[2]] = num;
    }
  });

  // BU Admin 문의 이메일 (사이드바 하단에 표시)
  if (cfg.ICS_ACCESSOR_CONTACT && cfg.ICS_ACCESSOR_CONTACT.email) {
    ICS_CONTACT_EMAIL = cfg.ICS_ACCESSOR_CONTACT.email;
  }

  const deptIds = INITIAL_DEPARTMENTS.map(d => d.id); // fin/hr/pur/sal/itd/prd (또는 config로 교체된 부서 목록)
  const newUsers = [];
  let seq = 1;

  deptIds.forEach(dept => {
    const v = cfg[`ICS_ACCESSOR_${dept}`];
    if (v && v.email) newUsers.push({ id: `u${seq++}`, name: v.name || v.email, nameEn: v.name || v.email, email: v.email, dept, role: "accessor" });
  });
  for (let n = 1; n <= 20; n++) {
    const v = cfg[`ICS_REVIEWER_${n}`];
    if (!v) break; // 값이 없는 번호가 나오면 중단 (다른 시스템들의 자동확장 패턴과 동일)
    if (v.email) newUsers.push({ id: `u${seq++}`, name: v.name || v.email, nameEn: v.name || v.email, email: v.email, dept: null, role: "reviewer" });
  }
  for (let n = 1; n <= 20; n++) {
    const v = cfg[`ICS_ADMIN_${n}`];
    if (!v) break;
    if (v.email) newUsers.push({ id: `u${seq++}`, name: v.name || v.email, nameEn: v.name || v.email, email: v.email, dept: null, role: "admin" });
  }
  if (cfg.ICS_CFO && cfg.ICS_CFO.email) newUsers.push({ id: `u${seq++}`, name: cfg.ICS_CFO.name || cfg.ICS_CFO.email, nameEn: cfg.ICS_CFO.name || cfg.ICS_CFO.email, email: cfg.ICS_CFO.email, dept: null, role: "cfo" });
  if (cfg.ICS_RD && cfg.ICS_RD.email) newUsers.push({ id: `u${seq++}`, name: cfg.ICS_RD.name || cfg.ICS_RD.email, nameEn: cfg.ICS_RD.name || cfg.ICS_RD.email, email: cfg.ICS_RD.email, dept: null, role: "rd" });

  // 한 이메일이 여러 역할(예: accessor이면서 admin)에 동시 등록된 경우, 더 높은 권한 역할을 우선 적용
  // (이 앱은 사용자당 role 하나만 가지는 구조라, 우선순위로 하나를 골라야 함)
  const ROLE_PRIORITY = { admin: 0, rd: 1, cfo: 2, reviewer: 3, accessor: 4 };
  const byEmail = {};
  newUsers.forEach(u => {
    const existing = byEmail[u.email];
    if (!existing || ROLE_PRIORITY[u.role] < ROLE_PRIORITY[existing.role]) byEmail[u.email] = u;
  });
  const dedupedUsers = Object.values(byEmail);

  if (dedupedUsers.length) {
    INITIAL_USERS.length = 0;
    dedupedUsers.forEach((u, i) => { u.id = `u${i+1}`; INITIAL_USERS.push(u); });
  } else {
    throw new Error("system_config_final.xlsx에서 ICS_* 키를 하나도 못 찾음");
  }
}

async function icsBoot(account) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("loading").style.display = "flex";
  let configLoadFailed = false;
  let loadedControls = null;
  let loadedLog = null;
  try {
    const tokenRes = await msalApp.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
    const token = tokenRes.accessToken;
    const siteRes = await apiGet(`/sites/${SITE_PATH}`, token);
    _siteId = siteRes.id;

    // 서로 의존하지 않는 4개 로드를 병렬로 실행해서 로그인 대기 시간을 줄인다 (예전엔 하나씩 순서대로 기다렸음).
    const [configResult, uiStringsResult, controlsResult, logResult] = await Promise.allSettled([
      loadIcsConfig(token),
      loadIcsUiStrings(token),
      loadIcsControls(),
      loadIcsLog(),
    ]);

    if (configResult.status === "rejected") throw configResult.reason;

    // UI 문구 커스터마이징은 선택 사항이라 실패해도 앱 진행을 막지 않는다 (파일이 아직 없으면 코드 내 기본 문구 사용).
    if (uiStringsResult.status === "rejected") {
      console.warn("[ICS] ics_ui_strings.xlsx 로드 실패, 코드 내 기본 문구로 진행:", uiStringsResult.reason.message);
    }
    // 통제 항목/로그 로드 실패 시에도 화면 자체는 뜨게 하고(빈 목록), 콘솔에만 경고를 남긴다.
    if (controlsResult.status === "fulfilled") loadedControls = controlsResult.value;
    else console.warn("[ICS] 통제 항목 로드 실패:", controlsResult.reason.message);
    if (logResult.status === "fulfilled") loadedLog = logResult.value;
    else console.warn("[ICS] 활동 로그 로드 실패:", logResult.reason.message);
  } catch (e) {
    // INITIAL_USERS를 코드에 하드코딩해두지 않으므로, 여기서 실패하면 사용자 목록이 비어있는 채로 남는다.
    // 그대로 진행하면 "권한 없음"으로 오인되니, 실제 원인(설정 파일 로드 실패)을 화면에 명확히 알린다.
    console.warn("[ICS] system_config_final.xlsx 로드 실패:", e.message);
    configLoadFailed = true;
  }

  if (configLoadFailed || INITIAL_USERS.length === 0) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    showLoginErr("사용자 설정(system_config_final.xlsx)을 불러오지 못했습니다. 잠시 후 새로고침하거나 관리자에게 문의해주세요.");
    return;
  }

  const myEmail = (account.username || "").toLowerCase();
  const matched = INITIAL_USERS.find(u => u.email.toLowerCase() === myEmail);
  if (!matched) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    showLoginErr(`접근 권한이 없습니다 (${myEmail}). 관리자에게 문의해주세요.`);
    return;
  }

  window.icsSignOut = () => msalApp.logoutRedirect();

  const loadingEl = document.getElementById("loading");
  if (loadingEl) loadingEl.remove();
  const rootEl = document.getElementById("root");
  createRoot(rootEl).render(<InternalControlApp initialUserId={matched.id} initialControls={loadedControls} initialLog={loadedLog} />);
}

(async function initMsal() {
  const btn = document.getElementById("btn-login");
  try {
    await msalApp.initialize();
    const resp = await msalApp.handleRedirectPromise();
    if (resp && resp.account) { msalApp.setActiveAccount(resp.account); await icsBoot(resp.account); return; }
    const accounts = msalApp.getAllAccounts();
    if (accounts.length) { msalApp.setActiveAccount(accounts[0]); await icsBoot(accounts[0]); return; }
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
    showLoginErr(e.message);
  }
})();

document.getElementById("btn-login").onclick = async () => {
  try {
    if (window !== window.top) { window.open(window.location.href, "_blank"); return; }
    await msalApp.loginRedirect({ scopes: MSAL_SCOPES });
  } catch (e) { showLoginErr(e.message); }
};
