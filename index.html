function CategoryAccessPage({ currentUser, addLog, showToast }) {
  const { lang, t } = useLang();
  const { users } = useAppData();
  const isAdmin = currentUser.role === "admin";
  const [saved, setSaved] = useState(() => ({ ...ICS_CATEGORY_ACCESS }));
  const [draft, setDraft] = useState(() => ({ ...ICS_CATEGORY_ACCESS }));
  const [search, setSearch] = useState("");
  const [applying, setApplying] = useState(false);
  const { users: allUsers, setUsers } = useAppData();
  const [newEmail, setNewEmail] = useState("");
  const [adding, setAdding] = useState(false);
  const [addError, setAddError] = useState("");
  const [removing, setRemoving] = useState(null);
  const [confirmRemove, setConfirmRemove] = useState(null);

  const categoryKeys = ["controlMgmt", "self", "review", "fsa", "fsaReview", "adminOnly", "executive"];
  const categoryLabelPath = {
    controlMgmt: "navGroup.controlMgmt",
    self: "nav.self",
    review: "nav.review",
    fsa: "nav.fsa",
    fsaReview: "nav.fsaReview",
    adminOnly: "navGroup.adminOnly",
    executive: "navGroup.executive",
  };

  const q = search.trim().toLowerCase();
  const rows = users
    .filter((u) => !q || u.email.toLowerCase().includes(q) || (u.name || "").toLowerCase().includes(q) || (u.nameEn || "").toLowerCase().includes(q))
    .slice()
    .sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));

  // ISA 1차 자가평가(Self)와 FSA 최종 자가평가(FSA)는 같은 담당자가 이어서 하는 흐름이라 항상 짝으로 부여/해제된다.
  // ISA 2차 검토(Review)와 FSA 2차검토(FSAReview)도 마찬가지.
  const CATEGORY_PAIRS = { self: "fsa", fsa: "self", review: "fsaReview", fsaReview: "review" };

  function toggleCell(email, categoryKey) {
    if (!isAdmin) {
      alert(lang === "en" ? "Only admins can change this." : "관리자만 변경할 수 있습니다.");
      return;
    }
    setDraft((prev) => {
      const current = prev[email] || {};
      const newValue = !current[categoryKey];
      const next = { ...current, [categoryKey]: newValue };
      const pairKey = CATEGORY_PAIRS[categoryKey];
      if (pairKey) next[pairKey] = newValue;
      return { ...prev, [email]: next };
    });
  }

  function toggleColumn(categoryKey) {
    if (!isAdmin) {
      alert(lang === "en" ? "Only admins can change this." : "관리자만 변경할 수 있습니다.");
      return;
    }
    const visibleEmails = rows.map((u) => u.email.toLowerCase());
    const allChecked = visibleEmails.length > 0 && visibleEmails.every((email) => draft[email]?.[categoryKey]);
    const pairKey = CATEGORY_PAIRS[categoryKey];
    setDraft((prev) => {
      const next = { ...prev };
      visibleEmails.forEach((email) => {
        next[email] = { ...(next[email] || {}), [categoryKey]: !allChecked };
        if (pairKey) next[email][pairKey] = !allChecked;
      });
      return next;
    });
  }

  const isDirty = categoryKeys.some((k) =>
    users.some((u) => {
      const email = u.email.toLowerCase();
      return !!draft[email]?.[k] !== !!saved[email]?.[k];
    })
  );

  // 카테고리 접근 권한 화면에 사용자를 새로 등록한다.
  // ICS_CategoryAccess 목록에 행을 만들어 두면 다음 접속 때 사용자 목록에 자동으로 병합된다.
  async function addUser() {
    const email = newEmail.trim().toLowerCase();
    if (!isAdmin || !email) return;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setAddError(lang === "en" ? "Please enter a valid email address." : "올바른 이메일 주소를 입력해 주세요.");
      return;
    }
    if (allUsers.some((u) => (u.email || "").toLowerCase() === email)) {
      setAddError(lang === "en" ? "This user is already in the list." : "이미 목록에 있는 사용자입니다.");
      return;
    }
    setAddError("");
    setAdding(true);
    try {
      const created = await icsCreateItem(ICS_LISTS.categoryAccess, { Title: email });
      const entry = { spId: created.id };
      ICS_CATEGORY_ACCESS[email] = entry;
      setSaved((prev) => ({ ...prev, [email]: { ...entry } }));
      setDraft((prev) => ({ ...prev, [email]: { ...entry } }));
      setUsers((prev) => [...prev, { id: `ua_${Date.now()}`, email, name: email, nameEn: email, role: "guest", dept: null, fromAccessList: true }]);
      addLog(currentUser.email, "edit_category_access", "-", `사용자 추가: ${email}`, `User added: ${email}`);
      showToast(lang === "en" ? "User added." : "사용자가 추가되었습니다.");
      setNewEmail("");
    } catch (e) {
      setAddError((lang === "en" ? "Failed to add: " : "추가에 실패했습니다: ") + e.message);
    } finally {
      setAdding(false);
    }
  }

  // 사용자를 목록에서 제거한다. ICS_CategoryAccess 행을 삭제하므로 모든 카테고리 권한이 함께 회수된다.
  // Users 시트(마스터)에 등록된 계정은 권한만 초기화되고 목록에는 남는다.
  async function removeUser(u) {
    const email = (u.email || "").toLowerCase();
    if (!isAdmin || !email) return;
    setRemoving(email);
    try {
      const spId = ICS_CATEGORY_ACCESS[email]?.spId;
      if (spId) await icsDeleteItem(ICS_LISTS.categoryAccess, spId);
      delete ICS_CATEGORY_ACCESS[email];
      setSaved((prev) => { const n = { ...prev }; delete n[email]; return n; });
      setDraft((prev) => { const n = { ...prev }; delete n[email]; return n; });
      if (u.fromAccessList) setUsers((prev) => prev.filter((x) => (x.email || "").toLowerCase() !== email));
      addLog(currentUser.email, "edit_category_access", "-", `권한 회수: ${email}`, `Access revoked: ${email}`);
      showToast(lang === "en" ? "Access revoked." : "접근 권한이 회수되었습니다.");
    } catch (e) {
      alert((lang === "en" ? "Failed to remove: " : "삭제에 실패했습니다: ") + e.message);
    } finally {
      setRemoving(null);
      setConfirmRemove(null);
    }
  }

  async function applyChanges() {
    if (!isAdmin || !isDirty) return;
    setApplying(true);
    const changedEmails = users
      .map((u) => u.email.toLowerCase())
      .filter((email) => categoryKeys.some((k) => !!draft[email]?.[k] !== !!saved[email]?.[k]));

    let successCount = 0;
    for (const email of changedEmails) {
      const entry = draft[email] || {};
      const yn = (v) => (v ? "Y" : "");
      const fields = {
        ICS_Overview: yn(entry.icsOverview),
        ControlMgmt: yn(entry.controlMgmt),
        Self: yn(entry.self),
        Review: yn(entry.review),
        FSA: yn(entry.fsa),
        FSAReview: yn(entry.fsaReview),
        AdminOnly: yn(entry.adminOnly),
        Executive: yn(entry.executive),
      };
      try {
        const existing = ICS_CATEGORY_ACCESS[email];
        if (existing?.spId) {
          await icsUpdateItem(ICS_LISTS.categoryAccess, existing.spId, fields);
        } else {
          const created = await icsCreateItem(ICS_LISTS.categoryAccess, { Title: email, ...fields });
          entry.spId = created.id;
        }
        ICS_CATEGORY_ACCESS[email] = { ...(ICS_CATEGORY_ACCESS[email] || {}), ...entry };
        successCount++;
      } catch (e) {
        console.warn(`[ICS] ${email} 카테고리 접근 권한 저장 실패:`, e.message);
      }
    }
    setSaved({ ...draft });
    setApplying(false);
    if (successCount > 0) {
      addLog(
        currentUser.email,
        "edit_category_access",
        "-",
        `카테고리 접근 권한 일괄 변경 (${successCount}명)`,
        `Bulk category access update (${successCount} users)`
      );
      if (showToast) showToast(lang === "en" ? `Permissions updated for ${successCount} user(s).` : `${successCount}명의 권한이 반영되었습니다.`);
    } else if (changedEmails.length > 0) {
      alert(lang === "en" ? "Failed to save changes." : "저장에 실패했습니다.");
    }
  }

  return (
    <div>
      <SectionHeader icon={KeyRound} title={t("categoryAccess.title")} subtitle={t("categoryAccess.subtitle")} />

      <div className="bg-slate-50 text-slate-500 text-xs px-4 py-3 rounded-lg mb-4 flex items-start gap-2">
        <ClipboardList size={14} className="flex-shrink-0 mt-0.5" />
        {t("categoryAccess.defaultNote")}
      </div>

      {!isAdmin && (
        <div className="rounded-xl border p-4 mb-4 flex items-start gap-2" style={{ backgroundColor: BRAND.accentSoft, borderColor: BRAND.accent + "40" }}>
          <KeyRound size={16} style={{ color: BRAND.navy }} className="flex-shrink-0 mt-0.5" />
          <p className="text-sm" style={{ color: BRAND.navy }}>{t("categoryAccess.viewOnlyNotice")}</p>
        </div>
      )}

      <div className="flex items-center gap-3 mb-4">
        <input
          type="text"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder={t("common.search")}
          className={`${inputCls} max-w-xs`}
        />
        {isAdmin && (
          <button
            onClick={applyChanges}
            disabled={!isDirty || applying}
            className="text-sm font-medium px-4 py-2 rounded-lg text-white disabled:opacity-40 flex-shrink-0"
            style={{ backgroundColor: BRAND.accent }}
          >
            {applying ? t("categoryAccess.applying") : t("categoryAccess.apply")}
          </button>
        )}
      </div>

      {isAdmin && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-4">
          <h3 className="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
            <Plus size={15} /> {t("categoryAccess.addUserTitle")}
          </h3>
          <div className="flex flex-wrap items-center gap-2">
            <input
              type="email"
              value={newEmail}
              onChange={(e) => { setNewEmail(e.target.value); if (addError) setAddError(""); }}
              onKeyDown={(e) => { if (e.key === "Enter") addUser(); }}
              placeholder={t("categoryAccess.addUserPlaceholder")}
              className={`${inputCls} max-w-sm`}
            />
            <button
              onClick={addUser}
              disabled={adding || !newEmail.trim()}
              className="text-sm font-medium px-4 py-2 rounded-lg text-white disabled:opacity-40 flex items-center gap-1.5 flex-shrink-0"
              style={{ backgroundColor: BRAND.accent }}
            >
              {adding ? <Loader2 size={14} className="animate-spin" /> : <Plus size={14} />}
              {t("common.add")}
            </button>
          </div>
          {addError && <p className="text-xs text-red-600 mt-2 flex items-start gap-1"><AlertTriangle size={12} className="flex-shrink-0 mt-0.5" />{addError}</p>}
          <p className="text-xs text-slate-400 mt-2">{t("categoryAccess.addUserHint")}</p>
        </div>
      )}

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-auto" style={{ maxHeight: 520 }}>
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="text-left font-medium px-4 py-2.5 sticky top-0 left-0 z-30 bg-slate-50">{t("categoryAccess.colUser")}</th>
              {categoryKeys.map((k) => {
                const visibleEmails = rows.map((u) => u.email.toLowerCase());
                const allChecked = visibleEmails.length > 0 && visibleEmails.every((email) => draft[email]?.[k]);
                return (
                  <th key={k} className="text-center font-medium px-3 py-2.5 whitespace-nowrap sticky top-0 z-20 bg-slate-50">
                    <div className="flex flex-col items-center gap-1">
                      <input
                        type="checkbox"
                        checked={allChecked}
                        disabled={!isAdmin}
                        onChange={() => toggleColumn(k)}
                        className="w-4 h-4 cursor-pointer disabled:cursor-not-allowed"
                        style={{ accentColor: BRAND.accent }}
                        title={t("permissions.selectAll")}
                      />
                      <span>{t(categoryLabelPath[k])}</span>
                    </div>
                  </th>
                );
              })}
              {isAdmin && <th className="text-center font-medium px-3 py-2.5 whitespace-nowrap sticky top-0 z-20 bg-slate-50">{t("common.delete")}</th>}
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {rows.map((u) => {
              const email = u.email.toLowerCase();
              const grant = draft[email] || {};
              return (
                <tr key={u.id}>
                  <td className="px-4 py-1.5 sticky left-0 z-10 bg-white">
                    <p className="text-slate-600 whitespace-nowrap">{u.email}</p>
                  </td>
                  {categoryKeys.map((k) => (
                    <td key={k} className="text-center px-3 py-1.5">
                      <input
                        type="checkbox"
                        checked={!!grant[k]}
                        disabled={!isAdmin}
                        onChange={() => toggleCell(email, k)}
                        className="w-4 h-4 cursor-pointer disabled:cursor-not-allowed"
                        style={{ accentColor: BRAND.accent }}
                      />
                    </td>
                  ))}
                  {isAdmin && (
                    <td className="text-center px-3 py-1.5">
                      <button
                        onClick={() => setConfirmRemove(u)}
                        disabled={removing === email}
                        className="text-slate-400 hover:text-red-500 disabled:opacity-40"
                        title={t("categoryAccess.removeUserTitle")}
                      >
                        {removing === email ? <Loader2 size={14} className="animate-spin" /> : <Trash2 size={14} />}
                      </button>
                    </td>
                  )}
                </tr>
              );
            })}
            {rows.length === 0 && (
              <tr>
                <td colSpan={categoryKeys.length + (isAdmin ? 2 : 1)}>
                  <EmptyState text={t("categoryAccess.emptyText")} />
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>

      {confirmRemove && (
        <Modal title={t("categoryAccess.removeUserTitle")} onClose={() => setConfirmRemove(null)}>
          <p className="text-sm text-slate-600 mb-5">
            <span className="font-medium text-slate-800">{confirmRemove.email}</span> — {t("categoryAccess.removeUserBody")}
          </p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setConfirmRemove(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
            <button onClick={() => removeUser(confirmRemove)} className="px-4 py-2 text-sm text-white rounded-lg bg-red-500 hover:bg-red-600">{t("common.delete")}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function PermissionsPage({ permissions, setPermissions, currentUser, addLog, showToast }) {
  const { lang, t } = useLang();
  const { departments, setDepartments, users, setUsers } = useAppData();
  const isAdmin = currentUser.role === "admin";

  // ── 부서 추가·수정·삭제 ──
  const [deptForm, setDeptForm] = useState(null);      // { id, ko, en, spId } · id는 신규일 때만 입력 가능
  const [deptEditing, setDeptEditing] = useState(null); // 수정 중인 부서 코드
  const [deptError, setDeptError] = useState("");
  const [deptSaving, setDeptSaving] = useState(false);
  const [confirmDeptDelete, setConfirmDeptDelete] = useState(null);

  const canEditDept = isAdmin && ICS_DEPT_LIST_READY;
  // 통제 항목이 이미 사용 중인 부서는 삭제를 막는다 (표시가 깨지는 것을 방지).
  function controlsUseDept(deptId) {
    return Array.isArray(window._icsAllControls) && window._icsAllControls.some((c) => c.dept === deptId);
  }

  function openDeptAdd() {
    setDeptForm({ id: "", ko: "", en: "" });
    setDeptEditing(null);
    setDeptError("");
  }
  function openDeptEdit(d) {
    setDeptForm({ id: d.id, ko: d.ko || "", en: d.en || "" });
    setDeptEditing(d.id);
    setDeptError("");
  }

  async function saveDept() {
    if (!canEditDept || !deptForm) return;
    const code = (deptForm.id || "").trim();  // 입력 표기 그대로 보존 (대문자 체계 지원)
    const ko = (deptForm.ko || "").trim();
    const en = (deptForm.en || "").trim() || ko;
    if (!ko) { setDeptError(t("settings.deptNameRequired")); return; }
    if (!deptEditing) {
      if (!code || !/^[a-z0-9_-]+$/i.test(code)) { setDeptError(t("settings.deptCodeRequired")); return; }
      if (departments.some((d) => d.id.toLowerCase() === code.toLowerCase())) { setDeptError(t("settings.deptCodeDuplicate")); return; }
    }
    setDeptError("");
    setDeptSaving(true);
    try {
      if (deptEditing) {
        const target = departments.find((d) => d.id === deptEditing);
        if (target?.spId) await icsUpdateItem(ICS_LISTS.departments, target.spId, { NameKo: ko, NameEn: en });
        setDepartments((prev) => prev.map((d) => (d.id === deptEditing ? { ...d, ko, en } : d)));
        const idx = INITIAL_DEPARTMENTS.findIndex((d) => d.id === deptEditing);
        if (idx >= 0) INITIAL_DEPARTMENTS[idx] = { ...INITIAL_DEPARTMENTS[idx], ko, en };
        addLog(currentUser.email, "edit_dept", "-", `부서 수정: ${ko} (${deptEditing})`, `Department updated: ${en} (${deptEditing})`);
        showToast(lang === "en" ? "Department updated." : "부서가 수정되었습니다.");
      } else {
        const created = await icsCreateItem(ICS_LISTS.departments, { Title: code, NameKo: ko, NameEn: en });
        const nd = { id: code, ko, en, spId: created.id };
        setDepartments((prev) => [...prev, nd]);
        INITIAL_DEPARTMENTS.push(nd);
        addLog(currentUser.email, "add_dept", "-", `부서 추가: ${ko} (${code})`, `Department added: ${en} (${code})`);
        showToast(lang === "en" ? "Department added." : "부서가 추가되었습니다.");
      }
      setDeptForm(null);
      setDeptEditing(null);
    } catch (e) {
      setDeptError((lang === "en" ? "Save failed: " : "저장에 실패했습니다: ") + e.message);
    } finally {
      setDeptSaving(false);
    }
  }

  async function deleteDept(d) {
    if (!canEditDept) return;
    setDeptSaving(true);
    try {
      if (d.spId) await icsDeleteItem(ICS_LISTS.departments, d.spId);
      setDepartments((prev) => prev.filter((x) => x.id !== d.id));
      const idx = INITIAL_DEPARTMENTS.findIndex((x) => x.id === d.id);
      if (idx >= 0) INITIAL_DEPARTMENTS.splice(idx, 1);
      if (selectedDeptId === d.id) setSelectedDeptId(null);
      addLog(currentUser.email, "delete_dept", "-", `부서 삭제: ${d.ko} (${d.id})`, `Department deleted: ${d.en} (${d.id})`);
      showToast(lang === "en" ? "Department deleted." : "부서가 삭제되었습니다.");
    } catch (e) {
      alert((lang === "en" ? "Delete failed: " : "삭제에 실패했습니다: ") + e.message);
    } finally {
      setDeptSaving(false);
      setConfirmDeptDelete(null);
    }
  }

  const [selectedEmail, setSelectedEmail] = useState(null);
  const [selectedDeptId, setSelectedDeptId] = useState(null);
  const selectedUser = users.find((u) => u.email === selectedEmail) || null;
  const [saving, setSaving] = useState(false);
  const ROLE_OPTIONS = ["accessor", "reviewer", "admin", "cfo", "rd", "guest"];
  const DEPT_CAPACITY_KEYS = ["deptsAccessor", "deptsReviewer", "deptsAdmin"]; // 매트릭스 컬럼 (Accessor/Reviewer/Admin)
  const CAPACITY_LABEL = { deptsAccessor: "roles.accessor", deptsReviewer: "roles.reviewer", deptsAdmin: "roles.admin" };

  const [draft, setDraft] = useState(null); // { role, deptsAccessor: [], deptsReviewer: [], deptsAdmin: [] }
  useEffect(() => {
    if (!selectedUser) { setDraft(null); return; }
    const p = permissions[selectedUser.email] || {};
    const allIds = departments.map((d) => d.id);
    // Admin 은 정의상 전 부서 관리자이므로 Admin 열만 전 부서로 채우고 잠근다.
    // Accessor/Reviewer 열은 저장된 값 그대로 두어 겸직을 지정할 수 있게 한다.
    // (예: Admin 이면서 IT팀 검토자 겸임, CFO 이면서 특정 부서 검토자 겸임)
    setDraft({
      role: selectedUser.role,
      deptsAccessor: p.deptsAccessor || [],
      deptsReviewer: p.deptsReviewer || [],
      deptsAdmin: selectedUser.role === "admin" ? allIds : p.deptsAdmin || [],
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedEmail]);

  function toggleDraftDept(capacityKey, deptId) {
    if (!draft) return;
    // Admin 역할은 전 부서 관리자라 Admin 열을 바꿀 수 없다. 나머지 열은 겸직 지정용으로 연다.
    if (draft.role === "admin" && capacityKey === "deptsAdmin") return;
    setDraft((prev) => {
      const list = prev[capacityKey];
      const next = list.includes(deptId) ? list.filter((x) => x !== deptId) : [...list, deptId];
      return { ...prev, [capacityKey]: next };
    });
  }
  function selectAllDraft(capacityKey, allOn) {
    if (!draft) return;
    if (draft.role === "admin" && capacityKey === "deptsAdmin") return;
    setDraft((prev) => ({ ...prev, [capacityKey]: allOn ? departments.map((d) => d.id) : [] }));
  }

  const sameSet = (a, b) => JSON.stringify([...a].sort()) === JSON.stringify([...b].sort());
  const isDirty =
    !!draft &&
    !!selectedUser &&
    (draft.role !== selectedUser.role ||
      !sameSet(draft.deptsAccessor, permissions[selectedUser.email]?.deptsAccessor || []) ||
      !sameSet(draft.deptsReviewer, permissions[selectedUser.email]?.deptsReviewer || []) ||
      !sameSet(draft.deptsAdmin, permissions[selectedUser.email]?.deptsAdmin || []));

  // 본인 계정의 Admin 역할은 스스로 바꿀 수 없다(잠금 사고 방지).
  const selfRoleLocked = !!selectedUser
    && selectedUser.email === currentUser.email
    && currentUser.role === "admin";

  async function applyChanges() {
    if (!isAdmin || !selectedUser || !draft || !isDirty) return;
    // 본인의 Admin 역할은 스스로 내릴 수 없다. 내리는 순간 이 화면에 접근하지 못하게 되고,
    // 되돌릴 화면조차 잃어 SharePoint 목록을 직접 고쳐야 복구된다.
    // 겸직은 아래 부서별 매트릭스로 처리하므로 역할을 바꿀 이유가 없다.
    if (selectedUser.email === currentUser.email && currentUser.role === "admin" && draft.role !== "admin") {
      alert(t("permissions.selfDemoteBlocked"));
      setDraft({ ...draft, role: "admin" });
      return;
    }
    const email = selectedUser.email.toLowerCase();
    const prevRole = selectedUser.role;
    const prevPerm = permissions[selectedUser.email] || {};
    setSaving(true);
    setUsers((prev) => prev.map((u) => (u.email === selectedUser.email ? { ...u, role: draft.role, dept: null } : u)));
    setPermissions((prev) => ({
      ...prev,
      [selectedUser.email]: {
        ...prevPerm,
        role: draft.role,
        deptsAccessor: draft.deptsAccessor,
        deptsReviewer: draft.deptsReviewer,
        deptsAdmin: draft.deptsAdmin,
        depts: Array.from(new Set([...draft.deptsAccessor, ...draft.deptsReviewer, ...draft.deptsAdmin])),
      },
    }));
    try {
      const existing = ICS_CATEGORY_ACCESS[email];
      const fields = {
        RoleOverride: draft.role,
        DeptsAccessor: draft.deptsAccessor.join(","),
        DeptsReviewer: draft.deptsReviewer.join(","),
        DeptsAdmin: draft.deptsAdmin.join(","),
      };
      if (existing?.spId) {
        await icsUpdateItem(ICS_LISTS.categoryAccess, existing.spId, fields);
      } else {
        const created = await icsCreateItem(ICS_LISTS.categoryAccess, { Title: email, ...fields });
        ICS_CATEGORY_ACCESS[email] = { spId: created.id };
      }
      ICS_CATEGORY_ACCESS[email] = {
        ...(ICS_CATEGORY_ACCESS[email] || {}),
        roleOverride: draft.role,
        deptsAccessor: draft.deptsAccessor,
        deptsReviewer: draft.deptsReviewer,
        deptsAdmin: draft.deptsAdmin,
      };
      addLog(currentUser.email, "edit_category_access", "-", `${email} 권한 변경`, `${email} permissions updated`);
      if (showToast) showToast(lang === "en" ? "Permission updated." : "권한이 반영되었습니다.");
    } catch (e) {
      setUsers((prev) => prev.map((u) => (u.email === selectedUser.email ? { ...u, role: prevRole } : u)));
      setPermissions((prev) => ({ ...prev, [selectedUser.email]: prevPerm }));
      alert("저장에 실패했습니다: " + e.message);
    } finally {
      setSaving(false);
    }
  }

  function capacitiesForDept(user, deptId) {
    const p = permissions[user.email] || {};
    const caps = DEPT_CAPACITY_KEYS.filter((k) => (p[k] || []).includes(deptId));
    // Admin 은 역할만으로 전 부서 관리자다. 다만 담당자·검토자를 겸할 수 있으므로
    // Admin 배지만 돌려주고 끝내면 겸직이 화면에서 사라진다. 두 가지를 함께 보여준다.
    if (user.role === "admin" && !caps.includes("deptsAdmin")) caps.push("deptsAdmin");
    return caps;
  }
  function usersForDept(deptId) {
    return users.filter((u) => u.role === "admin" || capacitiesForDept(u, deptId).length > 0);
  }
  function pickUser(email) {
    setSelectedEmail(email);
    setSelectedDeptId(null);
  }
  function pickDept(deptId) {
    setSelectedDeptId(deptId);
    setSelectedEmail(null);
  }

  // 부서 쪽(reverse-lookup) 패널에서의 빠른 추가/제거는 즉시 반영 (Accessor 자격으로 추가, 제거는 전체 자격에서 제외)
  async function quickAddToDept(targetUser, deptId, capacityKey) {
    if (!isAdmin || !targetUser || targetUser.role === "admin") return;
    const email = targetUser.email.toLowerCase();
    const prevPerm = permissions[targetUser.email] || {};
    const nextList = Array.from(new Set([...(prevPerm[capacityKey] || []), deptId]));
    setPermissions((prev) => ({
      ...prev,
      [targetUser.email]: { ...prevPerm, [capacityKey]: nextList, depts: Array.from(new Set([...(prevPerm.depts || []), deptId])) },
    }));
    try {
      const existing = ICS_CATEGORY_ACCESS[email];
      const fieldName = { deptsAccessor: "DeptsAccessor", deptsReviewer: "DeptsReviewer", deptsAdmin: "DeptsAdmin" }[capacityKey];
      const fields = { [fieldName]: nextList.join(",") };
      if (existing?.spId) await icsUpdateItem(ICS_LISTS.categoryAccess, existing.spId, fields);
      else {
        const created = await icsCreateItem(ICS_LISTS.categoryAccess, { Title: email, ...fields });
        ICS_CATEGORY_ACCESS[email] = { spId: created.id };
      }
      ICS_CATEGORY_ACCESS[email] = { ...(ICS_CATEGORY_ACCESS[email] || {}), [capacityKey]: nextList };
      const deptLabel = departments.find((d) => d.id === deptId)?.[lang] || deptId;
      addLog(
        currentUser.email,
        "edit_category_access",
        "-",
        `${email} · ${deptLabel} ${t(CAPACITY_LABEL[capacityKey])} 추가`,
        `${email} · ${deptLabel} ${t(CAPACITY_LABEL[capacityKey])} added`
      );
      if (showToast) showToast(lang === "en" ? "Permission updated." : "권한이 반영되었습니다.");
    } catch (e) {
      setPermissions((prev) => ({ ...prev, [targetUser.email]: prevPerm }));
      alert("저장에 실패했습니다: " + e.message);
    }
  }
  async function removeFromDept(targetUser, deptId) {
    if (!isAdmin || !targetUser || targetUser.role === "admin") return;
    const email = targetUser.email.toLowerCase();
    const prevPerm = permissions[targetUser.email] || {};
    const strip = (arr) => (arr || []).filter((d) => d !== deptId);
    const next = { deptsAccessor: strip(prevPerm.deptsAccessor), deptsReviewer: strip(prevPerm.deptsReviewer), deptsAdmin: strip(prevPerm.deptsAdmin) };
    setPermissions((prev) => ({ ...prev, [targetUser.email]: { ...prevPerm, ...next, depts: strip(prevPerm.depts) } }));
    try {
      const existing = ICS_CATEGORY_ACCESS[email];
      const fields = { DeptsAccessor: next.deptsAccessor.join(","), DeptsReviewer: next.deptsReviewer.join(","), DeptsAdmin: next.deptsAdmin.join(",") };
      if (existing?.spId) await icsUpdateItem(ICS_LISTS.categoryAccess, existing.spId, fields);
      else {
        const created = await icsCreateItem(ICS_LISTS.categoryAccess, { Title: email, ...fields });
        ICS_CATEGORY_ACCESS[email] = { spId: created.id };
      }
      ICS_CATEGORY_ACCESS[email] = { ...(ICS_CATEGORY_ACCESS[email] || {}), ...next };
      const deptLabel = departments.find((d) => d.id === deptId)?.[lang] || deptId;
      addLog(currentUser.email, "edit_category_access", "-", `${email} · ${deptLabel} 제외`, `${email} · ${deptLabel} removed`);
      if (showToast) showToast(lang === "en" ? "Permission updated." : "권한이 반영되었습니다.");
    } catch (e) {
      setPermissions((prev) => ({ ...prev, [targetUser.email]: prevPerm }));
      alert("저장에 실패했습니다: " + e.message);
    }
  }

  const [addUserQuery, setAddUserQuery] = useState("");
  const addUserCandidates =
    addUserQuery.trim().length > 0
      ? users
          .filter((u) => u.role !== "admin" && u.email.toLowerCase().includes(addUserQuery.trim().toLowerCase()))
          .filter((u) => selectedDeptId && capacitiesForDept(u, selectedDeptId).length === 0)
          .slice(0, 6)
      : [];

  const [userSearch, setUserSearch] = useState("");
  const qUser = userSearch.trim().toLowerCase();
  const searchedUsers = users.filter((u) => !qUser || u.email.toLowerCase().includes(qUser));

  return (
    <div>
      <SectionHeader icon={KeyRound} title={t("permissions.title")} subtitle={t("permissions.subtitle")} />

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-5">
        <div className="flex items-center justify-between gap-3 mb-3">
          <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2"><Building2 size={15} /> {t("settings.deptListTitle")}</h3>
          {isAdmin && (
            canEditDept ? (
              <button onClick={openDeptAdd} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg text-white flex-shrink-0" style={{ backgroundColor: BRAND.accent }}>
                <Plus size={13} /> {t("settings.addDeptBtn")}
              </button>
            ) : (
              <span className="text-xs text-slate-400 flex items-center gap-1 flex-shrink-0"><AlertTriangle size={12} /> {t("settings.deptListUnavailable")}</span>
            )
          )}
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
          {departments.map((d) => {
            const count = usersForDept(d.id).length;
            const inUse = count > 0 || controlsUseDept(d.id);
            return (
              <div
                key={d.id}
                className="flex items-center justify-between gap-1.5 px-2.5 py-2 rounded-lg text-xs transition-colors"
                style={{ backgroundColor: selectedDeptId === d.id ? BRAND.accentSoft : "#F8FAFC" }}
              >
                <button onClick={() => pickDept(d.id)} className="flex-1 min-w-0 text-left">
                  <span className="text-slate-700 truncate block">{d[lang]}</span>
                </button>
                <span className="flex items-center gap-1.5 flex-shrink-0">
                  <span
                    className="font-medium px-1.5 py-0.5 rounded-full"
                    style={{ backgroundColor: count > 0 ? BRAND.accentSoft : "#F1F5F9", color: count > 0 ? BRAND.accent : "#94A3B8" }}
                  >
                    {count}{lang === "en" ? "" : "명"}
                  </span>
                  <span className="text-slate-400 font-medium">{d.id.toUpperCase()}</span>
                  {canEditDept && (
                    <>
                      <button onClick={() => openDeptEdit(d)} className="text-slate-400 hover:text-teal-600" title={t("common.edit")}>
                        <Pencil size={12} />
                      </button>
                      <button
                        onClick={() => setConfirmDeptDelete(d)}
                        disabled={inUse}
                        className="text-slate-400 hover:text-red-500 disabled:opacity-30 disabled:cursor-not-allowed"
                        title={inUse ? t("settings.deptInUseHint") : t("common.delete")}
                      >
                        <Trash2 size={12} />
                      </button>
                    </>
                  )}
                </span>
              </div>
            );
          })}
          {departments.length === 0 && <EmptyState text={t("list.emptyText")} />}
        </div>
        {canEditDept && <p className="text-xs text-slate-400 mt-3">{t("settings.deptInUseHint")}</p>}
      </div>

      {deptForm && (
        <Modal title={deptEditing ? t("settings.deptEditTitle") : t("settings.addDeptBtn")} onClose={() => setDeptForm(null)}>
          <div className="space-y-3">
            <Field label={t("settings.deptCodePlaceholder")}>
              <input
                className={inputCls}
                value={deptForm.id}
                disabled={!!deptEditing}
                onChange={(e) => { setDeptForm({ ...deptForm, id: e.target.value }); if (deptError) setDeptError(""); }}
                placeholder={t("settings.deptCodePlaceholder")}
              />
              <p className="text-xs text-slate-400 mt-1.5">{t("settings.deptCodeHint")}</p>
            </Field>
            <Field label={t("settings.deptNameKoPlaceholder")}>
              <input className={inputCls} value={deptForm.ko} onChange={(e) => { setDeptForm({ ...deptForm, ko: e.target.value }); if (deptError) setDeptError(""); }} placeholder={t("settings.deptNameKoPlaceholder")} />
            </Field>
            <Field label={t("settings.deptNameEnPlaceholder")}>
              <input className={inputCls} value={deptForm.en} onChange={(e) => setDeptForm({ ...deptForm, en: e.target.value })} placeholder={t("settings.deptNameEnPlaceholder")} />
            </Field>
            {deptError && <p className="text-xs text-red-600 flex items-start gap-1"><AlertTriangle size={12} className="flex-shrink-0 mt-0.5" />{deptError}</p>}
          </div>
          <div className="flex justify-end gap-2 mt-5">
            <button onClick={() => setDeptForm(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
            <button onClick={saveDept} disabled={deptSaving} className="px-4 py-2 text-sm text-white rounded-lg disabled:opacity-40 flex items-center gap-1.5" style={{ backgroundColor: BRAND.accent }}>
              {deptSaving && <Loader2 size={14} className="animate-spin" />}{t("common.save")}
            </button>
          </div>
        </Modal>
      )}

      {confirmDeptDelete && (
        <Modal title={t("settings.deptDeleteTitle")} onClose={() => setConfirmDeptDelete(null)}>
          <p className="text-sm text-slate-600 mb-5">
            <span className="font-medium text-slate-800">{confirmDeptDelete[lang]} ({confirmDeptDelete.id.toUpperCase()})</span> — {t("settings.deptDeleteBody")}
          </p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setConfirmDeptDelete(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
            <button onClick={() => deleteDept(confirmDeptDelete)} disabled={deptSaving} className="px-4 py-2 text-sm text-white rounded-lg bg-red-500 hover:bg-red-600 disabled:opacity-40">{t("common.delete")}</button>
          </div>
        </Modal>
      )}

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2 mb-3"><Users size={15} /> {t("settings.userListTitle")}</h3>
          <input
            type="text"
            value={userSearch}
            onChange={(e) => setUserSearch(e.target.value)}
            placeholder={t("common.search")}
            className={`${inputCls} mb-2`}
          />
          <div className="divide-y divide-slate-100 max-h-96 overflow-y-auto">
            {searchedUsers.map((u) => (
              <button
                key={u.id}
                onClick={() => pickUser(u.email)}
                className="w-full py-2 flex items-center justify-between text-sm gap-2 text-left rounded-lg px-2 -mx-2"
                style={{ backgroundColor: selectedEmail === u.email ? BRAND.accentSoft : "transparent" }}
              >
                <span className="text-slate-600 truncate">{u.email}</span>
                <span className="flex items-center gap-1 flex-shrink-0">
                  <span
                    className="text-xs font-medium px-2 py-0.5 rounded-full"
                    style={{
                      backgroundColor: u.role === "admin" ? "#EDE9FE" : u.role === "reviewer" ? BRAND.accentSoft : "#F1F5F9",
                      color: u.role === "admin" ? "#6D28D9" : u.role === "reviewer" ? BRAND.accent : "#475569",
                    }}
                  >
                    {t(`roles.${u.role}`)}
                  </span>
                  {/* 역할 외에 담당자·검토자를 겸하는 경우 함께 보여준다.
                      역할 배지 하나만 보이면 겸직 여부를 알 수 없다. */}
                  {(() => {
                    const p = permissions[u.email] || {};
                    const extra = [];
                    if ((p.deptsAccessor || []).length && u.role !== "accessor") extra.push("deptsAccessor");
                    if ((p.deptsReviewer || []).length && u.role !== "reviewer") extra.push("deptsReviewer");
                    return extra.map((k) => (
                      <span key={k} className="text-[11px] font-medium px-1.5 py-0.5 rounded-full"
                            style={{ backgroundColor: k === "deptsReviewer" ? BRAND.accentSoft : "#F1F5F9",
                                     color: k === "deptsReviewer" ? BRAND.accent : "#475569" }}
                            title={(p[k] || []).join(", ")}>
                        {t(CAPACITY_LABEL[k])}
                      </span>
                    ));
                  })()}
                </span>
              </button>
            ))}
            {searchedUsers.length === 0 && <EmptyState text={t("categoryAccess.emptyText")} />}
          </div>
        </div>

        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2 mb-3">
            <Building2 size={15} /> {selectedDeptId ? t("permissions.deptUsersTitle") : t("permissions.selectedDeptTitle")}
          </h3>
          {selectedDeptId ? (
            <div>
              <p className="text-sm font-medium text-slate-700 mb-3">{departments.find((d) => d.id === selectedDeptId)?.[lang]}</p>

              {isAdmin && (
                <div className="relative mb-3">
                  <input
                    type="text"
                    value={addUserQuery}
                    onChange={(e) => setAddUserQuery(e.target.value)}
                    placeholder={t("permissions.addUserPlaceholder")}
                    className={inputCls}
                  />
                  {addUserCandidates.length > 0 && (
                    <div className="absolute z-10 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden">
                      {addUserCandidates.map((u) => (
                        <div key={u.id} className="px-3 py-2 flex items-center justify-between gap-2 hover:bg-slate-50">
                          <span className="text-sm text-slate-600 truncate">{u.email}</span>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            {DEPT_CAPACITY_KEYS.map((k) => (
                              <button
                                key={k}
                                onClick={() => {
                                  quickAddToDept(u, selectedDeptId, k);
                                  setAddUserQuery("");
                                }}
                                className="text-xs font-medium px-2 py-1 rounded-md border hover:bg-slate-50"
                                style={{ borderColor: BRAND.accent + "60", color: BRAND.accent }}
                              >
                                + {t(CAPACITY_LABEL[k])}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              <div className="divide-y divide-slate-100 max-h-80 overflow-y-auto pr-2">
                {usersForDept(selectedDeptId).map((u) => {
                  const caps = capacitiesForDept(u, selectedDeptId);
                  return (
                    <div key={u.id} className="w-full py-2.5 px-2 -mx-2 flex items-center justify-between text-sm gap-2 rounded-lg hover:bg-slate-50">
                      <button onClick={() => pickUser(u.email)} className="flex-1 min-w-0 flex items-center gap-1.5 flex-wrap text-left">
                        <span className="text-slate-600 truncate">{u.email}</span>
                        {caps.map((c) => (
                          <span
                            key={c}
                            className="text-xs font-medium px-2 py-0.5 rounded-full flex-shrink-0"
                            style={{
                              backgroundColor: c === "deptsAdmin" ? "#EDE9FE" : c === "deptsReviewer" ? BRAND.accentSoft : "#F1F5F9",
                              color: c === "deptsAdmin" ? "#6D28D9" : c === "deptsReviewer" ? BRAND.accent : "#475569",
                            }}
                          >
                            {t(CAPACITY_LABEL[c])}
                          </span>
                        ))}
                      </button>
                      {isAdmin && u.role !== "admin" && (
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            removeFromDept(u, selectedDeptId);
                          }}
                          className="flex-shrink-0 text-slate-300 hover:text-red-500"
                          title={t("permissions.removeFromDept")}
                        >
                          <X size={15} />
                        </button>
                      )}
                    </div>
                  );
                })}
                {usersForDept(selectedDeptId).length === 0 && <EmptyState text={t("permissions.noDeptUsers")} />}
              </div>
            </div>
          ) : !selectedUser ? (
            <EmptyState text={t("permissions.selectUserHint")} />
          ) : (
            <div>
              <p className="text-sm font-medium text-slate-700 mb-0.5">{selectedUser.email}</p>
              {isAdmin ? (
                <div className="mb-4">
                  <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{t("permissions.roleLabel")}</p>
                  <div className="flex flex-wrap gap-3 mb-2">
                    {ROLE_OPTIONS.map((r) => (
                      <label key={r}
                             className={`flex items-center gap-1.5 text-xs font-medium ${selfRoleLocked ? "text-slate-400 cursor-not-allowed" : "text-slate-600 cursor-pointer"}`}
                             title={selfRoleLocked ? t("permissions.selfRoleLocked") : ""}>
                        <input
                          type="radio"
                          name="role-select"
                          checked={draft?.role === r}
                          disabled={saving || selfRoleLocked}
                          onChange={() => setDraft((prev) => ({ ...prev, role: r }))}
                          className="w-4 h-4 cursor-pointer disabled:cursor-not-allowed"
                          style={{ accentColor: BRAND.accent }}
                        />
                        {t(`roles.${r}`)}
                      </label>
                    ))}
                  </div>
                  <p className="text-[11px] text-slate-400">{t("permissions.roleHint")}</p>
                </div>
              ) : (
                <p className="text-xs text-slate-400 mb-3">{t(`roles.${selectedUser.role}`)}</p>
              )}
              {draft?.role === "admin" && (
                <p className="text-[11px] text-slate-400 mb-3">{t("permissions.matrixHint")}</p>
              )}
              {selfRoleLocked && (
                // 역할 라디오가 잠겨 있는 이유를 화면에 밝힌다. 이유 없이 비활성이면 고장으로 오해한다.
                <p className="text-xs px-2.5 py-1.5 rounded-lg mb-3 flex items-start gap-1.5" style={{ backgroundColor: "#F1F5F9", color: "#475569" }}>
                  <Lock size={13} className="flex-shrink-0 mt-0.5" /> {t("permissions.selfRoleLocked")}
                </p>
              )}
              {draft?.role === "admin" ? (
                <p className="text-xs px-2.5 py-1.5 rounded-lg mb-2" style={{ backgroundColor: BRAND.accentSoft, color: BRAND.accent }}>
                  {t("permissions.adminAllDeptsNote")}
                </p>
              ) : (
                isAdmin &&
                draft && (
                  <div className="overflow-auto max-h-80 pr-2">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="text-xs text-slate-400">
                          <th className="text-left font-medium pb-1.5 sticky top-0 bg-white"></th>
                          {DEPT_CAPACITY_KEYS.map((k) => (
                            <th key={k} className="text-center font-medium pb-1.5 px-2 whitespace-nowrap sticky top-0 bg-white">
                              <div className="flex flex-col items-center gap-1">
                                <span>{t(CAPACITY_LABEL[k])}</span>
                                <div className="flex gap-1">
                                  <button onClick={() => selectAllDraft(k, true)} className="text-[10px] underline" style={{ color: BRAND.accent }}>
                                    {t("permissions.selectAll")}
                                  </button>
                                  <button onClick={() => selectAllDraft(k, false)} className="text-[10px] underline text-red-400">
                                    {t("permissions.deselectAll")}
                                  </button>
                                </div>
                              </div>
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {departments.map((d) => (
                          <tr key={d.id} className="hover:bg-slate-50">
                            <td className="py-2.5 text-sm text-slate-600 whitespace-nowrap">{d[lang]}</td>
                            {DEPT_CAPACITY_KEYS.map((k) => (
                              <td key={k} className="text-center px-2">
                                <input
                                  type="checkbox"
                                  checked={draft[k].includes(d.id)}
                                  disabled={saving || (draft.role === "admin" && k === "deptsAdmin")}
                                  title={draft.role === "admin" && k === "deptsAdmin"
                                    ? t("permissions.adminColLocked") : ""}
                                  onChange={() => toggleDraftDept(k, d.id)}
                                  className="w-4 h-4 cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
                                  style={{ accentColor: BRAND.accent }}
                                />
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )
              )}
              {isAdmin && (
                <button
                  onClick={applyChanges}
                  disabled={saving || !isDirty}
                  className="mt-3 text-xs font-medium px-3 py-1.5 rounded-lg text-white disabled:opacity-40"
                  style={{ backgroundColor: BRAND.accent }}
                >
                  {t("permissions.applyRole")}
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      <div className="bg-amber-50 text-amber-700 text-sm px-4 py-3 rounded-lg mt-4 flex items-center gap-2">
        <AlertTriangle size={16} className="flex-shrink-0" /> {t("permissions.notice")}
      </div>
    </div>
  );
}

export default function InternalControlApp({ initialUserId, initialControls, initialLog }) {
  const [lang, setLang] = useState("ko");
  const t = useMemo(() => makeT(lang), [lang]);

  const [departments, setDepartments] = useState(INITIAL_DEPARTMENTS);
  const [users, setUsers] = useState(INITIAL_USERS);

  // SharePoint(ICS_Controls/ICS_Requests, ICS_Log)에서 불러온 데이터가 있으면 그걸 쓰고,
  // 로드에 실패했을 때만(네트워크 오류 등) 코드 내 목업 데이터로 안전하게 대체한다.
  const usingSharePointData = !!(initialControls && initialControls.length);
  const [page, setPage] = useState("dashboard");
  const [controls, setControls] = useState(usingSharePointData ? initialControls : INITIAL_CONTROLS);
  const [log, setLog] = useState(initialLog && initialLog.length ? initialLog : INITIAL_LOG);
  const [fullLogLoaded, setFullLogLoaded] = useState(false);

  const [currentUserId] = useState(initialUserId || INITIAL_USERS[0]?.id);
  const [listFilter, setListFilter] = useState({ dept: "", cat: "", risk: "", status: "" });
  // 새 회계연도 생성 진행률 ({done, total, failed}) - 진행 중에는 화면 조작을 막는다.
  const [yearProgress, setYearProgress] = useState(null);
  // 사이드바에 표시할 내 결재 대기 건수.
  // 결재 승인 화면에 들어가야만 대기 건을 알 수 있어 요청이 방치되던 문제를 막는다.
  const [approvalCount, setApprovalCount] = useState(0);
  const [permissions, setPermissions] = useState(() => computeInitialPermissions(usingSharePointData ? initialControls : INITIAL_CONTROLS));
  const [learnContent, setLearnContent] = useState({
    ko: { intro: STR.ko.learn.intro, tips: [...STR.ko.learn.tips] },
    en: { intro: STR.en.learn.intro, tips: [...STR.en.learn.tips] },
  });
  const [learnVideos, setLearnVideos] = useState([]);
  const [learnImages, setLearnImages] = useState([]);

  // 연도(회계연도) 아카이브: years는 오래된순으로 정렬, 마지막 값이 현재 진행 중인(수정 가능한) 연도.
  // 연도 목록은 SharePoint 에 별도로 저장하지 않고, 로드된 통제 항목의 Year 값에서 복원한다.
  // (새 회계연도 항목이 생성되면 그 연도가 자동으로 목록에 나타난다)
  const [years, setYears] = useState(() => {
    const src = usingSharePointData ? initialControls : INITIAL_CONTROLS;
    const found = [...new Set((src || []).map((c) => String(c.year || "")).filter(Boolean))];
    return found.length ? found.sort() : ["2026"];
  });
  const [selectedYear, setSelectedYear] = useState("2026");
  const activeYear = years[years.length - 1];

  // 로그인 시엔 CFO/RD 컨펌 판단에 필요한 이벤트만 가볍게 불러왔으므로(loadIcsConfirmEvents),
  // "평가 이력 · 리포트" 화면에 처음 들어갈 때(또는 조회 연도를 바꿀 때)만 그 연도의 활동 로그를 지연 로드한다
  // (연도별로 서버에서 걸러서 받아오므로, 로그가 여러 해에 걸쳐 누적돼도 조회 속도가 계속 느려지지 않는다).
  useEffect(() => {
    if (page !== "history" || !usingSharePointData) return;
    setFullLogLoaded(false);
    loadIcsLog(selectedYear)
      .then((full) => { setLog(full); setFullLogLoaded(true); })
      .catch((e) => console.warn("[ICS] 활동 로그 로드 실패:", e.message));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [page, selectedYear]);
  const isArchived = selectedYear !== activeYear;

  // CFO/RD의 연도별 최종 결과 컨펌 상태. 별도 저장 없이, 이미 SharePoint(ICS_Log)에 저장된
  // cfo_confirm/rd_confirm(및 취소 시 cfo_cancel/rd_cancel) 로그를 읽어서 복원한다.
  // ICS_Log는 최신순으로 로드되므로, 연도·역할별로 "처음 만나는(=가장 최근) 이벤트"만 채택한다.
  const [yearConfirmations, setYearConfirmations] = useState(() => {
    const result = { [activeYear]: { cfo: null, rd: null } };
    const decided = {};
    (initialLog || []).forEach((entry) => {
      const m = /^(cfo|rd)_(confirm|cancel)$/.exec(entry.actionKey);
      if (!m) return;
      const role = m[1];
      const action = m[2];
      const y = entry.name || activeYear; // addLog는 연도를 name/nameEn 자리(SharePoint Detail 필드)에 기록함
      if (!result[y]) result[y] = { cfo: null, rd: null };
      const key = y + "_" + role;
      if (decided[key]) return; // 이미 이 연도·역할의 최신 이벤트를 확정함
      decided[key] = true;
      result[y][role] = action === "confirm" ? { by: entry.actor, at: entry.dateTime || entry.date } : null;
    });
    return result;
  });

  // 관리자 데이터 초기화(전체 삭제) 시 요구되는 비밀번호. 관리자가 설정 페이지에서 변경 가능 (데모 기본값: 0000).
  const [resetPassword, setResetPassword] = useState("0000");

  // 저장/제출 등 작업이 성공했을 때 잠깐 보여주는 토스트 알림 (조용히 끝나서 반영됐는지 헷갈리는 문제 방지)
  const [toast, setToast] = useState(null);
  const [toastShow, setToastShow] = useState(false);
  const toastTimerRef = useRef(null);
  const toastHideTimerRef = useRef(null);
  function showToast(message) {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    if (toastHideTimerRef.current) clearTimeout(toastHideTimerRef.current);
    setToast(message);
    setToastShow(false);
    requestAnimationFrame(() => requestAnimationFrame(() => setToastShow(true)));
    toastTimerRef.current = setTimeout(() => {
      setToastShow(false);
      toastHideTimerRef.current = setTimeout(() => setToast(null), 220);
    }, 2800);
  }

  const controlsForYear = useMemo(() => controls.filter((c) => c.year === selectedYear), [controls, selectedYear]);
  const logForYear = useMemo(() => log.filter((l) => l.year === selectedYear), [log, selectedYear]);
  const controlsForActiveYear = useMemo(() => controls.filter((c) => c.year === activeYear), [controls, activeYear]);

  const currentUser = users.find((u) => u.id === currentUserId) || users[0];
  const isAdmin = currentUser.role === "admin";
  const allowedDepts = getAllowedDepts(currentUser, permissions, departments);
  const accessorDepts = permissions[currentUser.email]?.deptsAccessor || [];
  const reviewerDepts = permissions[currentUser.email]?.deptsReviewer || [];

  function addLog(actor, actionKey, code, name, nameEn) {
    const today = new Date(new Date().getTime()+9*3600*1000).toISOString().slice(0, 10);
    setLog((prev) => [{ id: uid("log"), date: today, actor, actionKey, code, name, nameEn, year: selectedYear }, ...prev]);
    if (usingSharePointData) {
      const detail = name ? (nameEn && nameEn !== name ? `${name} / ${nameEn}` : name) : "";
      icsCreateItem(ICS_LISTS.log, { Title: actionKey, ActorEmail: actor, ControlId: code, Detail: detail }).catch((e) => {
        console.warn("[ICS] 로그 저장 실패:", e.message);
        // 활동 로그는 감사 대응 근거자료라 조용히 실패하면 안 된다.
        showToast(lang === "en"
          ? "Saved, but the activity log could not be recorded. Please notify IT."
          : "처리는 완료되었으나 활동 로그 저장에 실패했습니다. IT로 알려주세요.");
      });
    }
  }

  // 결재 대기 건수 갱신. 로그인 직후와 화면 전환 시 다시 센다.
  useEffect(() => {
    if (!usingSharePointData || !currentUser?.email) return;
    let alive = true;
    const me = currentUser.email.toLowerCase();
    loadIcsChangeRequests()
      .then((list) => {
        if (!alive) return;
        setApprovalCount(list.filter((r) => {
          if (r.status !== "pending") return false;
          const cur = r.steps[r.step - 1];
          return cur && (cur.approver || "").toLowerCase() === me && cur.status === "pending";
        }).length);
      })
      .catch((e) => console.warn("[ICS] 결재 대기 건수 조회 실패:", e.message));
    return () => { alive = false; };
  }, [currentUser?.email, page]);

  function goTo(pageKey, filter) {
    if (filter) setListFilter({ dept: "", cat: "", risk: "", status: "", ...filter });
    setPage(pageKey);
  }

  // 새 회계연도 시작. 현재 연도의 통제 항목 구성을 복제해 SharePoint(ICS_Controls)에
  // 실제로 생성한다. 예전에는 화면 상태만 바꿔 새로고침하면 사라졌다.
  // 248건 규모라 SharePoint 스로틀링을 피해 순차 생성하고, 진행률을 화면에 표시한다.
  async function startNewYear(newYear) {
    const newControls = buildArchiveYearControls(controls, activeYear, newYear);
    if (!newControls.length) {
      alert(lang === "en" ? "There are no control items to copy." : "복제할 통제 항목이 없습니다.");
      return;
    }

    if (!usingSharePointData) {
      // 로컬 모드(SharePoint 미사용)에서는 기존처럼 화면 상태만 갱신한다.
      setControls((prev) => [...prev, ...newControls]);
      setYears((prev) => [...prev, newYear]);
      setYearConfirmations((prev) => ({ ...prev, [newYear]: { cfo: null, rd: null } }));
      setSelectedYear(newYear);
      setListFilter({ dept: "", cat: "", risk: "", status: "" });
      return;
    }

    setYearProgress({ done: 0, total: newControls.length, failed: 0 });
    const created = [];
    let failed = 0;
    for (let i = 0; i < newControls.length; i++) {
      const c = newControls[i];
      try {
        const res = await icsCreateItem(ICS_LISTS.controls, {
          Title: c.code, Dept: c.dept, Category: c.cat,
          NameKo: c.name, NameEn: c.nameEn, DescKo: c.desc, DescEn: c.descEn,
          AccessorEmail: c.accessor, ReviewerEmail: c.reviewer,
          Year: newYear, Frequency: c.frequency, Importance: c.importance,
        });
        created.push({ ...c, spId: res.id });
      } catch (e) {
        failed++;
        console.warn(`[ICS] 새 연도 항목 생성 실패 (${c.code}):`, e.message);
      }
      setYearProgress({ done: i + 1, total: newControls.length, failed });
    }

    if (!created.length) {
      setYearProgress(null);
      alert(lang === "en"
        ? "Failed to create the new fiscal year. Please contact IT."
        : "새 회계연도 생성에 실패했습니다. IT로 문의해 주세요.");
      return;
    }

    setControls((prev) => [...prev, ...created]);
    setYears((prev) => (prev.includes(newYear) ? prev : [...prev, newYear]));
    setYearConfirmations((prev) => ({ ...prev, [newYear]: { cfo: null, rd: null } }));
    setSelectedYear(newYear);
    setListFilter({ dept: "", cat: "", risk: "", status: "" });
    addLog(currentUser.email, "start_new_year", "-", newYear, newYear);
    setYearProgress(null);

    if (failed > 0) {
      alert(lang === "en"
        ? `${created.length} items created, but ${failed} failed. Please check with IT before starting assessments.`

/* ── Graph 호출 재시도 ────────────────────────────────────────────────────
 * ICS 는 다른 APS 시스템과 달리 공통 api() 래퍼 없이 fetch 를 직접 호출해 왔다.
 * SharePoint 스로틀(429)·일시 장애(503/504)가 뜨면 그대로 실패해서,
 * 자가평가 제출이 항목만 만들어진 채 끊기거나 목록 조회가 통째로 날아갔다.
 * (LTR-PC 주석의 2026-08 ACC/GW 사례와 같은 유형)
 *
 * 대기 시간을 다른 시스템(3회·최대 5.6초)보다 짧게 잡은 이유:
 *  - ICS 는 저장 중 표시가 없다. 자가평가 제출 버튼에 스피너가 없어 몇 초만 멈춰도
 *    「눌리지 않았다」고 느끼고 다시 누른다. 그래서 누적 대기를 2초로 묶었다.
 *  - SharePoint 의 Retry-After 는 수십~수백 초가 오기도 한다. 그대로 따르면
 *    화면이 조용히 몇 분 멈춘다. 예산(4초)을 넘는 값이 오면 재시도하지 않고
 *    바로 실패시킨다. 곧 돌아올 상황이 아니라는 뜻이라, 기다리게 하는 것보다 낫다.
 *
 * 메서드별 규칙 (다른 시스템과 동일):
 *  - GET·PATCH·DELETE : 429·503·504 재시도. 다시 보내도 결과가 같다.
 *  - PUT :/content    : 경로에 내용을 통째로 덮어쓰므로 위와 같이 취급한다.
 *  - POST             : 429 만 재시도. 503/504 는 서버가 이미 처리하고 응답만
 *                       유실된 경우일 수 있어, 다시 보내면 항목이 두 번 생긴다.
 *  - 그 밖(401·403·404) : 다시 보내도 달라지지 않는다. 즉시 반환.
 *
 * 응답 판정은 호출부에 그대로 맡긴다. 각자의 !res.ok 처리와 오류 메시지를
 * 건드리지 않기 위해서다. 이 함수는 재시도만 담당한다.
 */
const ICS_RETRY_MAX = 2;      // 최초 1회 + 재시도 2회 = 최대 3회 시도
const ICS_RETRY_BUDGET = 4000; // 한 호출이 재시도로 쓸 수 있는 총 대기 시간(ms)

async function icsFetch(url, options = {}) {
  const method = String(options.method || "GET").toUpperCase();
  const idem =
    method === "GET" || method === "PATCH" || method === "DELETE" ||
    (method === "PUT" && /:\/content(\?|$)/.test(String(url)));
  let spent = 0;
  for (let attempt = 0; ; attempt++) {
    let res;
    try {
      res = await fetch(url, options);
    } catch (netErr) {
      // 네트워크가 끊긴 경우. 요청이 서버에 닿았는지 알 수 없어 멱등 호출만 다시 보낸다.
      const wait = attempt === 0 ? 600 : 1400;
      if (!idem || attempt >= ICS_RETRY_MAX || spent + wait > ICS_RETRY_BUDGET) throw netErr;
      console.warn(`[ICS] 네트워크 오류 재시도 ${attempt + 1}/${ICS_RETRY_MAX} (${wait}ms 후) ${method} ${String(url).slice(0, 120)}`);
      spent += wait;
      await new Promise((r) => setTimeout(r, wait));
      continue;
    }
    if (res.ok) return res;
    const retriable = res.status === 429 || (idem && (res.status === 503 || res.status === 504));
    if (!retriable || attempt >= ICS_RETRY_MAX) return res;
    const ra = parseInt(res.headers.get("Retry-After") || "0", 10);
    const wait = ra > 0 ? ra * 1000 : (attempt === 0 ? 600 : 1400);
    if (spent + wait > ICS_RETRY_BUDGET) {
      console.warn(`[ICS] ${res.status} — 대기 예산(${ICS_RETRY_BUDGET}ms)을 넘어 재시도하지 않습니다 (Retry-After ${ra || "없음"}) ${method} ${String(url).slice(0, 120)}`);
      return res;
    }
    console.warn(`[ICS] ${res.status} 재시도 ${attempt + 1}/${ICS_RETRY_MAX} (${wait}ms 후) ${method} ${String(url).slice(0, 120)}`);
    spent += wait;
    await new Promise((r) => setTimeout(r, wait));
  }
}

async function apiGet(path, token) {
  const res = await icsFetch(GRAPH + path, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error(path + " → " + res.status);
  return res.json();
}

/* ------------------------------------------------------------------
 * ICS_* SharePoint 목록 연동 (Controls / Requests / Log)
 * 목록 GUID를 하드코딩하지 않고 displayName으로 조회해서 캐싱한다 (오타/재생성에 안전).
 * ------------------------------------------------------------------ */
const ICS_LISTS = { controls: "ICS_Controls", requests: "ICS_Requests", approvals: "ICS_Approvals", log: "ICS_Log", categoryAccess: "ICS_CategoryAccess", departments: "ICS_Departments", changeRequests: "ICS_ChangeRequests" };
// ICS_Departments 목록이 존재하는지 여부. 없으면 부서는 ics_category_access.xlsx의 Departments 시트(읽기 전용)에서만 오고,
// 권한 관리 화면의 부서 추가·수정·삭제는 비활성화된다.
let ICS_DEPT_LIST_READY = false;
const _icsListIds = {};

async function getGraphToken() {
  const account = msalApp.getActiveAccount();
  const tokenRes = await msalApp.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
  return tokenRes.accessToken;
}

async function getIcsListId(listName) {
  if (_icsListIds[listName]) return _icsListIds[listName];
  const token = await getGraphToken();
  const res = await apiGet(`/sites/${_siteId}/lists?$filter=displayName eq '${listName}'`, token);
  if (!res.value || !res.value.length) throw new Error(`SharePoint 목록을 찾을 수 없습니다: ${listName}`);
  _icsListIds[listName] = res.value[0].id;
  return _icsListIds[listName];
}

// 5,000건 임계값 대비 apiAll() 패턴과 동일하게 nextLink를 따라가며 전체 조회
async function icsListAll(listName, extraQuery = "") {
  const token = await getGraphToken();
  const listId = await getIcsListId(listName);
  let items = [];
  let url = `${GRAPH}/sites/${_siteId}/lists/${listId}/items?expand=fields&$top=200${extraQuery}`;
  while (url) {
    const res = await icsFetch(url, {
      headers: { Authorization: "Bearer " + token, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" },
    });
    if (!res.ok) throw new Error(`${listName} 조회 실패 (${res.status})`);
    const data = await res.json();
    items = items.concat(data.value || []);
    url = data["@odata.nextLink"] || null;
  }
  return items;
}

// AttachedFiles 문서 라이브러리(다른 APS 시스템들과 동일한 공용 라이브러리)의 driveId를 이름으로 찾아 캐싱.
// GW에서 겪었던 문제(첫 번째 드라이브를 그냥 써버려서 잘못된 드라이브로 업로드되던 버그)를 피하려고
// 반드시 name === 'AttachedFiles'로 정확히 매칭한다.
let _icsAttachedFilesDriveId = null;
async function getIcsAttachedFilesDriveId() {
  if (_icsAttachedFilesDriveId) return _icsAttachedFilesDriveId;
  const token = await getGraphToken();
  const drivesData = await apiGet(`/sites/${_siteId}/drives`, token);
  const drive = (drivesData.value || []).find((d) => d.name === "AttachedFiles");
  if (!drive) throw new Error("AttachedFiles 문서 라이브러리를 찾을 수 없습니다.");
  _icsAttachedFilesDriveId = drive.id;
  return _icsAttachedFilesDriveId;
}

// 첨부파일을 SharePoint 원본 URL 노출 없이 안전하게 다운로드한다.
// webUrl을 <a href>에 직접 쓰지 않고, 인증된 세션으로 파일 내용을 직접 받아와 blob으로 다운로드시킴
// (경로는 icsUploadAttachment와 동일한 규칙: ICS_Requests_AttachedFiles/{requestItemId}/{subfolder?}/{파일명})
async function icsDownloadAttachment(requestItemId, fileName, subfolder = "") {
  try {
    const token = await getGraphToken();
    const driveId = await getIcsAttachedFilesDriveId();
    const path = subfolder
      ? `ICS_Requests_AttachedFiles/${requestItemId}/${subfolder}/${encodeURIComponent(fileName)}`
      : `ICS_Requests_AttachedFiles/${requestItemId}/${encodeURIComponent(fileName)}`;
    const res = await icsFetch(`${GRAPH}/drives/${driveId}/root:/${path}:/content`, {
      headers: { Authorization: "Bearer " + token },
    });
    if (!res.ok) throw new Error(`파일을 찾을 수 없습니다 (${res.status})`);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
  } catch (e) {
    alert("파일을 불러오지 못했습니다: " + e.message);
  }
}

// ICS_Requests_AttachedFiles/{requestItemId}/{파일명} 경로에 업로드하고 webUrl을 돌려준다.
// (BP_Requests/GW_Requests와 동일 패턴: filename|webUrl 쌍으로 목록 필드에 이어 붙여 저장)
async function icsUploadAttachment(requestItemId, file, subfolder = "") {
  const token = await getGraphToken();
  const driveId = await getIcsAttachedFilesDriveId();
  const buf = await file.arrayBuffer();
  const path = subfolder
    ? `ICS_Requests_AttachedFiles/${requestItemId}/${subfolder}/${encodeURIComponent(file.name)}`
    : `ICS_Requests_AttachedFiles/${requestItemId}/${encodeURIComponent(file.name)}`;
  const res = await icsFetch(
    `${GRAPH}/drives/${driveId}/root:/${path}:/content`,
    { method: "PUT", headers: { Authorization: "Bearer " + token, "Content-Type": file.type || "application/octet-stream" }, body: buf }
  );
  if (!res.ok) throw new Error(`파일 업로드 실패: ${file.name} (${res.status})`);
  return res.json(); // { webUrl, name, ... }
}

// 학습 영상/이미지 목록을 SharePoint의 ICS_Media-Files 폴더 안 실제 파일 목록에서 그대로 읽어온다 (별도 목록/manifest 없이 폴더 자체가 데이터).
// @microsoft.graph.downloadUrl은 임시(약 1시간) 직접 스트리밍 링크라, <video>/<img> 태그에 바로 넣어 재생/표시 가능.
// 학습 화면의 소개 문구/유의사항을 ics_category_access.xlsx의 "LearnContent" 시트에서 직접 읽어온다 (인앱 편집 폐지).
// 시트 컬럼: Lang(ko/en) | Type(intro/tip) | Order(숫자, tip 정렬용) | Text
async function loadIcsLearnContentFromMaster() {
  const token = await getGraphToken();
  const docDriveId = await getIcsDocDriveId(token);
  const res = await icsFetch(`${GRAPH}/drives/${docDriveId}/root:/ics_category_access.xlsx:/content`, { headers: { Authorization: "Bearer " + token }, cache: "no-cache" });
  if (!res.ok) throw new Error(`ics_category_access.xlsx not found (${res.status})`);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheet = wb.Sheets["LearnContent"];
  if (!sheet) throw new Error("LearnContent 시트가 없음");
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
  const header = (rows[0] || []).map((h) => String(h || "").trim());
  const langIdx = header.findIndex((h) => h.toLowerCase() === "lang");
  const typeIdx = header.findIndex((h) => h.toLowerCase() === "type");
  const orderIdx = header.findIndex((h) => h.toLowerCase() === "order");
  const textIdx = header.findIndex((h) => h.toLowerCase() === "text");
  if (langIdx < 0 || typeIdx < 0 || textIdx < 0) throw new Error("LearnContent 시트 헤더가 올바르지 않음 (Lang/Type/Text 필요)");

  const result = { ko: { intro: "", tips: [] }, en: { intro: "", tips: [] } };
  const tipRows = { ko: [], en: [] };
  rows.slice(1).forEach((row) => {
    const langRaw = String(row[langIdx] || "").trim().toLowerCase();
    const lang = langRaw === "en" ? "en" : langRaw === "ko" ? "ko" : null;
    if (!lang) return;
    const type = String(row[typeIdx] || "").trim().toLowerCase();
    const text = String(row[textIdx] || "").trim();
    const order = orderIdx >= 0 ? Number(row[orderIdx]) || 0 : 0;
    if (type === "intro") result[lang].intro = text;
    else if (type === "tip" && text) tipRows[lang].push({ order, text });
  });
  ["ko", "en"].forEach((lang) => {
    tipRows[lang].sort((a, b) => a.order - b.order);
    result[lang].tips = tipRows[lang].map((row) => row.text);
  });

  if (!result.ko.intro && !result.en.intro && result.ko.tips.length === 0 && result.en.tips.length === 0) {
    throw new Error("LearnContent 시트에 유효한 데이터가 없음");
  }
  return result;
}

async function icsListMediaFiles() {
  const token = await getGraphToken();
  const driveId = await getIcsAttachedFilesDriveId();
  const res = await icsFetch(
    `${GRAPH}/drives/${driveId}/root:/ICS_Media-Files:/children?$select=id,name,size,file,webUrl,lastModifiedDateTime`,
    { headers: { Authorization: "Bearer " + token } }
  );
  if (!res.ok) throw new Error(`ICS_Media-Files 폴더 조회 실패 (${res.status})`);
  const data = await res.json();
  const hidden = await loadIcsHiddenMedia().catch(() => []);
  const rawItems = (data.value || [])
    .filter((it) => it.file && !it.name.endsWith(".json")) // 폴더/설정용 JSON 제외, 실제 미디어 파일만
    .filter((it) => !hidden.includes(it.id)); // 숨김 처리된 파일 제외 (실제 파일은 그대로 남아있음)

  // 목록 조회(children) 응답엔 @microsoft.graph.downloadUrl이 안정적으로 안 실려서(재생/표시 불가한 webUrl만 옴),
  // 파일 하나하나 개별 조회로 실제 재생 가능한 다운로드 링크를 다시 받아온다.
  const items = await Promise.all(
    rawItems.map(async (it) => {
      let url = it.webUrl;
      try {
        // 여기만 icsFetch 를 쓰지 않는다. Promise.all 로 파일 수만큼 동시에 나가므로
        // 스로틀이 걸리면 재시도가 파일 수만큼 겹쳐 오히려 더 오래 막힌다.
        // 실패해도 아래 catch 에서 webUrl 로 폴백하므로 재시도할 실익도 없다.
        const detailRes = await fetch(
          `${GRAPH}/drives/${driveId}/items/${it.id}?$select=@microsoft.graph.downloadUrl`,
          { headers: { Authorization: "Bearer " + token } }
        );
        if (detailRes.ok) {
          const detail = await detailRes.json();
          if (detail["@microsoft.graph.downloadUrl"]) url = detail["@microsoft.graph.downloadUrl"];
        }
      } catch (e) {
        // 실패해도 webUrl로 폴백하고 계속 진행
      }
      return {
        id: it.id,
        name: it.name,
        size: it.size,
        url,
        mime: (it.file && it.file.mimeType) || "",
        modifiedAt: it.lastModifiedDateTime || "",
      };
    })
  );
  items.sort((a, b) => (a.modifiedAt < b.modifiedAt ? 1 : -1)); // 최신 업로드가 먼저 오도록
  return {
    videos: items.filter((it) => it.mime.startsWith("video/")),
    images: items.filter((it) => it.mime.startsWith("image/")),
  };
}

// 4MB를 넘는 파일은 Graph의 단순 PUT(:/content)으로 못 올리므로, 업로드 세션(resumable upload)으로 5MB(320KiB의 배수)씩 나눠 올린다.
// onProgress(percent:0~100)로 진행률을 알려준다.
async function icsUploadMediaFile(file, onProgress) {
  const token = await getGraphToken();
  const driveId = await getIcsAttachedFilesDriveId();
  const path = `ICS_Media-Files/${file.name}`;
  const sessionRes = await icsFetch(`${GRAPH}/drives/${driveId}/root:/${path}:/createUploadSession`, {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ item: { "@microsoft.graph.conflictBehavior": "rename" } }),
  });
  if (!sessionRes.ok) throw new Error(`업로드 세션 생성 실패 (${sessionRes.status})`);
  const { uploadUrl } = await sessionRes.json();

  const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB (320KiB의 배수, Graph 권장값)
  const total = file.size;
  let start = 0;
  let lastItem = null;
  while (start < total) {
    const end = Math.min(start + CHUNK_SIZE, total);
    const chunk = file.slice(start, end);
    const chunkRes = await icsFetch(uploadUrl, {
      method: "PUT",
      headers: { "Content-Range": `bytes ${start}-${end - 1}/${total}`, "Content-Length": String(end - start) },
      body: chunk,
    });
    if (!chunkRes.ok && chunkRes.status !== 202) {
      throw new Error(`업로드 실패 (${chunkRes.status}) - ${file.name}`);
    }
    if (onProgress) onProgress(Math.round((end / total) * 100));
    if (chunkRes.status !== 202) {
      lastItem = await chunkRes.json(); // 마지막 조각 응답에 완료된 driveItem 정보 포함
    }
    start = end;
  }
  return lastItem;
}

// ICS_Controls(마스터) + ICS_Requests(평가 진행 상태)를 읽어서 화면에서 쓰는 통제 항목 배열로 합친다.
// SharePoint 여러 줄 텍스트 컬럼이 "서식 있는 텍스트(리치 텍스트)"로 설정되어 있으면,
// Graph API로 일반 텍스트를 저장해도 <div class="ExternalClassXXXX">내용</div> 형태로 자동으로 감싸버린다.
// 화면에는 항상 순수 텍스트만 보이도록 이 껍데기를 벗겨내는 방어 함수.
function stripSpRichText(value) {
  if (!value) return value;
  const s = String(value);
  if (!s.includes("<") || !s.includes(">")) return s; // HTML 태그 자체가 없으면 그대로 반환
  // innerHTML 로 파싱하면 안 된다. 문서에 붙이지 않은 요소라도
  // <img src=x onerror=...> 같은 값은 그 자리에서 실행된다.
  // 이 함수를 거치는 값은 전부 사용자가 입력한 SharePoint 여러 줄 텍스트다
  // (자가평가 근거·검토 의견·FSA 의견·수정 요청 사유·통제 설명). 담당자가 넣어 둔
  // 문자열이 검토자·CFO·관리자 화면에서 그 사람의 세션으로 실행될 수 있었고,
  // 그 세션은 Sites.ReadWrite.All 토큰을 들고 있다.
  // DOMParser 가 만든 문서는 불활성이라 리소스를 불러오지도, 스크립트를 실행하지도 않는다.
  try {
    return new DOMParser().parseFromString(s, "text/html").body.textContent || "";
  } catch (e) {
    // 파싱이 실패해도 빈 값으로 만들지 않는다. 태그만 걷어내고 내용은 남긴다.
    return s.replace(/<[^>]*>/g, "");
  }
}

// 부서 체계를 25개 팀 단위로 새로 짜면서 예전 코드를 새 코드로 재배치.
// (sal은 이름 그대로 유지) 이 표에 있는 옛 코드를 만나면 새 코드로 바꿔서 화면에 보여주고,
// 동시에 SharePoint ICS_Controls의 Dept 값도 조용히 고쳐써서(자가 치유) 다음부터는 재매핑이 필요 없게 한다.
const LEGACY_DEPT_REMAP = { fin: "fnc", hr: "hrt", pur: "pcm", itd: "itt" };

// 카테고리 접근 권한을 ICS_CategoryAccess SharePoint 목록에서 읽어온다 (관리자 화면에서 실시간으로 켜고 끌 수 있도록 Excel 대신 목록 사용).
// 목록 컬럼: Title(이메일) | ICS_Overview | ControlMgmt | Self | Review | FSA | FSAReview | AdminOnly | Executive (전부 예/아니오 형식)
async function loadIcsCategoryAccessList() {
  const items = await icsListAll(ICS_LISTS.categoryAccess);
  const parsed = {};
  const isY = (v) => ["Y", "TRUE", "1"].includes(String(v || "").trim().toUpperCase());
  items.forEach((it) => {
    const f = it.fields;
    const email = (f.Title || "").trim().toLowerCase();
    if (!email) return;
    parsed[email] = {
      spId: it.id,
      icsOverview: isY(f.ICS_Overview),
      controlMgmt: isY(f.ControlMgmt),
      self: isY(f.Self),
      review: isY(f.Review),
      fsa: isY(f.FSA),
      fsaReview: isY(f.FSAReview),
      adminOnly: isY(f.AdminOnly),
      executive: isY(f.Executive),
      depts: (f.Depts || "").split(",").map((s) => s.trim()).filter(Boolean),
      deptsAccessor: (f.DeptsAccessor || "").split(",").map((s) => s.trim()).filter(Boolean),
      deptsReviewer: (f.DeptsReviewer || "").split(",").map((s) => s.trim()).filter(Boolean),
      deptsAdmin: (f.DeptsAdmin || "").split(",").map((s) => s.trim()).filter(Boolean),
      roleOverride: (f.RoleOverride || "").trim().toLowerCase() || null,
    };
  });
  return parsed;
}

// 부서 목록을 ICS_Departments SharePoint 목록에서 읽어온다.
// 목록 컬럼: Title(부서 코드) | NameKo | NameEn

async function loadIcsDepartmentList() {

async function loadIcsControls() {
  const [controlItems, requestItems] = await Promise.all([
    icsListAll(ICS_LISTS.controls),
    icsListAll(ICS_LISTS.requests),
  ]);

  const controls = controlItems.map((it) => {
    const f = it.fields;
    const rawDept = f.Dept || "";
    const dept = LEGACY_DEPT_REMAP[rawDept] || rawDept;
    if (dept !== rawDept) {
      // 예전 부서 코드였던 항목 — 백그라운드에서 SharePoint에도 새 코드로 조용히 반영 (실패해도 화면엔 이미 새 코드로 보이므로 무해함)
      icsUpdateItem(ICS_LISTS.controls, it.id, { Dept: dept }).catch((e) =>
        console.warn(`[ICS] 부서 코드 마이그레이션 실패 (${f.Title}):`, e.message)
      );
    }
    return {
      id: uid(),
      spId: it.id,
      requestSpId: null,
      code: f.Title || "",
      dept,
      cat: f.Category || "",
      name: f.NameKo || "",
      nameEn: f.NameEn || f.NameKo || "",
      desc: stripSpRichText(f.DescKo) || "",
      descEn: stripSpRichText(f.DescEn) || stripSpRichText(f.DescKo) || "",
      accessor: (f.AccessorEmail || "").trim().toLowerCase(),
      reviewer: (f.ReviewerEmail || "").trim().toLowerCase(),
      year: String(f.Year || "2026"),
      frequency: f.Frequency || "quarterly",
      importance: f.Importance || "medium",
      status: "not_started",
      selfRisk: null, selfComment: "", selfCommentEn: "", selfDate: null,
      reviewRisk: null, reviewComment: "", reviewCommentEn: "", reviewDate: null,
      actualSample: null, attachments: [], fsaAttachments: [], history: [],
      fsaStatus: "not_started", fsaRisk: null, fsaComment: "", fsaCommentEn: "", fsaDate: null,
      fsaReviewRisk: null, fsaReviewComment: "", fsaReviewCommentEn: "", fsaReviewDate: null,
      pendingEdit: null,
    };
  });
  controls.forEach((c) => { c.sampleSize = recommendedSample(c.importance, c.frequency); });

  requestItems.forEach((it) => {
    const f = it.fields;
    const match = controls.find((c) => c.code === f.ControlId && c.year === String(f.Year));
    if (!match) return; // 통제 마스터에 없는 고아 Request는 무시 (삭제된 통제 등)
    match.requestSpId = it.id;
    match.status = f.Status || "not_started";
    match.selfRisk = f.SelfRisk || null;
    match.selfComment = stripSpRichText(f.SelfCommentKo) || "";
    match.selfCommentEn = stripSpRichText(f.SelfCommentEn) || "";
    match.selfDate = f.SelfDate ? String(f.SelfDate) : null;  // 원본 ISO 유지 - 표시 시점에 formatDateTime 으로 포맷
    match.actualSample = f.SampleCount !== undefined && f.SampleCount !== "" && f.SampleCount !== null ? Number(f.SampleCount) : null;
    match.reviewRisk = f.ReviewRisk || null;
    match.reviewComment = stripSpRichText(f.ReviewCommentKo) || "";
    match.reviewCommentEn = stripSpRichText(f.ReviewCommentEn) || "";
    match.reviewDate = f.ReviewDate ? String(f.ReviewDate) : null;  // 원본 ISO 유지 - 표시 시점에 formatDateTime 으로 포맷
    match.fsaStatus = f.FsaStatus || "not_started";
    match.fsaRisk = f.FsaRisk || null;
    match.fsaComment = stripSpRichText(f.FsaCommentKo) || "";
    match.fsaCommentEn = stripSpRichText(f.FsaCommentEn) || "";
    match.fsaDate = f.FsaDate ? String(f.FsaDate) : null;  // 원본 ISO 유지 - 표시 시점에 formatDateTime 으로 포맷
    match.fsaReviewRisk = f.FsaReviewRisk || null;
    match.fsaReviewComment = stripSpRichText(f.FsaReviewCommentKo) || "";
    match.fsaReviewCommentEn = stripSpRichText(f.FsaReviewCommentEn) || "";
    match.fsaReviewDate = f.FsaReviewDate ? String(f.FsaReviewDate) : null;  // 원본 ISO 유지 - 표시 시점에 formatDateTime 으로 포맷
    match.attachments = f.AttachedFiles
      ? stripSpRichText(f.AttachedFiles).split(";").filter(Boolean).map((pair) => {
          const [name, webUrl] = pair.split("|");
          return { name, webUrl };
        })
      : [];
    match.fsaAttachments = f.FsaAttachedFiles
      ? stripSpRichText(f.FsaAttachedFiles).split(";").filter(Boolean).map((pair) => {
          const [name, webUrl] = pair.split("|");
          return { name, webUrl };
        })
      : [];
  });

  return controls;
}

function mapIcsLogItem(it) {
  const f = it.fields;
  const created = it.createdDateTime || (it.fields && it.fields.Created) || null;
  const detail = stripSpRichText(f.Detail) || "";
  return {
    id: it.id,
    date: created ? String(created).slice(0, 10) : new Date(new Date().getTime()+9*3600*1000).toISOString().slice(0, 10),
    dateTime: created || new Date().toISOString(), // 결재 시각(시:분까지) 표시용 전체 타임스탬프
    actor: f.ActorEmail || "",
    actionKey: f.Title || "edit_control",
    code: f.ControlId || "-",
    name: detail,
    nameEn: detail,
    // 예전엔 "2026"으로 하드코딩되어 있어서, 다음 회계연도가 시작되면(예: 2027) logForYear 필터링(l.year===selectedYear)이
    // 전부 빗나가 활동 로그가 텅 비어보이는 버그가 있었다. 실제 생성 시각 기준 연도로 계산하도록 수정(2026-07-29).
    year: created ? String(created).slice(0, 4) : String(new Date(Date.now() + 9*3600*1000).getUTCFullYear()),
  };
}

async function loadIcsLog(year) {
  // 연도별로 서버에서 걸러서 가져온다 - 로그가 여러 해에 걸쳐 누적돼도 "평가 이력" 화면은 항상 그 해 분량만 처리하면 되므로
  // 시간이 지나 로그가 수천 건으로 늘어나도 조회 속도가 계속 느려지지 않는다.
  const filter = year ? `&$filter=fields/Created ge '${year}-01-01T00:00:00Z' and fields/Created lt '${Number(year) + 1}-01-01T00:00:00Z'` : "";
  const items = await icsListAll(ICS_LISTS.log, `&$orderby=lastModifiedDateTime desc${filter}`);
  return items.map(mapIcsLogItem).sort((a, b) => (a.date < b.date ? 1 : -1));
}
