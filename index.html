// KEY_PATH(예: "learn.tips[0]")를 따라가며 STR.ko/STR.en 안에 값을 채워 넣는 헬퍼.
// 경로 중간 객체/배열이 없으면 자동 생성한다.
function setByKeyPath(obj, path, value) {
  const parts = path.split(".").flatMap((seg) => {
    const m = seg.match(/^(\w+)\[(\d+)\]$/);
    return m ? [m[1], m[2]] : [seg];
  });
  let node = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const key = parts[i];
    if (node[key] === undefined || node[key] === null) {
      node[key] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    }
    node = node[key];
  }
  node[parts[parts.length - 1]] = value;
}

// system_config_final.xlsx / ics_ui_strings.xlsx가 들어있는 문서 라이브러리(driveId)를 한 번만 조회해서 캐싱.
// loadIcsMasterConfig와 loadIcsUiStrings가 같은 라이브러리를 각자 따로 조회하던 중복 호출을 줄인다.
let _icsDocDriveId = null;
async function getIcsDocDriveId(token) {
  if (_icsDocDriveId) return _icsDocDriveId;
  const drives = await apiGet(`/sites/${_siteId}/drives`, token);
  const docDrive = (drives.value || []).find(d => ["Documents", "문서", "Shared Documents"].includes(d.name)) || (drives.value || [])[0];
  _icsDocDriveId = docDrive.id;
  return _icsDocDriveId;
}

// 화면에 보이는 모든 문구(STR.ko/STR.en)를 ics_ui_strings.xlsx(같은 문서 라이브러리, system_config_final.xlsx 옆)에서 덮어쓴다.
// 파일이 없거나 일부 KEY만 있어도 문제없음 — 못 찾은 문구는 코드 내 기본 문구가 그대로 쓰인다 (실패해도 화면이 깨지지 않음).
async function loadIcsUiStrings(token) {
  const docDriveId = await getIcsDocDriveId(token);
  const res = await icsFetch(`${GRAPH}/drives/${docDriveId}/root:/ics_ui_strings.xlsx:/content`, { headers: { Authorization: "Bearer " + token }, cache: "no-cache" });
  if (!res.ok) throw new Error(`ics_ui_strings.xlsx not found (${res.status})`);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });

  let applied = 0;
  rows.forEach((row) => {
    const key = (row[0] || "").toString().trim();
    if (!key || key.startsWith("──") || key === "KEY_PATH") return;
    const ko = row[1] !== undefined && row[1] !== null ? row[1].toString() : "";
    const en = row[2] !== undefined && row[2] !== null ? row[2].toString() : "";
    if (ko) { setByKeyPath(STR.ko, key, ko); applied++; }
    if (en) setByKeyPath(STR.en, key, en);
  });
  if (!applied) throw new Error("ics_ui_strings.xlsx에서 유효한 KEY_PATH를 하나도 찾지 못함");
}

// ICS 전용 마스터 설정 파일(ics_category_access.xlsx) 하나에서 사용자/부서/샘플링기준/문의이메일/카테고리권한을 전부 읽어온다.

// 실패해도 예외를 던지지 않고 null 을 돌려주어, Users 시트만으로도 앱이 뜨도록 한다.

// APS 공용 설정 파일에서 ICS_CONTACT 로 등록된 담당자 이메일을 읽어온다.
// 시트: SystemConfig · A열 설정 KEY 가 ICS_CONTACT 로 시작하는 행의 이메일을 모은다.
// 실패해도 예외를 던지지 않는다 - 호출부가 기존 Contact 시트 값으로 넘어간다.
async function loadIcsContactFromSystemConfig(token) {
  try {
    const docDriveId = await getIcsDocDriveId(token);
    const res = await icsFetch(`${GRAPH}/drives/${docDriveId}/root:/system_config_final.xlsx:/content`,
      { headers: { Authorization: "Bearer " + token }, cache: "no-cache" });
    if (!res.ok) throw new Error(`system_config_final.xlsx not found (${res.status})`);
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const sheet = wb.Sheets["SystemConfig"] || wb.Sheets[wb.SheetNames[0]];
    if (!sheet) throw new Error("SystemConfig 시트 없음");
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
    const emails = [];
    const pickEmail = (row) => {
      let found = "";
      (row || []).forEach((cell) => {
        const v = String(cell || "").trim();
        if (!found && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) found = v.toLowerCase();
      });
      return found;
    };
    rows.forEach((row) => {
      const key = String((row || [])[0] || "").trim().toUpperCase();
      if (key.startsWith("ICS_APPROVER_FINAL")) {
        const e = pickEmail(row);
        if (e && !ICS_APPROVER_FINAL) ICS_APPROVER_FINAL = e;
        return;
      }
      if (!key.startsWith("ICS_CONTACT")) return;
      (row || []).forEach((cell) => {
        const v = String(cell || "").trim();
        if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) emails.push(v.toLowerCase());
      });
    });
    return [...new Set(emails)];
  } catch (e) {
    console.warn("[ICS] system_config_final.xlsx ICS_CONTACT 로드 실패:", e.message);
    return null;
  }
}

async function loadIcsMasterConfig(token) {
  const docDriveId = await getIcsDocDriveId(token);
  const res = await icsFetch(`${GRAPH}/drives/${docDriveId}/root:/ics_category_access.xlsx:/content`, { headers: { Authorization: "Bearer " + token }, cache: "no-cache" });
  if (!res.ok) throw new Error(`ics_category_access.xlsx not found (${res.status})`);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });

  function sheetRows(name) {
    const sheet = wb.Sheets[name];
    return sheet ? XLSX.utils.sheet_to_json(sheet, { header: 1 }) : null;
  }
  function colIdx(header, name) {
    return header.findIndex((h) => String(h || "").trim().toLowerCase() === name.toLowerCase());
  }

  // --- Departments 시트: Code | NameKo | NameEn ---
  const deptRows = sheetRows("Departments");
  if (deptRows && deptRows.length > 1) {
    const header = deptRows[0].map((h) => String(h || "").trim());
    const codeIdx = colIdx(header, "Code");
    const koIdx = colIdx(header, "NameKo");
    const enIdx = colIdx(header, "NameEn");
    const newDepts = [];
    deptRows.slice(1).forEach((row) => {
      const code = codeIdx >= 0 ? String(row[codeIdx] || "").trim() : "";
      if (!code) return;
      newDepts.push({ id: code, ko: (koIdx >= 0 && row[koIdx]) || code, en: (enIdx >= 0 && row[enIdx]) || (koIdx >= 0 && row[koIdx]) || code });
    });
    if (newDepts.length) {
      INITIAL_DEPARTMENTS.length = 0;
      newDepts.forEach((d) => INITIAL_DEPARTMENTS.push(d));
    }
  }

  // --- SamplingMatrix 시트: Importance | Frequency | Count (있는 조합만 코드 기본값 위에 덮어씀) ---
  const sampleRows = sheetRows("SamplingMatrix");
  if (sampleRows && sampleRows.length > 1) {
    const header = sampleRows[0].map((h) => String(h || "").trim());
    const impIdx = colIdx(header, "Importance");
    const freqIdx = colIdx(header, "Frequency");
    const cntIdx = colIdx(header, "Count");
    sampleRows.slice(1).forEach((row) => {
      const imp = impIdx >= 0 ? String(row[impIdx] || "").trim().toLowerCase() : "";
      const freq = freqIdx >= 0 ? String(row[freqIdx] || "").trim().toLowerCase() : "";
      const num = cntIdx >= 0 ? Number(row[cntIdx]) : NaN;
      if (SAMPLE_TABLE[imp] && freq && !Number.isNaN(num)) SAMPLE_TABLE[imp][freq] = num;
    });
  }

  // --- BU Admin 문의 이메일 ---
  // 1순위: system_config_final.xlsx 의 ICS_CONTACT (APS 공용 설정 파일)
  // 2순위: ics_category_access.xlsx 의 Contact 시트 (대체값)
  const cfgContacts = await loadIcsContactFromSystemConfig(token);
  if (cfgContacts && cfgContacts.length) {
    ICS_CONTACT_EMAILS = cfgContacts;
    ICS_CONTACT_EMAIL = cfgContacts[0];
    console.log(`[ICS] ICS_CONTACT ${cfgContacts.length}명 로드 (system_config_final.xlsx)`);
  }

  // --- Contact 시트 (1순위 로드 실패 시에만 사용) ---
  const contactRows = sheetRows("Contact");
  if (contactRows && contactRows.length > 1) {
    const header = contactRows[0].map((h) => String(h || "").trim());
    const emailIdx = colIdx(header, "Email");
    const email = emailIdx >= 0 ? String(contactRows[1][emailIdx] || "").trim().toLowerCase() : "";
    if (email && !ICS_CONTACT_EMAIL) ICS_CONTACT_EMAIL = email;
    if (email && !ICS_CONTACT_EMAILS.length) ICS_CONTACT_EMAILS = [email];
  }

  // --- 사용자 마스터: employee_search.xlsx (APS 전 시스템 공용) ---
  // 열: Company | Department | Team | EngName | EMail | WMC | Boss | Boss of Boss
  // ICS 역할(Accessor/Reviewer/Admin/CFO/RD)은 이 파일에 없으므로 전원 guest 로 시작하고,
  // 실제 역할은 ICS_CategoryAccess 목록의 RoleOverride 에서 덮어쓴다(기존과 동일한 흐름).
  const ROLE_PRIORITY = { admin: 0, rd: 1, cfo: 2, reviewer: 3, accessor: 4, guest: 5 };
  const byEmail = {};

  const empRows = await loadIcsEmployeeRows(token);
  if (empRows && empRows.length > 1) {
    const eHeader = empRows[0].map((h) => String(h || "").trim());
    const eMailIdx = colIdx(eHeader, "EMail") >= 0 ? colIdx(eHeader, "EMail") : colIdx(eHeader, "Email");
    const eNameIdx = colIdx(eHeader, "EngName");
    const eDeptIdx = colIdx(eHeader, "Department");
    const eTeamIdx = colIdx(eHeader, "Team");
    const eBossIdx = colIdx(eHeader, "Boss");
    const eBoss2Idx = colIdx(eHeader, "Boss of Boss");
    const _mcNames = new Set();
    const _empInfo = {};
    const _dir = [];
    empRows.slice(1).forEach((row) => {
      const email = eMailIdx >= 0 ? String(row[eMailIdx] || "").trim().toLowerCase() : "";
      if (!email) return;
      const nm = eNameIdx >= 0 ? String(row[eNameIdx] || "").trim() : "";
      byEmail[email] = {
        email, name: nm || email, nameEn: nm || email, role: "guest", dept: null,
        deptLabel: eDeptIdx >= 0 ? String(row[eDeptIdx] || "").trim() : "",
      };
      const _dept = eDeptIdx >= 0 ? String(row[eDeptIdx] || "").trim() : "";
      const _team = eTeamIdx >= 0 ? String(row[eTeamIdx] || "").trim() : "";
      if (nm) {
        ICS_NAME_TO_EMAIL[nm.toLowerCase()] = email;
        // MC 후보 화면에서 부서·팀으로 사람을 찾을 수 있게 함께 보관한다.
        _empInfo[nm.toLowerCase()] = { dept: _dept, team: _team };
      }
      _dir.push({ name: nm || email, email, dept: _dept, team: _team });
      // "-" 는 상사 없음을 뜻한다 (CEO 등)
      const clean = (v) => { const t = String(v || "").trim(); return t && t !== "-" ? t : ""; };
      const _b1 = eBossIdx >= 0 ? clean(row[eBossIdx]) : "";
      const _b2 = eBoss2Idx >= 0 ? clean(row[eBoss2Idx]) : "";
      ICS_BOSS_MAP[email] = { boss: _b1, bossOfBoss: _b2 };
      // H열에 이름이 있으면 MC 후보로 모은다 (이메일 변환은 명부를 다 읽은 뒤에 한다)
      if (_b2) _mcNames.add(_b2);
    });
    // 이름 → 이메일 변환은 명부를 모두 읽은 뒤에 해야 누락이 없다.
    // 이름 → 이메일 변환. 이름도 함께 담아 화면에서 「이름 · 이메일」로 보여준다.
    const _seenMc = new Set();
    ICS_MC_CANDIDATES = [..._mcNames]
      .map((n) => {
        const info = _empInfo[n.toLowerCase()] || {};
        return { name: n, email: ICS_NAME_TO_EMAIL[n.toLowerCase()] || "",
                 dept: info.dept || "", team: info.team || "" };
      })
      .filter((x) => x.email && !_seenMc.has(x.email) && _seenMc.add(x.email));
    ICS_EMPLOYEE_DIR = _dir.sort((a, b) => a.name.localeCompare(b.name));
    console.log(`[ICS] employee_search.xlsx 사용자 ${Object.keys(byEmail).length}명 로드 · MC 후보 ${ICS_MC_CANDIDATES.length}명`);
  } else {
    console.warn("[ICS] employee_search.xlsx 를 읽지 못함 - Users 시트로 대체 시도");
  }

  // Users 시트는 보조 명단으로만 쓴다.
  // employee_search 에 없는 계정(외부 감사인·이관 대기 등)이 조용히 사라지지 않도록 병합한다.
  // 시트가 없거나 비어 있어도 오류로 처리하지 않는다.
  const userRows = sheetRows("Users");
  if (userRows && userRows.length > 1) {
    const uHeader = userRows[0].map((h) => String(h || "").trim());
    const emailIdx = colIdx(uHeader, "Email");
    const nameKoIdx = colIdx(uHeader, "NameKo");
    const nameEnIdx = colIdx(uHeader, "NameEn");
    const roleIdx = colIdx(uHeader, "Role");
    const deptIdx = colIdx(uHeader, "Dept");
    let merged = 0;
    userRows.slice(1).forEach((row) => {
      const email = emailIdx >= 0 ? String(row[emailIdx] || "").trim().toLowerCase() : "";
      if (!email || byEmail[email]) return; // employee_search 값을 우선한다
      let role = roleIdx >= 0 ? String(row[roleIdx] || "").trim().toLowerCase() : "";
      if (!(role in ROLE_PRIORITY)) role = "guest";
      const nameKo = nameKoIdx >= 0 ? String(row[nameKoIdx] || "").trim() : "";
      const nameEn = nameEnIdx >= 0 ? String(row[nameEnIdx] || "").trim() : "";
      const dept = deptIdx >= 0 ? String(row[deptIdx] || "").trim() : "";
      byEmail[email] = {
        email, name: nameKo || email, nameEn: nameEn || nameKo || email, role,
        dept: (role === "accessor" || role === "reviewer") && dept ? dept : null,
      };
      merged++;
    });
    if (merged) console.log(`[ICS] Users 시트에서 ${merged}명 추가 병합 (employee_search 미등록 계정)`);
  }

  const dedupedUsers = Object.values(byEmail);
  if (!dedupedUsers.length) throw new Error("사용자 명단을 찾지 못했습니다 (employee_search.xlsx · Users 시트 모두 비어 있음)");
  INITIAL_USERS.length = 0;
  dedupedUsers.forEach((u, i) => { u.id = `u${i + 1}`; INITIAL_USERS.push(u); });
  // 카테고리 접근 권한은 더 이상 이 Excel 시트에서 읽지 않는다 - loadIcsCategoryAccessList()가 ICS_CategoryAccess
  // SharePoint 목록에서 읽어오며, 관리자 화면에서 직접 켜고 끄면 그 목록에 실시간으로 저장된다.

}

// 사용자 마스터에 등록되지 않은 계정에게 보여주는 전체 화면.
// MKQR 의 AccessDenied 와 동일한 구성 - 현재 계정, 담당자 목록, APS 복귀 링크.
function IcsAccessDenied({ userEmail, adminEmails }) {
  const subject = encodeURIComponent("ICS 접근 권한 요청");
  const body = encodeURIComponent(`ICS(내부통제관리시스템) 접근 권한을 요청드립니다.\n계정: ${userEmail}`);
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: "#F5F6F8" }}>
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-8 max-w-md w-full text-center">
        <AlertTriangle size={32} className="mx-auto text-amber-500 mb-3" />
        <h2 className="text-lg font-semibold text-slate-800 mb-1">접근 권한 없음</h2>
        <p className="text-sm text-slate-500 mb-4">
          내부통제관리시스템(ICS)은 등록된 임직원만 이용할 수 있습니다. 현재 계정({userEmail})은 접근 권한이 없습니다.
        </p>
        {adminEmails && adminEmails.length > 0 && (
          <div className="bg-slate-50 rounded-lg p-4 text-left mb-4">
            <div className="text-xs font-medium text-slate-500 mb-2">아래 등록된 담당자에게 접근 권한을 요청해주세요</div>
            <div className="space-y-1">
              {adminEmails.map((email) => (
                <a key={email} href={`mailto:${email}?subject=${subject}&body=${body}`}
                   className="flex items-center gap-1.5 text-sm text-slate-700 hover:underline">
                  <Mail size={13} className="text-slate-400 flex-shrink-0" /> {email}
                </a>
              ))}
            </div>
          </div>
        )}
        <a href="https://aps.startruckkorea.com/"
           className="inline-flex items-center gap-1.5 text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-full px-4 py-2 hover:bg-slate-100">
          <ArrowUpRight size={14} /> APS로 돌아가기
        </a>
      </div>
    </div>
  );
}

async function icsBoot(account) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("loading").style.display = "flex";
  let configLoadFailed = false;
  let loadedControls = null;
  let loadedLog = null;
  try {
    const tokenRes = await msalApp.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
    const token = tokenRes.accessToken;
    const siteRes = await apiGet(`/sites/${SITE_PATH}`, token);
    _siteId = siteRes.id;

    // 서로 의존하지 않는 5개 로드를 병렬로 실행해서 로그인 대기 시간을 줄인다 (예전엔 하나씩 순서대로 기다렸음).
    const [configResult, uiStringsResult, controlsResult, logResult, categoryAccessResult, deptListResult] = await Promise.allSettled([
      loadIcsMasterConfig(token),
      loadIcsUiStrings(token),
      loadIcsControls(),
      loadIcsConfirmEvents(),
      loadIcsCategoryAccessList(),
      loadIcsDepartmentList(),
    ]);

    if (configResult.status === "rejected") throw configResult.reason;

    // UI 문구 커스터마이징은 선택 사항이라 실패해도 앱 진행을 막지 않는다 (파일이 아직 없으면 코드 내 기본 문구 사용).
    if (uiStringsResult.status === "rejected") {
      console.warn("[ICS] ics_ui_strings.xlsx 로드 실패, 코드 내 기본 문구로 진행:", uiStringsResult.reason.message);
    }
    // 통제 항목/로그 로드 실패 시에도 화면 자체는 뜨게 하고(빈 목록), 콘솔에만 경고를 남긴다.
    if (controlsResult.status === "fulfilled") loadedControls = controlsResult.value;
    else console.warn("[ICS] 통제 항목 로드 실패:", controlsResult.reason.message);
    if (logResult.status === "fulfilled") loadedLog = logResult.value;
    else console.warn("[ICS] 활동 로그 로드 실패:", logResult.reason.message);
    // ICS_CategoryAccess 목록이 아직 없어도(첫 설치 등) 실패로 앱을 막지 않고 기본 권한(역할 기반)으로 진행.
    if (categoryAccessResult.status === "fulfilled") ICS_CATEGORY_ACCESS = categoryAccessResult.value;
    else console.warn("[ICS] ICS_CategoryAccess 목록 로드 실패, 기본 권한으로 진행:", categoryAccessResult.reason.message);

    // ICS_Departments 목록이 있으면 부서 마스터로 사용한다 (없으면 Excel Departments 시트 값을 그대로 유지).
    if (deptListResult.status === "fulfilled" && Array.isArray(deptListResult.value)) {
      ICS_DEPT_LIST_READY = true;
      if (deptListResult.value.length) {
        INITIAL_DEPARTMENTS.length = 0;
        deptListResult.value.forEach((d) => INITIAL_DEPARTMENTS.push(d));
      }
      console.log(`[ICS] ICS_Departments 목록 사용 (${deptListResult.value.length}개)`);
    } else {
      console.warn("[ICS] ICS_Departments 목록 없음 — Excel Departments 시트 값으로 진행 (부서 편집 비활성)");
    }

    // 카테고리 접근 권한 화면에서 직접 추가한 사용자는 Users 시트에 없으므로,
    // ICS_CategoryAccess 목록에만 있는 이메일을 사용자 목록에 병합해 다음 접속에도 유지되게 한다.
    {
      // [주의] 여기서 병합된 계정은 사용자 마스터에 없으므로 로그인 게이트를 통과시키지 않는다.
      // 카테고리 접근 권한 화면의 표에만 나타나도록 canLogin: false 로 표시해 둔다.
      // (표시 전용으로 병합하지 않으면 관리자가 부여해 둔 권한이 화면에서 사라진다)
      const known = new Set(INITIAL_USERS.map((u) => (u.email || "").toLowerCase()));
      let extra = 0;
      Object.keys(ICS_CATEGORY_ACCESS).forEach((email) => {
        if (!email || known.has(email)) return;
        extra++;
        INITIAL_USERS.push({
          id: `ua${extra}`, email, name: email, nameEn: email,
          role: "guest", dept: null, fromAccessList: true, canLogin: false,
        });
      });
      if (extra) console.log(`[ICS] CategoryAccess 목록에서 사용자 ${extra}명 병합 (표시 전용, 로그인 불가)`);
    }

    // Users 시트의 Role 대신, 권한 관리 화면에서 직접 지정한 RoleOverride가 있으면 그걸로 덮어쓴다
    // (Users 시트의 Role/Dept 컬럼을 더 이상 쓰지 않고 앱에서 전부 관리하고 싶은 경우를 위함).
    const VALID_ROLES = new Set(["accessor", "reviewer", "admin", "cfo", "rd", "guest"]);
    INITIAL_USERS.forEach((u) => {
      const override = ICS_CATEGORY_ACCESS[(u.email || "").toLowerCase()]?.roleOverride;
      if (override && VALID_ROLES.has(override) && override !== u.role) {
        u.role = override;
        u.dept = null; // Role이 바뀌면 Users 시트의 옛 Dept 값은 더 이상 의미가 없으므로 비움 (부서 접근은 카테고리 접근 권한 화면의 체크박스로 관리)
      }
    });
  } catch (e) {
    // INITIAL_USERS를 코드에 하드코딩해두지 않으므로, 여기서 실패하면 사용자 목록이 비어있는 채로 남는다.
    // 그대로 진행하면 "권한 없음"으로 오인되니, 실제 원인(설정 파일 로드 실패)을 화면에 명확히 알린다.
    console.warn("[ICS] ics_category_access.xlsx 로드 실패:", e.message);
    configLoadFailed = true;
  }

  if (configLoadFailed || INITIAL_USERS.length === 0) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    showLoginErr("사용자 설정(ics_category_access.xlsx)을 불러오지 못했습니다. 잠시 후 새로고침하거나 관리자에게 문의해주세요.");
    return;
  }

  // 다른 APS 시스템들과 동일하게, UPN(username)과 mail 클레임을 둘 다 대조한다.
  // 두 값이 다른 계정(과거 도메인 이전, 별칭 메일 등)도 Users 시트에 등록된 이메일과 매칭되도록 하기 위함.
  const candidateEmails = [
    account.username,
    account.idTokenClaims?.email,
    account.idTokenClaims?.preferred_username,
  ].filter(Boolean).map((e) => e.toLowerCase());
  const myEmail = candidateEmails[0] || "";
  // canLogin === false 인 항목은 카테고리 접근 권한 표시용으로만 병합된 계정이므로
  // 사용자 마스터(employee_search.xlsx)에 등록된 것으로 보지 않는다.
  let matched = INITIAL_USERS.find(u => u.canLogin !== false && candidateEmails.includes(u.email.toLowerCase()));
  if (!matched) {
    // 사용자 마스터(employee_search.xlsx)에 없는 계정은 접근을 차단한다.
    // 예전에는 guest 로 들여보냈으나, guest 가 전 부서 조회 권한을 갖는 구조라
    // 등록되지 않은 계정에 전사 통제 현황이 노출될 수 있었다.
    // MKQR 과 동일하게 "접근 권한 없음" 전체 화면으로 통일한다.
    const loadingEl0 = document.getElementById("loading");
    if (loadingEl0) loadingEl0.remove();
    const rootEl0 = document.getElementById("root");
    createRoot(rootEl0).render(
      <IcsAccessDenied userEmail={myEmail || "(알 수 없음)"} adminEmails={ICS_CONTACT_EMAILS} />
    );
    return;
  }

  window.icsSignOut = () => msalApp.logoutRedirect();

  const loadingEl = document.getElementById("loading");
  if (loadingEl) loadingEl.remove();
  const rootEl = document.getElementById("root");
  createRoot(rootEl).render(<InternalControlApp initialUserId={matched.id} initialControls={loadedControls} initialLog={loadedLog} />);
}

(async function initMsal() {
  const btn = document.getElementById("btn-login");
  try {
    await msalApp.initialize();
    const resp = await msalApp.handleRedirectPromise();
    if (resp && resp.account) { msalApp.setActiveAccount(resp.account); await icsBoot(resp.account); return; }
    const accounts = msalApp.getAllAccounts();
    if (accounts.length) { msalApp.setActiveAccount(accounts[0]); await icsBoot(accounts[0]); return; }
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
    showLoginErr(e.message);
  }
})();

document.getElementById("btn-login").onclick = async () => {
  try {
    if (window !== window.top) { window.open(window.location.href, "_blank"); return; }
    await msalApp.loginRedirect({ scopes: MSAL_SCOPES });
  } catch (e) { showLoginErr(e.message); }
};
</script>
