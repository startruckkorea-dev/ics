// loadIcsConfig()가 채워 넣는다. 이름·이메일 등 개인정보를 git 저장소에 하드코딩하지 않기 위해 여기서는 항상 빈 배열로 시작한다.
let INITIAL_USERS = [];

function pName(koreanName, lang, users = INITIAL_USERS) {
  const u = users.find((x) => x.name === koreanName);
  if (!u) return koreanName;
  return lang === "en" ? u.nameEn : u.name;
}
function personByEmail(email, lang, users = INITIAL_USERS) {
  // 담당자/검토자는 항상 이메일 그대로 표시 (일부만 system_config에 등록되어 이름/이메일이 뒤섞여 보이는 문제 방지)
  return email || "-";
}

function uid(prefix = "c") {
  return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;
}
function deptName(id, lang, departments = INITIAL_DEPARTMENTS) {
  const d = departments.find((x) => x.id === id);
  return d ? d[lang] : id;
}
function catName(id, lang) {
  const c = CATEGORIES.find((x) => x.id === id);
  return c ? c[lang] : id;
}
function freqLabel(id, lang) {
  const f = FREQUENCY_OPTIONS.find((x) => x.id === id);
  return f ? f[lang] : id;
}
function importanceLabel(id, lang) {
  const im = IMPORTANCE_OPTIONS.find((x) => x.id === id);
  return im ? im[lang] : id;
}
function cName(c, lang) {
  return lang === "en" ? c.nameEn || c.name : c.name;
}
function cDesc(c, lang) {
  return lang === "en" ? c.descEn || c.desc : c.desc;
}

/* 사용자별 접근 가능 부서(권한) 계산 - 이메일 기준 */
function computeInitialPermissions(initialControls, users = INITIAL_USERS, departments = INITIAL_DEPARTMENTS) {
  const perm = {};
  users.forEach((u) => {
    if (u.role === "accessor") {
      perm[u.email] = { depts: u.dept ? [u.dept] : [], role: u.role };
    } else if (u.role === "reviewer") {
      const depts = Array.from(
        new Set(initialControls.filter((c) => c.reviewer === u.email).map((c) => c.dept))
      );
      perm[u.email] = { depts, role: u.role };
    } else {
      perm[u.email] = { depts: departments.map((d) => d.id), role: u.role };
    }
  });
  return perm;
}
function getAllowedDepts(user, permissions, departments = INITIAL_DEPARTMENTS) {
  if (user.role === "admin") return departments.map((d) => d.id);
  return permissions[user.email]?.depts || (user.dept ? [user.dept] : []);
}

function finalRisk(control) {
  if (control.status === "completed") return control.reviewRisk;
  if (control.selfRisk) return control.selfRisk;
  return "none";
}

function buildArchiveYearControls(sourceControls, sourceYear, newYear) {
  return sourceControls
    .filter((c) => c.year === sourceYear)
    .map((c) => ({
      ...c,
      id: uid(),
      year: newYear,
      status: "not_started",
      selfRisk: null,
      selfComment: "",
      selfCommentEn: "",
      selfDate: null,
      reviewRisk: null,
      reviewComment: "",
      reviewCommentEn: "",
      reviewDate: null,
      actualSample: null,
      attachments: [],
      history: [],
      fsaStatus: "not_started",
      fsaRisk: null,
      fsaComment: "",
      fsaCommentEn: "",
      fsaDate: null,
      fsaReviewRisk: null,
      fsaReviewComment: "",
      fsaReviewCommentEn: "",
      fsaReviewDate: null,
      pendingEdit: null,
    }));
}

function makeT(lang) {
  return function t(path) {
    const parts = path.split(".");
    let node = STR[lang];
    for (const p of parts) node = node?.[p];
    return node ?? path;
  };
}

function ResetConfirmModal({ title, description, resetPassword, onConfirm, onClose }) {
  const { t } = useLang();
  const [input, setInput] = useState("");
  const [error, setError] = useState("");

  function submit() {
    if (input !== resetPassword) {
      setError(t("resetData.wrongPassword"));
      return;
    }
    onConfirm();
  }

  return (
    <Modal title={title} onClose={onClose}>
      <p className="text-sm text-slate-600 mb-4">{description}</p>

        <input

          className={inputCls}

          onChange={(e) => {

            setError("");

          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder={t("resetData.passwordPlaceholder")}
        />

      {error && <p className="text-xs text-red-600 mb-3">{error}</p>}

          {t("resetData.confirmDeleteBtn")}
        </button>
      </div>
    </Modal>
  );
}

function Dashboard({ controls: allControls, goTo, isAdmin, allowedDepts }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const visibleDepts = isAdmin ? departments : departments.filter((d) => allowedDepts.includes(d.id));
  const controls = isAdmin ? allControls : allControls.filter((c) => allowedDepts.includes(c.dept));

  const stats = useMemo(() => {
    const counts = { green: 0, orange: 0, red: 0, none: 0 };
    controls.forEach((c) => (counts[finalRisk(c)] += 1));
    const total = controls.length;
    const doneCount = controls.filter((c) => c.status === "completed").length;
    return { counts, total, completion: total ? Math.round((doneCount / total) * 100) : 0 };
  }, [controls]);

  const barData = visibleDepts.map((d) => {
    const items = controls.filter((c) => c.dept === d.id);
    const row = { name: d[lang], green: 0, orange: 0, red: 0, none: 0 };
    items.forEach((c) => (row[finalRisk(c)] += 1));
    return row;
  });

  const matrix = visibleDepts.map((d) => ({
    dept: d,
    cells: CATEGORIES.map((cat) => {
      const items = controls.filter((c) => c.dept === d.id && c.cat === cat.id);
      if (items.length === 0) return { cat, risk: null, count: 0 };
      const risks = items.map(finalRisk);
      let worst = "green";
      if (risks.includes("red")) worst = "red";
      else if (risks.includes("orange")) worst = "orange";
      else if (risks.every((r) => r === "none")) worst = "none";
      return { cat, risk: worst, count: items.length };
    }),
  }));

  const recent = [...controls]
    .filter((c) => c.selfDate || c.reviewDate)
    .sort((a, b) => new Date(b.reviewDate || b.selfDate) - new Date(a.reviewDate || a.selfDate))
    .slice(0, 6);

  return (
    <div>
      <SectionHeader
        icon={LayoutDashboard}
        title={t("dashboard.title")}
        subtitle={isAdmin ? t("dashboard.subtitleAdmin") : `${t("dashboard.subtitleScoped")} (${visibleDepts.map((d) => d[lang]).join(", ") || t("dashboard.noAssigned")})`}
      />

      <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        <div className="relative bg-white rounded-xl border border-slate-100 p-4 overflow-hidden">
          <div className="absolute top-0 left-0 right-0 h-1" style={{ backgroundColor: BRAND.navy }} />
          <div className="flex items-center justify-between mb-1.5">
            <p className="text-xs text-slate-500">{t("dashboard.kpiTotal")}</p>
            <ClipboardList size={14} className="text-slate-300" />
          </div>
          <p className="text-2xl font-bold text-slate-800">{stats.total}</p>
        </div>
        <div className="relative bg-white rounded-xl border border-slate-100 p-4 overflow-hidden">
          <div className="absolute top-0 left-0 right-0 h-1" style={{ backgroundColor: BRAND.accent }} />
          <div className="flex items-center justify-between mb-1.5">
            <p className="text-xs text-slate-500">{t("dashboard.kpiCompletion")}</p>
            <CheckCircle2 size={14} className="text-slate-300" />
          </div>
          <p className="text-2xl font-bold" style={{ color: BRAND.accent }}>{stats.completion}%</p>
        </div>
        {["green", "orange", "red"].map((r) => (
          <button
            key={r}
            onClick={() => goTo("list", { risk: r })}
            className="relative text-left rounded-xl border p-4 overflow-hidden transition-transform hover:-translate-y-0.5"
            style={{ backgroundColor: RISK_META[r].bg, borderColor: RISK_META[r].color + "33" }}
          >
            <div className="absolute top-0 left-0 right-0 h-1" style={{ backgroundColor: RISK_META[r].color }} />
            <p className="text-xs mb-1.5 flex items-center gap-1.5 font-medium" style={{ color: RISK_META[r].text }}>
              <RiskDot risk={r} size={8} /> {RISK_META[r][lang]}
            </p>
            <p className="text-2xl font-bold" style={{ color: RISK_META[r].color }}>{stats.counts[r]}</p>
          </button>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5 mb-6">
        <div className="lg:col-span-3 bg-white rounded-xl border border-slate-100 p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-semibold text-slate-700">{t("dashboard.matrixTitle")}</h3>
            <div className="flex items-center gap-3 text-xs text-slate-500">
              {["green", "orange", "red"].map((r) => (
                <span key={r} className="flex items-center gap-1">
                  <RiskDot risk={r} size={8} /> {RISK_META[r][lang]}
                </span>
              ))}
            </div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr>
                  <th className="text-left text-slate-400 font-medium pb-2 pr-2 w-20">{t("list.colDept")}</th>
                  {CATEGORIES.map((cat) => (
                    <th key={cat.id} className="text-center text-slate-400 font-medium pb-2 px-1">{cat[lang]}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {matrix.map((row) => (
                  <tr key={row.dept.id} className="border-t border-slate-50">
                    <td className="py-2.5 pr-2 font-medium text-slate-600 whitespace-nowrap">{row.dept[lang]}</td>
                    {row.cells.map((cell, i) => (
                      <td key={i} className="text-center py-2.5 px-1">
                        {cell.count > 0 ? (
                          <button
                            title={`${row.dept[lang]} · ${cell.cat[lang]} (${cell.count}${t("common.items")})`}
                            onClick={() => goTo("list", { dept: row.dept.id, cat: cell.cat.id })}
                            className="min-w-[38px] h-8 px-1.5 rounded-lg inline-flex items-center justify-center gap-1 hover:opacity-75 transition-opacity font-semibold"
                            style={{ backgroundColor: RISK_META[cell.risk].bg, color: RISK_META[cell.risk].text }}
                          >
                            <RiskDot risk={cell.risk} size={7} />
                            {cell.count}
                          </button>
                        ) : (
                          <span className="text-slate-200">–</span>
                        )}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="lg:col-span-2 bg-white rounded-xl border border-slate-100 p-5">
          <h3 className="text-sm font-semibold text-slate-700 mb-4">{t("dashboard.chartTitle")}</h3>
          <ResponsiveContainer width="100%" height={230}>
            <BarChart data={barData} layout="vertical" margin={{ left: 10 }} barSize={18}>
              <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#F1F3F5" />
              <XAxis type="number" allowDecimals={false} tick={{ fontSize: 11, fill: "#94A3B8" }} />
              <YAxis type="category" dataKey="name" width={56} tick={{ fontSize: 11, fill: "#64748B" }} />
              <Tooltip />
              <Bar dataKey="green" stackId="a" fill={RISK_META.green.color} radius={[0, 0, 0, 0]} />
              <Bar dataKey="orange" stackId="a" fill={RISK_META.orange.color} />
              <Bar dataKey="red" stackId="a" fill={RISK_META.red.color} />
              <Bar dataKey="none" stackId="a" fill={RISK_META.none.color} radius={[0, 4, 4, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-100 p-5">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("dashboard.recentTitle")}</h3>
        {recent.length > 0 ? (
          <div className="divide-y divide-slate-50">
            {recent.map((c) => {
              const risk = finalRisk(c);
              return (
                <div key={c.id} className="py-3 flex items-center justify-between text-sm gap-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <span className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style={{ backgroundColor: RISK_META[risk].bg }}>
                      <RiskDot risk={risk} size={9} />
                    </span>
                    <div className="min-w-0">
                      <p className="text-slate-700 font-medium truncate">{cName(c, lang)}</p>
                      <p className="text-slate-400 text-xs truncate">{deptName(c.dept, lang, departments)} · {c.code}</p>
                    </div>
                  </div>
                  <span className="text-xs text-slate-400 flex-shrink-0">{c.reviewDate || c.selfDate}</span>
                </div>
              );
            })}
          </div>
        ) : (
          <EmptyState text={lang === "en" ? "No recent activity yet." : "최근 평가 활동이 없습니다."} />
        )}
      </div>
    </div>
  );
}

const MAX_LEARN_VIDEOS = 2;

function LearnPage({ currentUser, learnContent, setLearnContent, learnVideos, setLearnVideos, learnImages, setLearnImages }) {
  const { lang, t } = useLang();
  const isAdmin = currentUser.role === "admin";
  const videoInputRef = useRef(null);
  const imageInputRef = useRef(null);

  const [editing, setEditing] = useState(false);
  const [draftIntro, setDraftIntro] = useState("");
  const [draftTips, setDraftTips] = useState([]);
  const [previewImage, setPreviewImage] = useState(null);
  const [zoom, setZoom] = useState(1);

  const content = learnContent[lang];

  function startEdit() {
    setDraftIntro(content.intro);
    setDraftTips([...content.tips]);
    setEditing(true);
  }
  function saveEdit() {
    setLearnContent((prev) => ({ ...prev, [lang]: { intro: draftIntro, tips: draftTips.filter((x) => x.trim() !== "") } }));
    setEditing(false);
  }
  function updateTip(i, value) {
    setDraftTips((prev) => prev.map((x, idx) => (idx === i ? value : x)));
  }
  function removeTip(i) {
    setDraftTips((prev) => prev.filter((_, idx) => idx !== i));
  }
  function addTip() {
    setDraftTips((prev) => [...prev, ""]);
  }

  function handleVideoUpload(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setLearnVideos((prev) => {
      const room = Math.max(0, MAX_LEARN_VIDEOS - prev.length);
      const toAdd = files.slice(0, room).map((file) => ({ id: uid("video"), url: URL.createObjectURL(file), name: file.name }));
      return [...prev, ...toAdd];
    });
    e.target.value = "";
  }
  function removeVideo(videoId) {
    setLearnVideos((prev) => {
      const target = prev.find((v) => v.id === videoId);
      if (target?.url) URL.revokeObjectURL(target.url);
      return prev.filter((v) => v.id !== videoId);
    });
  }

  function handleImageUpload(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setLearnImages((prev) => [...prev, ...files.map((file) => ({ id: uid("image"), url: URL.createObjectURL(file), name: file.name }))]);
    e.target.value = "";
  }
  function removeImage(imageId) {
    setLearnImages((prev) => {
      const target = prev.find((v) => v.id === imageId);
      if (target?.url) URL.revokeObjectURL(target.url);
      return prev.filter((v) => v.id !== imageId);
    });
  }

  return (
    <div>
      <SectionHeader
        icon={GraduationCap}
        title={t("learn.title")}
        subtitle={t("learn.subtitle")}
        action={
          isAdmin &&
          !editing && (
            <button onClick={startEdit} className="flex items-center gap-1.5 text-sm font-medium px-4 py-2 rounded-lg border border-slate-200 text-slate-600 hover:border-teal-400 hover:text-teal-600">
              <Pencil size={15} /> {t("learn.editBtn")}
            </button>
          )
        }
      />

      <div className="bg-white rounded-xl border border-slate-100 p-5 mb-5">
        <h3 className="text-sm font-semibold text-slate-700 mb-2">{t("learn.introTitle")}</h3>

        {editing ? (
          <div>
            <p className="text-xs font-medium text-slate-500 mb-1.5">{t("learn.introLabel")}</p>
            <textarea className={inputCls} rows={5} value={draftIntro} onChange={(e) => setDraftIntro(e.target.value)} />

function ControlList({ controls: allControls, filter, setFilter, isAdmin, allowedDepts }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [detail, setDetail] = useState(null);
  const [search, setSearch] = useState("");

  const scoped = isAdmin ? allControls : allControls.filter((c) => allowedDepts.includes(c.dept));
  const visibleDeptOptions = isAdmin ? departments : departments.filter((d) => allowedDepts.includes(d.id));

  const filtered = scoped.filter((c) => {
    if (filter.dept && c.dept !== filter.dept) return false;
    if (filter.cat && c.cat !== filter.cat) return false;
    if (filter.risk && finalRisk(c) !== filter.risk) return false;
    if (filter.status && c.status !== filter.status) return false;
    if (search && !(cName(c, lang).includes(search) || c.code.includes(search))) return false;
    return true;
  });

  return (
    <div>
      <SectionHeader
        icon={Building2}
        title={t("list.title")}
        subtitle={isAdmin ? t("list.subtitleAdmin") : `${t("list.subtitleScoped")} (${visibleDeptOptions.map((d) => d[lang]).join(", ") || t("dashboard.noAssigned")})`}
      />

      <div className="bg-white rounded-xl border border-slate-100 p-4 mb-4 flex flex-wrap items-center gap-3">
        <div className="relative flex-1 min-w-[180px]">
          <Search size={15} className="absolute left-3 top-2.5 text-slate-400" />
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder={t("list.searchPlaceholder")} className={`${inputCls} pl-8`} />
        </div>
        <select value={filter.dept} onChange={(e) => setFilter({ ...filter, dept: e.target.value })} className={`${inputCls} w-auto`}>
          <option value="">{isAdmin ? t("common.allDept") : t("common.assignedDeptAll")}</option>
          {visibleDeptOptions.map((d) => <option key={d.id} value={d.id}>{d[lang]}</option>)}
        </select>
        <select value={filter.cat} onChange={(e) => setFilter({ ...filter, cat: e.target.value })} className={`${inputCls} w-auto`}>
          <option value="">{t("common.allCategory")}</option>
          {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c[lang]}</option>)}
        </select>
        <select value={filter.risk} onChange={(e) => setFilter({ ...filter, risk: e.target.value })} className={`${inputCls} w-auto`}>
          <option value="">{t("common.allRisk")}</option>
          {["green", "orange", "red", "none"].map((r) => <option key={r} value={r}>{RISK_META[r][lang]}</option>)}
        </select>
        {(filter.dept || filter.cat || filter.risk || filter.status) && (
          <button onClick={() => setFilter({ dept: "", cat: "", risk: "", status: "" })} className="text-xs text-slate-500 hover:text-slate-700 flex items-center gap-1">
            <X size={13} /> {t("common.resetFilter")}
          </button>
        )}
        <span className="text-xs text-slate-400 ml-auto">{filtered.length}{t("common.items")}</span>
      </div>

      <div className="bg-white rounded-xl border border-slate-100 overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
            <tr>
              <th className="text-left font-semibold px-4 py-3">{t("list.colCode")}</th>
              <th className="text-left font-semibold px-4 py-3">{t("list.colName")}</th>
              <th className="text-left font-semibold px-4 py-3">{t("list.colDept")}</th>
              <th className="text-left font-semibold px-4 py-3">{t("list.colCat")}</th>
              <th className="text-left font-semibold px-4 py-3">{t("list.colAccessor")}</th>
              <th className="text-left font-semibold px-4 py-3">{t("list.colReviewer")}</th>
              <th className="text-left font-semibold px-4 py-3">{t("list.colStatus")}</th>
              <th className="text-left font-semibold px-4 py-3">{t("list.colRisk")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {filtered.map((c, i) => {
              const risk = finalRisk(c);
              return (
                <tr key={c.id} onClick={() => setDetail(c)} className={`cursor-pointer transition-colors hover:bg-slate-100/70 ${i % 2 === 1 ? "bg-slate-50/50" : ""}`}>
                  <td className="pl-3 pr-4 py-3 text-slate-500 text-xs font-mono whitespace-nowrap" style={{ boxShadow: `inset 3px 0 0 ${RISK_META[risk].color}` }}>{c.code}</td>
                  <td className="px-4 py-3 text-slate-700 font-medium">{cName(c, lang)}</td>
                  <td className="px-4 py-3 text-slate-600">{deptName(c.dept, lang, departments)}</td>
                  <td className="px-4 py-3 text-slate-600">{catName(c.cat, lang)}</td>
                  <td className="px-4 py-3 text-slate-600">{personByEmail(c.accessor, lang, users)}</td>
                  <td className="px-4 py-3 text-slate-600">{personByEmail(c.reviewer, lang, users)}</td>
                  <td className="px-4 py-3"><StatusBadge status={c.status} /></td>
                  <td className="px-4 py-3"><RiskBadge risk={risk} /></td>
                </tr>
              );
            })}
            {filtered.length === 0 && (
              <tr><td colSpan={8}><EmptyState text={t("list.emptyText")} /></td></tr>
            )}
          </tbody>
        </table>
      </div>

      {detail && (
        <Modal title={`${detail.code} · ${cName(detail, lang)}`} onClose={() => setDetail(null)} wide>
          <ControlDetailBody control={detail} />
        </Modal>
      )}
    </div>
  );
}

function emptyControlForm(defaultDept, departments = INITIAL_DEPARTMENTS) {
  return {
    code: "", dept: defaultDept || departments[0]?.id || "", cat: CATEGORIES[0].id,
    name: "", desc: "", accessor: "", reviewer: "",
    frequency: FREQUENCY_OPTIONS[2].id, importance: IMPORTANCE_OPTIONS[1].id,
  };
}

/* 엑셀 업로드 시 셀 값(코드 또는 한글/영문 라벨)을 실제 옵션으로 매칭하는 헬퍼들 */
function matchOption(raw, options) {
  const v = String(raw || "").trim();
  if (!v) return null;
  const lower = v.toLowerCase();
  return (
    options.find((o) => o.id.toLowerCase() === lower) ||
    options.find((o) => o.ko === v) ||
    options.find((o) => (o.en || "").toLowerCase() === lower) ||
    null
  );
}
function findDeptByLabel(raw, departments) {
  return matchOption(raw, departments);
}
function findCatByLabel(raw) {
  return matchOption(raw, CATEGORIES);
}
function findFreqByLabel(raw) {
  return matchOption(raw, FREQUENCY_OPTIONS);
}
function findImportanceByLabel(raw) {
  return matchOption(raw, IMPORTANCE_OPTIONS);
}
// 엑셀 업로드 시 "1차담당자"/"2차검토자" 셀 값(이름)을 실제 등록된 사용자 이메일로 변환한다.
// 이메일 형식으로 직접 입력된 경우는 그대로 사용하고, 그렇지 않으면 이름(한글/영문)으로 사용자 목록에서 찾는다.
function resolvePersonEmail(raw, users) {
  const v = String(raw || "").trim();
  if (!v) return "";
  if (v.includes("@")) return v;
  const u = users.find((x) => x.name === v || x.nameEn === v);
  return u ? u.email : "";
}

function ControlManage({ controls: allControls, setControls, canEdit, addLog, isAdmin, allowedDepts, currentUser, isArchived, year, resetPassword, showToast }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [form, setForm] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [deptFilter, setDeptFilter] = useState("");
  const [uploadResult, setUploadResult] = useState(null);
  const fileInputRef = useRef(null);

  const visibleDeptOptions = isAdmin ? departments : departments.filter((d) => allowedDepts.includes(d.id));
  const scoped = isAdmin ? allControls : allControls.filter((c) => allowedDepts.includes(c.dept));
  const list = deptFilter ? scoped.filter((c) => c.dept === deptFilter) : scoped;

  function downloadTemplate() {
    const sampleAccessor = users.find((u) => u.role === "accessor");
    const sampleReviewer = users.find((u) => u.role === "reviewer");
    const sample = [
      {
        "코드": "EX-CA-01",
        "부서": departments[0]?.ko || "",
        "COSO영역": "CA",
        "통제명": "예시 통제명",
        "통제명(영문)": "Example control name",
        "설명": "통제 설명을 입력하세요.",
        "설명(영문)": "Enter the control description.",
        "1차담당자": sampleAccessor?.name || "홍길동",
        "2차검토자": sampleReviewer?.name || "김철수",
        "점검빈도": FREQUENCY_OPTIONS[2].ko,
        "중요도": IMPORTANCE_OPTIONS[1].ko,
      },
    ];
    const ws = XLSX.utils.json_to_sheet(sample);
    ws["!cols"] = Object.keys(sample[0]).map(() => ({ wch: 22 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "업로드 양식");
    XLSX.writeFile(wb, "internal_control_upload_template.xlsx");
  }

  function handleUploadFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        let added = 0;
        let updated = 0;
        let skipped = 0;
        setControls((prev) => {
          let next = [...prev];
          rows.forEach((row) => {
            const code = String(row["코드"] || "").trim();
            const name = String(row["통제명"] || "").trim();
            const dept = findDeptByLabel(row["부서"], departments);
            const cat = findCatByLabel(row["COSO영역"]);
            const frequency = findFreqByLabel(row["점검빈도"]);
            const importance = findImportanceByLabel(row["중요도"]);
            const accessor = resolvePersonEmail(row["1차담당자"], users);
            const reviewer = resolvePersonEmail(row["2차검토자"], users);
            if (!code || !name || !dept || !cat || !frequency || !importance || !accessor || !reviewer) {
              skipped++;
              return;
            }
            const payload = {
              code,
              dept: dept.id,
              cat: cat.id,
              name,
              nameEn: String(row["통제명(영문)"] || "").trim() || name,
              desc: String(row["설명"] || "").trim(),
              descEn: String(row["설명(영문)"] || "").trim(),
              accessor,
              reviewer,
              frequency: frequency.id,
              importance: importance.id,
              sampleSize: recommendedSample(importance.id, frequency.id),
            };
            const existingIdx = next.findIndex((c) => c.year === year && c.code === code);
            if (existingIdx >= 0) {
              next[existingIdx] = { ...next[existingIdx], ...payload };
              updated++;
            } else {
              next = [
                {
                  id: uid(),
                  ...payload,
                  year,
                  status: "not_started",
                  selfRisk: null, selfComment: "", selfCommentEn: "", selfDate: null,
                  reviewRisk: null, reviewComment: "", reviewCommentEn: "", reviewDate: null,
                  history: [], actualSample: null, attachments: [],
                  fsaStatus: "not_started", fsaRisk: null, fsaComment: "", fsaCommentEn: "", fsaDate: null, fsaReviewRisk: null, fsaReviewComment: "", fsaReviewCommentEn: "", fsaReviewDate: null, pendingEdit: null,
                },
                ...next,
              ];
              added++;
            }
          });
          return next;
        });
        addLog(
          currentUser.email,
          "bulk_upload",
          "-",
          `신규 ${added}건 · 수정 ${updated}건 · 오류 ${skipped}건`,
          `${added} added · ${updated} updated · ${skipped} skipped`
        );
        setUploadResult({ added, updated, skipped });
      } catch (err) {
        setUploadResult({ error: true });
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

  function openAdd() {
    setForm(emptyControlForm(isAdmin ? undefined : allowedDepts[0], departments));
    setEditingId(null);
  }
  function openEdit(c) {
    const src = c.pendingEdit || c;
    setForm({ code: src.code, dept: src.dept, cat: src.cat, name: src.name, desc: src.desc, accessor: src.accessor, reviewer: src.reviewer, frequency: src.frequency, importance: src.importance });
    setEditingId(c.id);
  }
  function save() {
    if (!form.code.trim() || !form.name.trim()) return;
    if (editingId) {
      if (isAdmin) {
        setControls((prev) => prev.map((c) => (c.id === editingId ? { ...c, ...form, sampleSize: recommendedSample(form.importance, form.frequency), pendingEdit: null } : c)));
        addLog(currentUser.email, "edit_control", form.code, form.name, form.name);
      } else {
        // Accessor의 수정은 즉시 반영되지 않고, 검토자(또는 관리자)의 승인을 받은 뒤 반영된다.
        const today = new Date().toISOString().slice(0, 10);
        setControls((prev) =>
          prev.map((c) => (c.id === editingId ? { ...c, pendingEdit: { ...form, requestedBy: currentUser.email, requestedAt: today } } : c))
        );
        addLog(currentUser.email, "edit_request", form.code, form.name, form.name);
      }
    } else {
      const newControl = {
        id: uid(), ...form, status: "not_started", year,
        selfRisk: null, selfComment: "", selfCommentEn: "", selfDate: null,
        reviewRisk: null, reviewComment: "", reviewCommentEn: "", reviewDate: null, history: [],
        sampleSize: recommendedSample(form.importance, form.frequency), actualSample: null, attachments: [],
        fsaStatus: "not_started", fsaRisk: null, fsaComment: "", fsaCommentEn: "", fsaDate: null, fsaReviewRisk: null, fsaReviewComment: "", fsaReviewCommentEn: "", fsaReviewDate: null, pendingEdit: null,
      };
      setControls((prev) => [newControl, ...prev]);
      addLog(currentUser.email, "add_control", form.code, form.name, form.name);
    }
    setForm(null);
    setEditingId(null);
  }
  function remove(c) {
    setControls((prev) => prev.filter((x) => x.id !== c.id));
    addLog(currentUser.email, "delete_control", c.code, c.name, c.nameEn);
    setConfirmDelete(null);
  }

  return (
    <div>
      <SectionHeader
        icon={ClipboardEdit}
        title={t("manage.title")}
        subtitle={isAdmin ? t("manage.subtitleAdmin") : `${t("manage.subtitleScoped")} (${visibleDeptOptions.map((d) => d[lang]).join(", ") || t("dashboard.noAssigned")})`}
        action={
          <div className="flex items-center gap-2">
            {isAdmin && (
              <>
                <button onClick={downloadTemplate} className="flex items-center gap-1.5 text-xs font-medium px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:border-teal-400 hover:text-teal-600">
                  <Download size={14} /> {t("manage.uploadTemplateBtn")}
                </button>
                <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-1.5 text-xs font-medium px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:border-teal-400 hover:text-teal-600">
                  <UploadCloud size={14} /> {t("manage.uploadBtn")}
                </button>
                <input ref={fileInputRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleUploadFile} />
              </>
            )}
            {canEdit && (
              <button onClick={openAdd} className="flex items-center gap-1.5 text-white text-sm font-medium px-4 py-2 rounded-lg" style={{ backgroundColor: BRAND.accent }}>
                <Plus size={16} /> {t("manage.addBtn")}
              </button>
            )}
          </div>
        }
      />

      {!canEdit && (
        <div className="bg-amber-50 text-amber-700 text-sm px-4 py-3 rounded-lg mb-4 flex items-center gap-2">
          <AlertTriangle size={16} /> {t("manage.readonlyNotice")}
        </div>
      )}

      {isAdmin && (
        <div className="bg-slate-50 text-slate-500 text-xs px-4 py-3 rounded-lg mb-4 flex items-center gap-2">
          <UploadCloud size={14} className="flex-shrink-0" /> {t("manage.uploadNameHint")}
        </div>
      )}

      {canEdit && !isAdmin && (
        <div className="bg-slate-50 text-slate-500 text-xs px-4 py-3 rounded-lg mb-4 flex items-center gap-2">
          <Clock size={14} className="flex-shrink-0" /> {t("manage.pendingNotice")}
        </div>
      )}

      {uploadResult && (
        <div
          className="text-sm px-4 py-3 rounded-lg mb-4 flex items-start justify-between gap-3"
          style={uploadResult.error ? { backgroundColor: "#FEE2E2", color: "#B91C1C" } : { backgroundColor: "#E4F1F0", color: BRAND.accent }}
        >
          {uploadResult.error ? (
            <span>{t("manage.uploadError")}</span>
          ) : (
            <span>
              {t("manage.uploadSummaryTitle")}: {t("manage.uploadSummaryNew")} {uploadResult.added}{t("common.items")} · {t("manage.uploadSummaryUpdated")} {uploadResult.updated}
              {t("common.items")}
              {uploadResult.skipped > 0 && ` · ${t("manage.uploadSummarySkipped")} ${uploadResult.skipped}${t("common.items")}`}
            </span>
          )}
          <button onClick={() => setUploadResult(null)} className="flex-shrink-0 opacity-60 hover:opacity-100"><X size={14} /></button>
        </div>
      )}

      <div className="mb-4">
        <select value={deptFilter} onChange={(e) => setDeptFilter(e.target.value)} className={`${inputCls} w-auto`}>
          <option value="">{isAdmin ? t("common.allDept") : t("common.assignedDeptAll")}</option>
          {visibleDeptOptions.map((d) => <option key={d.id} value={d.id}>{d[lang]}</option>)}
        </select>
      </div>

      <div className="bg-white rounded-xl border border-slate-100 overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="text-left font-medium px-4 py-3">{t("list.colCode")}</th>
              <th className="text-left font-medium px-4 py-3">{t("list.colName")}</th>
              <th className="text-left font-medium px-4 py-3">{t("list.colDept")}</th>
              <th className="text-left font-medium px-4 py-3">{t("list.colCat")}</th>
              <th className="text-left font-medium px-4 py-3">{t("list.colAccessor")}</th>
              <th className="text-left font-medium px-4 py-3">{t("list.colReviewer")}</th>
              <th className="text-left font-medium px-4 py-3">{t("manage.colSample")}</th>
              {canEdit && <th className="text-right font-medium px-4 py-3"> </th>}
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {list.map((c) => (
              <tr key={c.id} className={"hover:bg-slate-50" + (c.pendingEdit ? " bg-amber-50/60" : "")}>
                <td className="px-4 py-3 text-slate-500 text-xs font-mono whitespace-nowrap">{c.code}</td>
                <td className="px-4 py-3 text-slate-700 font-medium">
                  {cName(c, lang)}
                  {c.pendingEdit && (
                    <span className="ml-2 inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full" style={{ backgroundColor: "#FBEDDC", color: "#8A5A0C" }}>
                      <Clock size={11} /> {t("manage.pendingBadge")}
                    </span>
                  )}
                </td>
                <td className="px-4 py-3 text-slate-600">{deptName(c.dept, lang, departments)}</td>
                <td className="px-4 py-3 text-slate-600">{catName(c.cat, lang)}</td>
                <td className="px-4 py-3 text-slate-600">{personByEmail(c.accessor, lang, users)}</td>
                <td className="px-4 py-3 text-slate-600">{personByEmail(c.reviewer, lang, users)}</td>
                <td className="px-4 py-3 text-slate-600 text-xs">{freqLabel(c.frequency, lang)} · {importanceLabel(c.importance, lang)} · {c.sampleSize}{t("common.items")}</td>
                {canEdit && (
                  <td className="px-4 py-3">
                    <div className="flex items-center justify-end gap-2">
                      <button onClick={() => openEdit(c)} className="text-slate-400 hover:text-teal-600"><Pencil size={15} /></button>
                      <button onClick={() => setConfirmDelete(c)} className="text-slate-400 hover:text-red-500"><Trash2 size={15} /></button>
                    </div>
                  </td>
                )}
              </tr>
            ))}
            {list.length === 0 && <tr><td colSpan={8}><EmptyState text={t("manage.emptyText")} /></td></tr>}
          </tbody>
        </table>
      </div>

      {form && (
        <Modal title={editingId ? t("manage.modalEditTitle") : t("manage.modalAddTitle")} onClose={() => setForm(null)}>
          <Field label={t("manage.fieldCode")}>
            <input className={inputCls} value={form.code} onChange={(e) => setForm({ ...form, code: e.target.value })} placeholder={t("manage.codePlaceholder")} />
          </Field>
          <Field label={t("manage.fieldName")}>
            <input className={inputCls} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder={t("manage.namePlaceholder")} />
          </Field>
          <Field label={t("manage.fieldDesc")}>
            <textarea className={inputCls} rows={3} value={form.desc} onChange={(e) => setForm({ ...form, desc: e.target.value })} placeholder={t("manage.descPlaceholder")} />
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label={t("manage.fieldDept")}>
              <select className={inputCls} value={form.dept} onChange={(e) => setForm({ ...form, dept: e.target.value })}>
                {(isAdmin ? departments : visibleDeptOptions).map((d) => <option key={d.id} value={d.id}>{d[lang]}</option>)}
              </select>
            </Field>
            <Field label={t("manage.fieldCat")}>
              <select className={inputCls} value={form.cat} onChange={(e) => setForm({ ...form, cat: e.target.value })}>
                {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c[lang]}</option>)}
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label={t("manage.fieldAccessor")}>
              <input type="email" className={inputCls} value={form.accessor} onChange={(e) => setForm({ ...form, accessor: e.target.value })} placeholder={t("manage.emailPlaceholder")} />
            </Field>
            <Field label={t("manage.fieldReviewer")}>
              <input type="email" className={inputCls} value={form.reviewer} onChange={(e) => setForm({ ...form, reviewer: e.target.value })} placeholder={t("manage.emailPlaceholder")} />
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label={t("manage.fieldFreq")}>
              <select className={inputCls} value={form.frequency} onChange={(e) => setForm({ ...form, frequency: e.target.value })}>
                {FREQUENCY_OPTIONS.map((f) => <option key={f.id} value={f.id}>{f[lang]}</option>)}
              </select>
            </Field>
            <Field label={t("manage.fieldImportance")}>
              <select className={inputCls} value={form.importance} onChange={(e) => setForm({ ...form, importance: e.target.value })}>
                {IMPORTANCE_OPTIONS.map((im) => <option key={im.id} value={im.id}>{im[lang]}</option>)}
              </select>
            </Field>
          </div>
          <p className="text-xs text-slate-400 -mt-2 mb-3">
            {t("manage.recommendedHint")} <span className="font-medium text-slate-600">{recommendedSample(form.importance, form.frequency)}{t("common.items")}</span> {t("manage.recommendedHint2")}
          </p>
          <div className="flex justify-end gap-2 mt-2">
            <button onClick={() => setForm(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
            <button onClick={save} className="px-4 py-2 text-sm text-white rounded-lg" style={{ backgroundColor: BRAND.accent }}>{t("common.save")}</button>
          </div>
        </Modal>
      )}

      {confirmDelete && (
        <Modal title={t("manage.deleteTitle")} onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-600 mb-5">
            <span className="font-medium text-slate-800">{confirmDelete.code} · {cName(confirmDelete, lang)}</span> — {t("manage.deleteBody")}
          </p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setConfirmDelete(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
            <button onClick={() => remove(confirmDelete)} className="px-4 py-2 text-sm text-white bg-red-500 rounded-lg hover:bg-red-600">{t("common.delete")}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function formatBytes(bytes) {
  if (bytes < 1024) return `${bytes}B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)}KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)}MB`;
}

function SelfAssessment({ controls, setControls, currentUser, addLog, isArchived, showToast }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "", sampleSize: 0, attachments: [] });

  const isAdmin = currentUser.role === "admin";
  const myControls = isAdmin ? controls : controls.filter((c) => c.accessor === currentUser.email);

  const todo = myControls.filter((c) => c.status === "not_started" || c.status === "returned");
  const inProgress = myControls.filter((c) => c.status === "submitted_self" || c.status === "completed");

  function startEdit(c) {
    setEditing(c.id);
    setDraft({ risk: c.selfRisk, comment: c.selfComment || "", sampleSize: c.actualSample ?? recommendedSample(c.importance, c.frequency), attachments: c.attachments || [] });
  }

  const [saving, setSaving] = useState(null);

  async function submit(c) {
    if (!draft.risk) return;
    const today = new Date().toISOString().slice(0, 10);
    setSaving(c.id);
    setEditing(null);
    try {
      // 1) 요청 항목이 아직 없으면 먼저 만들어서 SharePoint 아이템 ID를 확보 (첨부파일 업로드 폴더명으로 사용)
      let spId = c.requestSpId;
      if (!spId) {
        const created = await icsCreateItem(ICS_LISTS.requests, {
          Title: `ICS-${c.year}-${c.code}`,
          ControlId: c.code,
          Year: c.year,
          RequesterEmail: c.accessor,
          RequestDate: new Date().toISOString(),
          Status: "not_started",
        });
        spId = created.id;
        // 이후 단계(업로드/저장)가 실패하더라도 재시도 시 항목이 중복 생성되지 않도록 즉시 반영
        setControls((prev) => prev.map((x) => (x.id === c.id ? { ...x, requestSpId: spId } : x)));
      }

      // 2) 아직 업로드 안 된(webUrl 없는) 첨부만 실제 업로드, 이미 업로드된 것은 그대로 재사용
      const finalAttachments = [];
      for (const att of draft.attachments || []) {
        if (att.webUrl) {
          finalAttachments.push({ name: att.name, webUrl: att.webUrl });
        } else if (att.file) {
          const uploaded = await icsUploadAttachment(spId, att.file);
          finalAttachments.push({ name: att.file.name, webUrl: uploaded.webUrl });
        }
      }
      const attachedFilesField = finalAttachments.map((a) => `${a.name}|${a.webUrl}`).join(";");

      // 3) 평가 내용 + 첨부파일 목록을 함께 저장
      await icsUpdateItem(ICS_LISTS.requests, spId, {
        Status: "submitted_self",
        SelfRisk: draft.risk,
        SelfCommentKo: draft.comment,
        SelfCommentEn: draft.comment,
        SelfDate: new Date().toISOString(),
        SampleCount: draft.sampleSize,
        AttachedFiles: attachedFilesField,
      });

      setControls((prev) =>
        prev.map((x) =>
          x.id === c.id
            ? { ...x, requestSpId: spId, status: "submitted_self", selfRisk: draft.risk, selfComment: draft.comment, selfCommentEn: draft.comment, selfDate: today, actualSample: draft.sampleSize, attachments: finalAttachments }
            : x
        )
      );
      addLog(c.accessor, "submit_self", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Self-assessment submitted." : "자가평가가 제출됐습니다.");
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    } finally {
      setSaving(null);
    }
  }

  return (
    <div>
      <SectionHeader
        icon={ClipboardList}
        title={t("self.title")}
        subtitle={isAdmin ? t("self.subtitleAdmin") : `${pName(currentUser.name, lang, users)}${t("self.subtitleUser")}`}
      />

      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
          <AlertTriangle size={15} className="text-amber-500" /> {t("self.needsAction")} ({todo.length})
        </h3>
        {todo.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-100"><EmptyState text={t("self.noNeedsAction")} /></div>
        ) : (
          <div className="space-y-3">
            {todo.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-100 p-4">
                <div className="flex items-start justify-between gap-3 mb-1">
                  <div>
                    <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                    <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                  </div>
                  <StatusBadge status={c.status} />
                </div>
                <p className="text-sm text-slate-500 mb-3">{cDesc(c, lang)}</p>

                {c.status === "returned" && (
                  <div className="bg-red-50 rounded-lg p-3 mb-3 text-sm">
                    <p className="text-xs font-medium text-red-700 mb-1">{t("self.rejectReasonTitle")} ({personByEmail(c.reviewer, lang, users)})</p>
                    <p className="text-red-700">{lang === "en" ? c.reviewCommentEn || c.reviewComment : c.reviewComment}</p>
                  </div>
                )}

                {editing === c.id && !isArchived ? (
                  <SelfAssessForm control={c} draft={draft} setDraft={setDraft} onCancel={() => setEditing(null)} onSubmit={() => submit(c)} />
                ) : (
                  !isArchived && (
                    <button onClick={() => startEdit(c)} className="text-sm font-medium px-4 py-2 rounded-lg text-white" style={{ backgroundColor: BRAND.accent }}>
                      {t("self.writeBtn")}
                    </button>
                  )
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("self.submitted")} ({inProgress.length})</h3>
        <div className="bg-white rounded-xl border border-slate-100 divide-y divide-slate-50">
          {inProgress.map((c) => (
            <div key={c.id} className="p-4">
              <div className="flex items-start justify-between gap-3 mb-1">
                <div>
                  <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                  <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <RiskBadge risk={c.selfRisk} />
                  <StatusBadge status={c.status} />
                </div>
              </div>
              {editing === c.id && !isArchived ? (
                <SelfAssessForm control={c} draft={draft} setDraft={setDraft} onCancel={() => setEditing(null)} onSubmit={() => submit(c)} />
              ) : (
                <div>
                  <div className="flex items-center justify-between">
                    <p className="text-sm text-slate-500">{lang === "en" ? c.selfCommentEn || c.selfComment : c.selfComment}</p>
                    {c.status !== "completed" && !isArchived && (
                      <button onClick={() => startEdit(c)} className="text-xs text-slate-400 hover:text-teal-600 flex items-center gap-1 flex-shrink-0 ml-3">
                        <Pencil size={12} /> {t("self.editBtn")}
                      </button>
                    )}
                  </div>
                  <div className="flex items-center gap-3 mt-2 text-xs text-slate-400">
                    <span>{t("self.sampleCount")} {c.actualSample ?? "-"}{t("common.items")} ({t("self.recommendedShort")} {recommendedSample(c.importance, c.frequency)}{t("common.items")})</span>
                    <span className="flex items-center gap-1"><Paperclip size={11} /> {(c.attachments || []).length}</span>
                  </div>
                </div>
              )}
            </div>
          ))}
          {inProgress.length === 0 && <EmptyState text={t("self.noSubmitted")} />}
        </div>
      </div>
    </div>
  );
}

function SelfAssessForm({ control, draft, setDraft, onCancel, onSubmit }) {
  const { lang, t } = useLang();
  const fileInputRef = useRef(null);
  const recommended = recommendedSample(control.importance, control.frequency);

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    // file 원본은 실제 업로드(icsUploadAttachment) 시 필요, 이미 업로드된 기존 첨부(webUrl 있음)와 구분하는 용도
    const newAttachments = files.map((f) => ({ name: f.name, size: formatBytes(f.size), file: f }));
    setDraft({ ...draft, attachments: [...(draft.attachments || []), ...newAttachments] });
    e.target.value = "";
  }
  function removeAttachment(idx) {
    setDraft({ ...draft, attachments: draft.attachments.filter((_, i) => i !== idx) });
  }

  return (
    <div className="bg-white border border-slate-200 rounded-xl p-5 mt-3 shadow-sm">
      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2.5">{t("self.riskLevel")}</p>
      <div className="grid grid-cols-3 gap-2.5 mb-4">
        {["green", "orange", "red"].map((r) => (
          <button
            key={r}
            onClick={() => setDraft({ ...draft, risk: r })}
            className="flex flex-col items-center justify-center gap-1.5 py-3.5 rounded-xl text-sm font-semibold border-2 transition-all"
            style={{
              borderColor: draft.risk === r ? RISK_META[r].color : "#E5E9EF",
              backgroundColor: draft.risk === r ? RISK_META[r].bg : "#fff",
              color: draft.risk === r ? RISK_META[r].text : "#94A3B8",
              boxShadow: draft.risk === r ? `0 2px 8px ${RISK_META[r].color}22` : "none",
            }}
          >
            <span className="w-3 h-3 rounded-full" style={{ backgroundColor: draft.risk === r ? RISK_META[r].color : "#CBD3DD" }} />
            {RISK_META[r][lang]}
          </button>
        ))}
      </div>

      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{t("self.commentPlaceholder")}</p>
      <textarea
        className="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400 resize-none"
        rows={3}
        placeholder={t("self.commentPlaceholder")}
        value={draft.comment}
        onChange={(e) => setDraft({ ...draft, comment: e.target.value })}
      />

      <div className="mt-4 grid grid-cols-2 gap-3 items-end">
        <div>
          <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{t("self.sampleCount")}</p>
          <p className="text-[11px] text-slate-400 mb-1.5">{t("self.recommendedNote")} {recommended}{t("common.items")} · {importanceLabel(control.importance, lang)} · {freqLabel(control.frequency, lang)}</p>
          <input
            type="number"
            min={0}
            className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-teal-400"
            value={draft.sampleSize}
            onChange={(e) => setDraft({ ...draft, sampleSize: Math.max(0, Number(e.target.value)) })}
          />
        </div>
        <div>
          <button
            type="button"
            onClick={() => fileInputRef.current?.click()}
            className="w-full flex items-center justify-center gap-1.5 border-2 border-dashed rounded-xl py-[13px] text-xs font-medium transition-colors"
            style={{ borderColor: "#D8DEE6", color: "#64748B" }}
            onMouseEnter={(e) => { e.currentTarget.style.borderColor = BRAND.accent; e.currentTarget.style.color = BRAND.accent; }}
            onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#D8DEE6"; e.currentTarget.style.color = "#64748B"; }}
          >
            <UploadCloud size={15} /> {t("self.attachBtn")}
          </button>
          <input ref={fileInputRef} type="file" multiple className="hidden" onChange={handleFiles} />
        </div>
      </div>

      {(draft.attachments || []).length > 0 && (
        <ul className="mt-3 space-y-1.5">
          {draft.attachments.map((a, i) => (
            <li key={i} className="flex items-center gap-2 text-xs text-slate-600 bg-slate-50 border border-slate-100 rounded-lg px-3 py-2">
              <Paperclip size={12} className="text-slate-400 flex-shrink-0" />
              <span className="truncate">{a.name}</span>
              <span className="text-slate-400 flex-shrink-0">{a.size}</span>
              <button onClick={() => removeAttachment(i)} className="ml-auto text-slate-300 hover:text-red-500 flex-shrink-0"><X size={12} /></button>
            </li>
          ))}
        </ul>
      )}

      <div className="flex justify-end gap-2 mt-4 pt-4 border-t border-slate-100">
        <button onClick={onCancel} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
        <button onClick={onSubmit} disabled={!draft.risk} className="px-5 py-2 text-sm font-semibold text-white rounded-lg disabled:opacity-40 transition-opacity" style={{ backgroundColor: BRAND.accent }}>
          {t("self.submitBtn")}
        </button>
      </div>
    </div>
  );
}

function FSAPage({ controls, setControls, currentUser, addLog, isArchived, showToast }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "" });

  const isAdmin = currentUser.role === "admin";
  const myControls = isAdmin ? controls : controls.filter((c) => c.accessor === currentUser.email);

  const isaDone = myControls.filter((c) => c.status === "completed");
  const todo = isaDone.filter((c) => c.fsaStatus === "not_started" || c.fsaStatus === "returned" || !c.fsaStatus);
  const submitted = isaDone.filter((c) => c.fsaStatus === "submitted_self" || c.fsaStatus === "completed");
  const waitingIsa = myControls.filter((c) => c.status !== "completed").length;

  function startEdit(c) {
    setEditing(c.id);
    setDraft({ risk: c.fsaRisk, comment: c.fsaComment || "" });
  }
  function submit(c) {
    if (!draft.risk) return;
    const today = new Date().toISOString().slice(0, 10);
    setControls((prev) =>
      prev.map((x) => (x.id === c.id ? { ...x, fsaStatus: "submitted_self", fsaRisk: draft.risk, fsaComment: draft.comment, fsaCommentEn: draft.comment, fsaDate: today } : x))
    );
    addLog(c.accessor, "fsa_submit", c.code, c.name, c.nameEn);
    showToast(lang === "en" ? "Final self-assessment submitted." : "최종자기평가가 제출됐습니다.");
    setEditing(null);
  }

  return (
    <div>
      <SectionHeader
        icon={ShieldCheck}
        title={t("fsa.title")}
        subtitle={isAdmin ? t("fsa.subtitleAdmin") : `${pName(currentUser.name, lang, users)}${t("fsa.subtitleUser")}`}
      />
      <p className="text-sm text-slate-500 bg-white border border-slate-100 rounded-xl p-4 mb-6">{t("fsa.desc")}</p>

      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
          <AlertTriangle size={15} className="text-amber-500" /> {t("fsa.needsAction")} ({todo.length})
        </h3>
        {todo.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-100">
            <EmptyState text={waitingIsa > 0 ? t("fsa.waitingIsa") : t("fsa.noNeedsAction")} />
          </div>
        ) : (
          <div className="space-y-3">
            {todo.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-100 p-4">
                <div className="flex items-start justify-between gap-3 mb-1">
                  <div>
                    <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                    <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <RiskBadge risk={c.selfRisk} />
                    {c.fsaStatus === "returned" && <StatusBadge status="returned" />}
                  </div>
                </div>
                <p className="text-sm text-slate-500 mb-3">{cDesc(c, lang)}</p>
                <div className="bg-slate-50 rounded-lg p-3 mb-3 text-xs text-slate-500">
                  <p className="font-medium text-slate-600 mb-1">{t("review.selfAssessmentBy")}</p>
                  <p>{lang === "en" ? c.selfCommentEn || c.selfComment : c.selfComment}</p>
                </div>

                {c.fsaStatus === "returned" && (
                  <div className="bg-red-50 rounded-lg p-3 mb-3 text-sm">
                    <p className="text-xs font-medium text-red-700 mb-1">{t("fsa.rejectReasonTitle")} ({personByEmail(c.reviewer, lang, users)})</p>
                    <p className="text-red-700">{lang === "en" ? c.fsaReviewCommentEn || c.fsaReviewComment : c.fsaReviewComment}</p>
                  </div>
                )}

                {editing === c.id && !isArchived ? (
                  <FSAForm draft={draft} setDraft={setDraft} onCancel={() => setEditing(null)} onSubmit={() => submit(c)} />
                ) : (
                  !isArchived && (
                    <button onClick={() => startEdit(c)} className="text-sm font-medium px-4 py-2 rounded-lg text-white" style={{ backgroundColor: BRAND.accent }}>
                      {t("fsa.writeBtn")}
                    </button>
                  )
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("fsa.submitted")} ({submitted.length})</h3>
        <div className="bg-white rounded-xl border border-slate-100 divide-y divide-slate-50">
          {submitted.map((c) => (
            <div key={c.id} className="p-4">
              <div className="flex items-start justify-between gap-3 mb-1">
                <div>
                  <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code}</p>
                  <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <RiskBadge risk={c.fsaRisk} />
                  <StatusBadge status={c.fsaStatus} />
                </div>
              </div>
              {editing === c.id && !isArchived ? (
                <FSAForm draft={draft} setDraft={setDraft} onCancel={() => setEditing(null)} onSubmit={() => submit(c)} />
              ) : (
                <div>
                  <div className="flex items-center justify-between">
                    <p className="text-sm text-slate-500">{lang === "en" ? c.fsaCommentEn || c.fsaComment : c.fsaComment}</p>
                    {c.fsaStatus !== "completed" && !isArchived && (
                      <button onClick={() => startEdit(c)} className="text-xs text-slate-400 hover:text-teal-600 flex items-center gap-1 flex-shrink-0 ml-3">
                        <Pencil size={12} /> {t("fsa.editBtn")}
                      </button>
                    )}
                  </div>
                  {c.fsaStatus === "completed" && c.fsaReviewComment && (
                    <div className="bg-slate-50 rounded-lg p-2.5 mt-2 text-xs text-slate-500">
                      <span className="font-medium text-slate-600">{t("fsaReview.title")} ({personByEmail(c.reviewer, lang, users)})</span>{" "}
                      {lang === "en" ? c.fsaReviewCommentEn || c.fsaReviewComment : c.fsaReviewComment}
                    </div>
                  )}
                </div>
              )}
            </div>
          ))}
          {submitted.length === 0 && <EmptyState text={t("fsa.noSubmitted")} />}
        </div>
      </div>
    </div>
  );
}

/* FSA 2차검토 (담당자가 제출한 최종자기평가를 검토자가 승인/반려)                 */
/* ------------------------------------------------------------------ */

function FSAReviewPage({ controls, setControls, currentUser, addLog, isArchived, showToast }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ risk: null, comment: "" });
  const [returning, setReturning] = useState(null);
  const [returnComment, setReturnComment] = useState("");

  const isAdmin = currentUser.role === "admin";
  const pending = controls.filter((c) => c.fsaStatus === "submitted_self" && (isAdmin || c.reviewer === currentUser.email));
  const done = controls.filter((c) => (c.fsaStatus === "completed" || c.fsaStatus === "returned") && (isAdmin || c.reviewer === currentUser.email));

  function startEdit(c) {
    setEditing(c.id);
    setDraft({ risk: c.fsaRisk, comment: "" });
  }
  function approve(c) {
    if (!draft.risk) return;
    const today = new Date().toISOString().slice(0, 10);
    setControls((prev) =>
      prev.map((x) =>
        x.id === c.id ? { ...x, fsaStatus: "completed", fsaReviewRisk: draft.risk, fsaReviewComment: draft.comment, fsaReviewCommentEn: draft.comment, fsaReviewDate: today } : x
      )
    );
    addLog(c.reviewer, "fsa_review_complete", c.code, c.name, c.nameEn);
    showToast(lang === "en" ? "FSA review confirmed." : "FSA 검토가 완료됐습니다.");
    setEditing(null);
  }
  function reject(c) {
    const today = new Date().toISOString().slice(0, 10);
    setControls((prev) =>
      prev.map((x) =>
        x.id === c.id ? { ...x, fsaStatus: "returned", fsaReviewRisk: "red", fsaReviewComment: returnComment, fsaReviewCommentEn: returnComment, fsaReviewDate: today } : x
      )
    );
    addLog(c.reviewer, "fsa_review_reject", c.code, c.name, c.nameEn);
    showToast(lang === "en" ? "Returned to the accessor." : "담당자에게 반려됐습니다.");
    setReturning(null);
    setReturnComment("");
  }

  return (
    <div>
      <SectionHeader
        icon={CheckCircle2}
        title={t("fsaReview.title")}
        subtitle={isAdmin ? t("fsaReview.subtitleAdmin") : `${pName(currentUser.name, lang, users)}${t("fsaReview.subtitleUser")}`}
      />

      <div className="mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("fsaReview.pending")} ({pending.length})</h3>
        {pending.length === 0 ? (
          <div className="bg-white rounded-xl border border-slate-100"><EmptyState text={t("fsaReview.noPending")} /></div>
        ) : (
          <div className="space-y-3">
            {pending.map((c) => (
              <div key={c.id} className="bg-white rounded-xl border border-slate-100 p-4">
                <div className="flex items-start justify-between gap-3 mb-2">
                  <div>
                    <p className="text-xs text-slate-400 font-mono mb-0.5">{c.code} · {deptName(c.dept, lang, departments)} · {catName(c.cat, lang)}</p>
                    <p className="font-medium text-slate-800">{cName(c, lang)}</p>
                  </div>
                  <StatusBadge status={c.fsaStatus} />
                </div>
                <div className="bg-slate-50 rounded-lg p-3 mb-3">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-xs font-medium text-slate-500">{t("fsaReview.selfAssessmentBy")} ({personByEmail(c.accessor, lang, users)})</p>
                    <RiskBadge risk={c.fsaRisk} />
                  </div>
                  <p className="text-sm text-slate-600">{lang === "en" ? c.fsaCommentEn || c.fsaComment : c.fsaComment}</p>
                </div>

                {editing === c.id && !isArchived ? (
                  <div className="border border-slate-100 rounded-lg p-3">
                    <p className="text-xs font-medium text-slate-500 mb-2">{t("review.reviewResult")}</p>
                    <div className="flex gap-2 mb-3">
                      {["green", "orange", "red"].map((r) => (
                        <button
                          key={r}
                          onClick={() => setDraft({ ...draft, risk: r })}
                          className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-medium border-2"
                          style={{ borderColor: draft.risk === r ? RISK_META[r].color : "#E5E9EF", backgroundColor: draft.risk === r ? RISK_META[r].bg : "#fff", color: draft.risk === r ? RISK_META[r].text : "#94A3B8" }}
                        >
                          <RiskDot risk={r} /> {RISK_META[r][lang]}
                        </button>
                      ))}
                    </div>
                    <textarea className={inputCls} rows={2} placeholder={t("review.reviewCommentPlaceholder")} value={draft.comment} onChange={(e) => setDraft({ ...draft, comment: e.target.value })} />
                    <div className="flex justify-end gap-2 mt-3">
                      <button onClick={() => setEditing(null)} className="px-3 py-1.5 text-xs text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
