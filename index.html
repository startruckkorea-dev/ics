// 구조: { "이메일(소문자)": { icsOverview: bool, controlMgmt: bool, assessment: bool, adminOnly: bool, executive: bool } }
let ICS_CATEGORY_ACCESS = {};

// 사용자가 특정 카테고리에 접근 가능한지 판단.
// 1) ics_category_access.xlsx에 명시적으로 Y로 등록되어 있으면 항상 허용(역할과 무관하게 추가 부여).
// 2) 등록이 없으면 역할 기반 기본값을 따른다 (ICS Overview/통제 관리/평가는 전체 공개, 관리자 전용은 Admin, 경영진 전용은 Admin/CFO/RD).
function hasCategoryAccess(user, categoryKey) {
  const grant = ICS_CATEGORY_ACCESS[(user.email || "").toLowerCase()];
  // 평가 관련 4개 화면은 역할(Admin 포함)과 무관하게 ics_category_access.xlsx의 CategoryAccess 시트에
  // 명시적으로 등록된 계정만 접근 가능 (다른 카테고리처럼 기본 허용 없음).
  if (categoryKey === "self" || categoryKey === "review" || categoryKey === "fsa" || categoryKey === "fsaReview") {
    return !!(grant && grant[categoryKey]);
  }
  // 평가 이력·리포트는 위 4개 중 review/fsa/fsaReview 셋 중 하나라도 권한이 있으면 접근 가능 (별도 컬럼 없음).
  if (categoryKey === "history") {
    return hasCategoryAccess(user, "review") || hasCategoryAccess(user, "fsa") || hasCategoryAccess(user, "fsaReview");
  }
  if (grant && grant[categoryKey]) return true;
  if (categoryKey === "adminOnly") return user.role === "admin";
  // 부서별 통제 현황(controlMgmt)은 관리자 전용으로 이동했다.
  // 관리자이거나, 카테고리 접근 권한 표에서 「통제 관리」가 체크된 계정만 접근한다.
  if (categoryKey === "controlMgmt") return user.role === "admin";
  if (categoryKey === "executive") return user.role === "admin" || user.role === "cfo" || user.role === "rd";
  return true; // icsOverview — 대시보드·학습은 전 직원 공개
}

/* 사용자별 접근 가능 부서(권한) 계산 - 이메일 기준 */
function computeInitialPermissions(initialControls, users = INITIAL_USERS, departments = INITIAL_DEPARTMENTS) {
  const perm = {};
  const allDeptIds = departments.map((d) => d.id);
  users.forEach((u) => {
    const email = (u.email || "").toLowerCase();
    const grant = ICS_CATEGORY_ACCESS[email] || {};

    let deptsAccessor = u.role === "accessor" && u.dept ? [u.dept] : [];
    let deptsReviewer = u.role === "reviewer" ? Array.from(new Set(initialControls.filter((c) => c.reviewer === u.email).map((c) => c.dept))) : [];
    let deptsAdmin = u.role === "admin" ? allDeptIds : [];

    // 권한 관리 화면에서 부서별로(Accessor/Reviewer/Admin 각각) 직접 부여한 항목을 기본값 위에 추가로 얹는다.
    if (grant.deptsAccessor?.length) deptsAccessor = Array.from(new Set([...deptsAccessor, ...grant.deptsAccessor]));
    if (grant.deptsReviewer?.length) deptsReviewer = Array.from(new Set([...deptsReviewer, ...grant.deptsReviewer]));
    if (grant.deptsAdmin?.length) deptsAdmin = Array.from(new Set([...deptsAdmin, ...grant.deptsAdmin]));
    // 예전 방식(구분 없는 Depts 컬럼)은 더 이상 읽지 않는다 - 지금은 화면에서 관리 안 되는 값이라 반영이 안 된 것처럼 보이는 혼선만 생김.

    const depts = Array.from(new Set([...deptsAccessor, ...deptsReviewer, ...deptsAdmin])); // 조회용 합집합
    perm[u.email] = { depts, deptsAccessor, deptsReviewer, deptsAdmin, role: u.role };
  });
  return perm;
}
function getAllowedDepts(user, permissions, departments = INITIAL_DEPARTMENTS) {
  // guest 는 employee_search.xlsx 에는 있으나 ICS 역할이 지정되지 않은 일반 직원이다.
  // 예전에는 조회 전용 계정을 상정해 전 부서를 부여했으나, 지금은 대다수가 guest 라
  // 전사 통제 현황이 열리는 결과가 된다. 다른 역할과 동일하게 배정받은 부서만 본다.
  if (user.role === "admin") return departments.map((d) => d.id);
  return permissions[user.email]?.depts || (user.dept ? [user.dept] : []);
}

function finalRisk(control) {
  if (control.status === "completed") return control.reviewRisk;
  // 제출 철회/반려로 status가 다시 not_started·returned로 돌아간 경우, 예전에 입력했던 selfRisk 값이
  // 남아있어도 대시보드 등에는 "미평가"로 보여야 한다 (재제출 전까지는 유효한 평가로 취급하지 않음).
  if (control.status === "submitted_self" && control.selfRisk) return control.selfRisk;
  return "none";
}

// 새 회계연도를 시작할 때, 기준연도의 통제 항목을 복제하여 평가 관련 필드만 초기화한다.
// 부서 × 통제영역 매트릭스의 셀 하나를 계산한다.
//
// 「최악 우선」 원칙에 미평가(none)를 포함시킨다.
//   red 있음 → red · orange 있음 → orange · none 있음 → none · 전부 green → green
//
// 미평가가 하나라도 섞이면 초록으로 칠하지 않는다. 평가를 안 한 것은 안전하다는 뜻이 아니라
// 아직 모른다는 뜻이므로, 초록으로 표시하면 실제보다 안전해 보이는 착시가 생긴다.
// (이전 구현은 red/orange가 없고 none이 섞여 있으면 기본값 green이 그대로 남아, 88건 중
//  1건만 양호여도 셀 전체가 초록으로 보였다.)
function matrixCellRisk(items) {
  const risks = items.map(finalRisk);
  if (risks.includes("red")) return "red";
  if (risks.includes("orange")) return "orange";
  if (risks.includes("none")) return "none";
  return "green";
}

// 셀 툴팁에 쓸 평가 완료 건수 (양호·주의·위험으로 확정된 건수)
function matrixAssessedCount(items) {
  return items.filter((c) => finalRisk(c) !== "none").length;
}

const LangContext = createContext({ lang: "ko", t: (p) => p, setLang: () => {} });
const AppDataContext = createContext({
  departments: INITIAL_DEPARTMENTS,
  setDepartments: () => {},
  users: INITIAL_USERS,
  setUsers: () => {},
});
function useAppData() {
  return useContext(AppDataContext);
}
function useLang() {
  return useContext(LangContext);
}
function makeT(lang) {
  return function t(path) {
    const parts = path.split(".");
    let node = STR[lang];
    for (const p of parts) node = node?.[p];
    return node ?? path;
  };
}

function RiskDot({ risk, size = 10 }) {
  const meta = RISK_META[risk || "none"];
  return (
    <span
      style={{ display: "inline-block", width: size, height: size, borderRadius: "9999px", backgroundColor: meta.color, flexShrink: 0 }}
    />
  );
}

function RiskBadge({ risk }) {
  const { lang } = useLang();
  const meta = RISK_META[risk || "none"];
  return (
    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium whitespace-nowrap flex-shrink-0" style={{ backgroundColor: meta.bg, color: meta.text }}>
      <RiskDot risk={risk} size={8} />
      {meta[lang]}
    </span>
  );
}

// 관리자 초기화(전체 삭제) 액션 전, 비밀번호 확인을 요구하는 공용 모달.
// 실수로 버튼을 눌러도 비밀번호를 입력해야만 실제로 삭제가 진행된다.
// [보존] React 컴포넌트. 현재 JSX 에서 참조되지 않지만 비밀번호 확인 삭제 흐름을 위해 남겨 둔다.
function ResetConfirmModal({ title, description, resetPassword, onConfirm, onClose }) {
  const { t } = useLang();
  const [input, setInput] = useState("");
  const [error, setError] = useState("");

  function submit() {
    if (input !== resetPassword) {
      setError(t("resetData.wrongPassword"));
      return;
    }
    onConfirm();
  }

  return (
    <Modal title={title} onClose={onClose}>
      <p className="text-sm text-slate-600 mb-4">{description}</p>
      <Field label={t("resetData.passwordLabel")}>
        <input
          type="password"
          autoFocus
          className={inputCls}
          value={input}
          onChange={(e) => {
            setInput(e.target.value);
            setError("");
          }}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder={t("resetData.passwordPlaceholder")}
        />
      </Field>
      {error && <p className="text-xs text-red-600 mb-3">{error}</p>}
      <div className="flex justify-end gap-2">
        <button onClick={onClose} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>
        <button onClick={submit} disabled={!input} className="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg disabled:opacity-40">
          {t("resetData.confirmDeleteBtn")}
        </button>
      </div>
    </Modal>
  );
}

function Dashboard({ controls: allControls, goTo, isAdmin, allowedDepts }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const visibleDepts = isAdmin ? departments : departments.filter((d) => allowedDepts.includes(d.id));
  const controls = isAdmin ? allControls : allControls.filter((c) => allowedDepts.includes(c.dept));

  const stats = useMemo(() => {
    const counts = { green: 0, orange: 0, red: 0, none: 0 };
    controls.forEach((c) => (counts[finalRisk(c)] += 1));
    const total = controls.length;
    const doneCount = controls.filter((c) => c.status === "completed").length;
    return { counts, total, completion: total ? Math.round((doneCount / total) * 100) : 0 };
  }, [controls]);

  // 리스크 매트릭스·분포 차트는 실제 통제 항목이 있는 부서만 보여준다 (25개 부서 중 대부분은 아직 항목이 없어서, 전부 다 보여주면 텅 빈 행/막대만 잔뜩 생겨 알아보기 어려움)
  const deptsWithData = visibleDepts.filter((d) => controls.some((c) => c.dept === d.id));

  const barData = deptsWithData.map((d) => {
    const items = controls.filter((c) => c.dept === d.id);
    const row = { name: d[lang], green: 0, orange: 0, red: 0, none: 0 };
    items.forEach((c) => (row[finalRisk(c)] += 1));
    return row;
  });

  const matrix = deptsWithData.map((d) => ({
    dept: d,
    cells: CATEGORIES.map((cat) => {
      const items = controls.filter((c) => c.dept === d.id && c.cat === cat.id);
      if (items.length === 0) return { cat, risk: null, count: 0, assessed: 0, by: null };
      // 셀에 총계만 보여주면 88건이 전부 미평가인지 양호인지 알 수 없다.
      // 신호등별 건수를 함께 집계해 셀 안에 나눠 표시한다.
      const by = { green: 0, orange: 0, red: 0, none: 0 };
      items.forEach((c) => { by[finalRisk(c)] = (by[finalRisk(c)] || 0) + 1; });
      return { cat, risk: matrixCellRisk(items), count: items.length, assessed: matrixAssessedCount(items), by };
    }),
  }));

  return (
    <div>
      <SectionHeader
        icon={LayoutDashboard}
        title={t("dashboard.title")}
        subtitle={isAdmin ? t("dashboard.subtitleAdmin") : `${t("dashboard.subtitleScoped")} (${visibleDepts.map((d) => d[lang]).join(", ") || t("dashboard.noAssigned")})`}
      />

      <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        <div className="relative bg-white rounded-xl border border-slate-200 shadow-sm p-4 overflow-hidden">
          <div className="absolute top-0 left-0 right-0 h-1" style={{ backgroundColor: BRAND.navy }} />
          <div className="flex items-center justify-between mb-1.5">
            <p className="text-xs text-slate-500">{t("dashboard.kpiTotal")}</p>
            <ClipboardList size={14} className="text-slate-300" />
          </div>
          <p className="text-2xl font-bold text-slate-800">{stats.total}</p>
        </div>
        <div className="relative bg-white rounded-xl border border-slate-200 shadow-sm p-4 overflow-hidden">
          <div className="absolute top-0 left-0 right-0 h-1" style={{ backgroundColor: BRAND.accent }} />
          <div className="flex items-center justify-between mb-1.5">
            <p className="text-xs text-slate-500">{t("dashboard.kpiCompletion")}</p>
            <CheckCircle2 size={14} className="text-slate-300" />
          </div>
          <p className="text-2xl font-bold" style={{ color: BRAND.accent }}>{stats.completion}%</p>
        </div>
        {["green", "orange", "red"].map((r) => (
          <button
            key={r}
            onClick={() => goTo("manage", { risk: r })}
            className="relative text-left rounded-xl border p-4 overflow-hidden transition-transform hover:-translate-y-0.5"
            style={{ backgroundColor: RISK_META[r].bg, borderColor: RISK_META[r].color + "33" }}
          >
            <div className="absolute top-0 left-0 right-0 h-1" style={{ backgroundColor: RISK_META[r].color }} />
            <p className="text-xs mb-1.5 flex items-center gap-1.5 font-medium" style={{ color: RISK_META[r].text }}>
              <RiskDot risk={r} size={8} /> {RISK_META[r][lang]}
            </p>
            <p className="text-2xl font-bold" style={{ color: RISK_META[r].color }}>{stats.counts[r]}</p>
          </button>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5 mb-6">
        <div className="lg:col-span-3 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-semibold text-slate-700">{t("dashboard.matrixTitle")}</h3>
            <div className="flex items-center gap-3 text-xs text-slate-500">
              {["green", "orange", "red", "none"].map((r) => (
                <span key={r} className="flex items-center gap-1">
                  <RiskDot risk={r} size={8} /> {RISK_META[r][lang]}
                </span>
              ))}
            </div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-[13px] table-fixed">
              <colgroup>
                <col style={{ width: "34%" }} />
                {CATEGORIES.map((c) => <col key={c.id} style={{ width: `${66 / CATEGORIES.length}%` }} />)}
              </colgroup>
              <thead>
                <tr>
                  <th className="text-left text-slate-500 font-semibold pb-2 pr-3 whitespace-nowrap border-b-2 border-slate-200">{t("list.colDept")}</th>
                  {CATEGORIES.map((cat) => (
                    <th key={cat.id} className="text-center text-slate-500 font-semibold pb-2 px-1 leading-tight border-b-2 border-slate-200 border-l border-l-slate-100">{cat[lang]}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {matrix.map((row) => (
                  <tr key={row.dept.id} className="border-t border-slate-100 hover:bg-slate-50/70 transition-colors">
                    <td className="py-1 pr-3 font-medium text-slate-700 truncate" title={row.dept[lang]}>{row.dept[lang]}</td>
                    {row.cells.map((cell, i) => (
                      <td key={i} className="text-center py-1 px-2 border-l border-l-slate-100">
                        {cell.count > 0 ? (
                          <button
                            title={`${row.dept[lang]} · ${cell.cat[lang]} — ${t("dashboard.matrixTotal")} ${cell.count}${t("common.items")} · ${t("dashboard.matrixAssessed")} ${cell.assessed}${t("common.items")}`}
                            onClick={() => goTo("manage", { dept: row.dept.id, cat: cell.cat.id })}
                            className="inline-flex flex-col items-center gap-1 hover:opacity-75 transition-opacity"
                          >

                            <span className="min-w-[34px] px-2 py-0.5 rounded-md border font-semibold leading-none text-[13px]"
                                  style={{ borderColor: RISK_META[cell.risk].color, color: RISK_META[cell.risk].text }}>
                              {cell.count}
                            </span>
                            {/* 총계만으로는 88건이 전부 미평가인지 알 수 없어 신호등별 내역을 함께 보여준다.
                                건수가 0인 신호등은 생략해 셀이 복잡해지지 않게 한다. */}
                            <span className="inline-flex items-center gap-1.5 text-[10px] leading-none font-semibold">
                              {["green", "orange", "red", "none"]
                                .filter((k) => cell.by && cell.by[k] > 0)
                                .map((k) => (
                                  <span key={k} className="inline-flex items-center gap-[3px]"
                                        style={{ color: RISK_META[k].color }}
                                        title={`${RISK_META[k][lang]} ${cell.by[k]}${t("common.items")}`}>
                                    <span className="rounded-full inline-block"
                                          style={{ width: 5, height: 5, backgroundColor: RISK_META[k].color }} />
                                    {cell.by[k]}
                                  </span>
                                ))}
                            </span>
                          </button>
                        ) : (
                          <span className="text-slate-300">–</span>
                        )}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <h3 className="text-sm font-semibold text-slate-700 mb-4">{t("dashboard.chartTitle")}</h3>
          {/* 좌측 매트릭스 표와 행이 나란히 보이도록 높이를 맞춘다.

              머리글 영역(표 23 vs X축 약 30)의 차이는 상단 여백으로 보정한다. */}
          <ResponsiveContainer width="100%" height={Math.max(180, deptsWithData.length * 41 + 53)}>
            <BarChart data={barData} layout="vertical" margin={{ top: 23, bottom: 0, left: 0, right: 16 }} barSize={18}>

              {/* 부서명 라벨 폭. 「Homologation & Customer Delivery」처럼 긴 이름은 두 줄로 접히므로

                     tick={{ fontSize: 11, fill: "#64748B" }} />
              <Tooltip />
              <Bar dataKey="green" stackId="a" fill={RISK_META.green.color} radius={[0, 0, 0, 0]} />

              <Bar dataKey="none" stackId="a" fill={RISK_META.none.color} radius={[0, 4, 4, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

    </div>
  );
}

  const [mediaLoaded, setMediaLoaded] = useState(false);
  const [upload, setUpload] = useState(null); // { name, percent } - 업로드 진행 중인 파일 (한 번에 하나씩 순차 처리)
  const [videoErrors, setVideoErrors] = useState({}); // 브라우저가 재생 못 하는 영상(id) 추적 - 대부분 코덱 미지원
  const [mediaTitles, setMediaTitles] = useState({}); // { 파일ID: 사용자지정 제목 }
  const [renamingId, setRenamingId] = useState(null);
  const [renameDraft, setRenameDraft] = useState("");
  const VIDEOS_PER_PAGE = 4;
  const [videoPage, setVideoPage] = useState(0);

  const content = learnContent[lang];

  // ICS_Media-Files 폴더의 실제 파일 목록 + ics_category_access.xlsx의 LearnContent 시트를 화면 진입 시마다 새로 불러온다.
  // 콘텐츠(소개문구·유의사항)는 이제 인앱 편집이 아니라 이 Excel 파일을 직접 수정해서 반영하는 방식이라, 매번 최신 내용을 다시 받아온다.
  useEffect(() => {
    let cancelled = false;
    icsListMediaFiles()
      .then(({ videos, images }) => {
        if (cancelled) return;
        setLearnVideos(videos.map((v) => ({ id: v.id, url: v.url, name: v.name, size: v.size })));
        setLearnImages(images.map((i) => ({ id: i.id, url: i.url, name: i.name, size: i.size })));
        setVideoErrors({});
        setVideoPage(0);
      })
      .catch((e) => console.warn("[ICS] 학습 미디어 로드 실패:", e.message))
      .finally(() => { if (!cancelled) setMediaLoaded(true); });

    // 사용자 지정 제목(media_titles.json) - 없으면 파일명(확장자 제외)을 그대로 씀
    loadIcsMediaTitles()
      .then((saved) => { if (!cancelled && saved) setMediaTitles(saved); })
      .catch((e) => console.warn("[ICS] media_titles.json 로드 실패, 파일명으로 대체:", e.message));

    // 학습 콘텐츠는 ics_category_access.xlsx의 LearnContent 시트에서 직접 불러온다 (인앱 편집 폐지).
    if (showToast) showToast(lang === "en" ? "Applying learning content…" : "학습 콘텐츠 반영 중…");
    loadIcsLearnContentFromMaster()
      .then((saved) => {
        if (cancelled) return;
        if (saved) {
          setLearnContent(saved);
          if (showToast) showToast(lang === "en" ? "Learning content applied." : "학습 콘텐츠가 반영되었습니다.");
        }
      })
      .catch((e) => console.warn("[ICS] LearnContent 시트 로드 실패, 기본 문구 사용:", e.message));

    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function stripExt(name) {
    return (name || "").replace(/\.[a-zA-Z0-9]{2,5}$/, "");
  }
  function titleFor(item) {
    return mediaTitles[item.id] || stripExt(item.name);
  }
  function startRename(item) {
    if (!requireAdmin()) return;
    setRenamingId(item.id);
    setRenameDraft(titleFor(item));
  }
  async function saveRename() {
    const id = renamingId;
    const newTitle = renameDraft.trim();
    setRenamingId(null);
    if (!id || !newTitle) return;
    const updated = { ...mediaTitles, [id]: newTitle };
    setMediaTitles(updated);
    try {
      await saveIcsMediaTitles(updated);
      if (addLog) addLog(currentUser.email, "edit_learn_content", "-", newTitle, newTitle);
    } catch (e) {
      alert("제목 저장에 실패했습니다: " + e.message);
    }
  }

  function requireAdmin(action) {
    if (!isAdmin) {
      alert(lang === "en" ? "Only admins can do this." : "관리자만 할 수 있는 작업입니다.");
      return false;
    }
    return action ? action() : true;
  }

  async function uploadFiles(files, kind) {
    const maxSize = kind === "video" ? MAX_VIDEO_SIZE : MAX_IMAGE_SIZE;
    const maxCount = kind === "video" ? MAX_VIDEO_COUNT : MAX_IMAGE_COUNT;
    let currentCount = kind === "video" ? learnVideos.length : learnImages.length;
    let anyUploaded = false;
    for (const file of files) {
      if (currentCount >= maxCount) {
        alert(
          lang === "en"
            ? `You can register up to ${maxCount} ${kind === "video" ? "videos" : "images"}. ${file.name} was skipped.`
            : `${kind === "video" ? "동영상" : "이미지"}은 최대 ${maxCount}개까지 등록할 수 있습니다. ${file.name}은(는) 건너뜁니다.`
        );
        continue;
      }
      if (file.size > maxSize) {
        alert(
          lang === "en"
            ? `${file.name} exceeds the ${formatMB(maxSize)} limit and was skipped.`
            : `${file.name} 파일이 ${formatMB(maxSize)} 제한을 초과해 건너뜁니다.`
        );
        continue;
      }
      try {
        setUpload({ name: file.name, percent: 0 });
        await icsUploadMediaFile(file, (percent) => setUpload({ name: file.name, percent }));
        currentCount++;
        anyUploaded = true;
      } catch (e) {
        alert("업로드에 실패했습니다: " + e.message);
      } finally {
        setUpload(null);
      }
    }
    if (anyUploaded) {
      // 업로드 완료 응답의 webUrl은 <video>/<img>로 바로 재생·표시가 안 되는 SharePoint 뷰어 링크라,
      // 폴더를 다시 조회해서 재생 가능한 @microsoft.graph.downloadUrl을 새로 받아온다.
      try {
        const { videos, images } = await icsListMediaFiles();
        setLearnVideos(videos.map((v) => ({ id: v.id, url: v.url, name: v.name, size: v.size })));
        setLearnImages(images.map((i) => ({ id: i.id, url: i.url, name: i.name, size: i.size })));
        setVideoErrors({});
        setVideoPage(0);
      } catch (e) {
        console.warn("[ICS] 업로드 후 미디어 목록 갱신 실패:", e.message);
      }
    }
  }

  function handleVideoUpload(e) {
    if (!requireAdmin()) { e.target.value = ""; return; }
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length) uploadFiles(files, "video");
  }
  async function removeVideo(videoId) {
    if (!requireAdmin()) return;
    try {
      const hidden = await loadIcsHiddenMedia().catch(() => []);
      await saveIcsHiddenMedia(Array.from(new Set([...hidden, videoId])));
      setLearnVideos((prev) => prev.filter((v) => v.id !== videoId));
    } catch (e) {
      alert("숨김 처리에 실패했습니다: " + e.message);
    }
  }

  function handleImageUpload(e) {
    if (!requireAdmin()) { e.target.value = ""; return; }
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length) uploadFiles(files, "image");
  }
  async function removeImage(imageId) {
    if (!requireAdmin()) return;
    try {
      const hidden = await loadIcsHiddenMedia().catch(() => []);
      await saveIcsHiddenMedia(Array.from(new Set([...hidden, imageId])));
      setLearnImages((prev) => prev.filter((v) => v.id !== imageId));
    } catch (e) {
      alert("숨김 처리에 실패했습니다: " + e.message);
    }
  }

  return (
    <div>
      <SectionHeader
        icon={GraduationCap}
        title={t("learn.title")}
        subtitle={t("learn.subtitle")}
      />

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-5">
        <h3 className="text-sm font-semibold text-slate-700 mb-2">{t("learn.introTitle")}</h3>
        <p className="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap">{content.intro}</p>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-5">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("learn.componentsTitle")}</h3>
        <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
          {CATEGORIES.map((c) => (
            <div key={c.id} className="bg-slate-50 rounded-lg p-3">
              <p className="text-xs text-slate-400 mb-1">{c.id}</p>
              <p className="text-sm font-medium text-slate-700 mb-1">{c[lang]}</p>
              <p className="text-xs text-slate-500 leading-relaxed">{lang === "en" ? c.blurbEn : c.blurbKo}</p>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-5">
        <div className="flex items-center justify-between mb-1">
          <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2">
            <PlayCircle size={16} className="text-teal-600" /> {t("learn.videoTitle")}
            <span className="text-xs font-normal text-slate-400">({learnVideos.length}/{MAX_VIDEO_COUNT})</span>
          </h3>
          <div className="flex items-center gap-2">
            <button onClick={() => (requireAdmin() ? videoInputRef.current?.click() : null)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:border-teal-400 hover:text-teal-600">
              <UploadCloud size={13} /> {t("learn.uploadBtn")}
            </button>
            <input ref={videoInputRef} type="file" accept="video/*" multiple className="hidden" onChange={handleVideoUpload} />
          </div>
        </div>
        <p className="text-xs text-slate-400 mb-3">{lang === "en" ? `Up to ${formatMB(MAX_VIDEO_SIZE)} per video, up to ${MAX_VIDEO_COUNT} videos total.` : `동영상 1개당 최대 ${formatMB(MAX_VIDEO_SIZE)}까지, 최대 ${MAX_VIDEO_COUNT}개까지 등록할 수 있습니다.`}</p>

        {upload && (
          <div className="mb-3 bg-slate-50 rounded-lg p-3">
            <div className="flex items-center justify-between text-xs text-slate-500 mb-1.5">
              <span className="truncate">{lang === "en" ? "Uploading" : "업로드 중"} · {upload.name}</span>
              <span className="flex-shrink-0 font-medium">{upload.percent}%</span>
            </div>
            <div className="w-full h-1.5 rounded-full bg-slate-200 overflow-hidden">
              <div className="h-full rounded-full transition-all" style={{ width: `${upload.percent}%`, backgroundColor: BRAND.accent }} />
            </div>
          </div>
        )}

        {learnVideos.length > 0 ? (
          <>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {learnVideos.slice(videoPage * VIDEOS_PER_PAGE, videoPage * VIDEOS_PER_PAGE + VIDEOS_PER_PAGE).map((v) => (
                <div key={v.id}>
                  <div className="flex items-center justify-between gap-2 mb-1.5">
                    {renamingId === v.id ? (
                      <div className="flex items-center gap-1.5 flex-1">
                        <input
                          autoFocus
                          className="flex-1 text-xs border border-slate-200 rounded px-2 py-1"
                          value={renameDraft}
                          onChange={(e) => setRenameDraft(e.target.value)}
                          onKeyDown={(e) => e.key === "Enter" && saveRename()}
                        />
                        <button onClick={saveRename} aria-label={t("common.save")} title={t("common.save")} className="text-teal-600 flex-shrink-0"><Check size={14} /></button>
                        <button onClick={() => setRenamingId(null)} aria-label={t("common.cancel")} title={t("common.cancel")} className="text-slate-400 flex-shrink-0"><X size={14} /></button>
                      </div>
                    ) : (
                      <p className="text-xs text-slate-600 truncate flex-1">
                        <span className="text-slate-400">{lang === "en" ? "Title: " : "제목: "}</span>
                        {titleFor(v)}
                      </p>
                    )}
                    <button onClick={() => startRename(v)} className="text-slate-300 hover:text-teal-600 flex-shrink-0" title={lang === "en" ? "Rename" : "제목 수정"}>
                      <Pencil size={13} />
                    </button>
                    <button onClick={() => removeVideo(v.id)} className="text-slate-300 hover:text-red-500 flex-shrink-0" title={t("learn.removeVideoBtn")}>
                      <Trash2 size={14} />
                    </button>
                  </div>
                  {videoErrors[v.id] ? (
                    <div className="w-full rounded-lg bg-slate-900 flex flex-col items-center justify-center gap-2 text-center px-4" style={{ height: 180 }}>
                      <AlertTriangle size={22} className="text-amber-400" />
                      <p className="text-xs text-slate-300">
                        {lang === "en"
                          ? "This browser can't play this video (likely an unsupported codec such as HEVC/H.265). Please download it instead."
                          : "이 브라우저에서 재생할 수 없는 형식입니다 (HEVC/H.265 등 코덱 미지원 가능성). 다운로드해서 확인해 주세요."}
                      </p>
                      <a href={v.url} download={v.name} className="text-xs font-medium underline" style={{ color: BRAND.accent }}>
                        {lang === "en" ? "Download video" : "영상 다운로드"}
                      </a>
                    </div>
                  ) : (
                    <video
                      controls
                      src={v.url}
                      className="w-full rounded-lg bg-slate-900"
                      style={{ maxHeight: 280 }}
                      onError={() => setVideoErrors((prev) => ({ ...prev, [v.id]: true }))}
                    />
                  )}
                </div>
              ))}
            </div>
            {learnVideos.length > VIDEOS_PER_PAGE && (
              <div className="flex items-center justify-center gap-1.5 mt-4">
                {Array.from({ length: Math.ceil(learnVideos.length / VIDEOS_PER_PAGE) }).map((_, i) => (
                  <button
                    key={i}
                    onClick={() => setVideoPage(i)}
                    className="w-7 h-7 rounded-lg text-xs font-medium flex items-center justify-center"
                    style={{
                      backgroundColor: videoPage === i ? BRAND.accent : "#F1F5F9",
                      color: videoPage === i ? "#fff" : "#64748B",
                    }}
                  >
                    {i + 1}
                  </button>
                ))}
              </div>
            )}
          </>
        ) : (
          <div className="border border-dashed border-slate-200 rounded-lg py-10 flex flex-col items-center justify-center gap-1.5 mt-3">
            <PlayCircle size={26} className="text-slate-300" />
            <p className="text-sm text-slate-400">{mediaLoaded ? t("learn.noVideo") : (lang === "en" ? "Loading…" : "불러오는 중…")}</p>
            <p className="text-xs text-slate-400">{t("learn.noVideoAdminHint")}</p>
          </div>
        )}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-5">
        <div className="flex items-center justify-between mb-1">
          <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2">
            <ImageIcon size={16} className="text-teal-600" /> {t("learn.imageTitle")}
            <span className="text-xs font-normal text-slate-400">({learnImages.length}/{MAX_IMAGE_COUNT})</span>
          </h3>
          <div className="flex items-center gap-2">
            <button onClick={() => (requireAdmin() ? imageInputRef.current?.click() : null)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:border-teal-400 hover:text-teal-600">
              <UploadCloud size={13} /> {t("learn.uploadImageBtn")}
            </button>
            <input ref={imageInputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleImageUpload} />
          </div>
        </div>
        <p className="text-xs text-slate-400 mb-3">{lang === "en" ? `Up to ${formatMB(MAX_IMAGE_SIZE)} per image, up to ${MAX_IMAGE_COUNT} images total.` : `이미지 1개당 최대 ${formatMB(MAX_IMAGE_SIZE)}까지, 최대 ${MAX_IMAGE_COUNT}개까지 등록할 수 있습니다.`}</p>

        {learnImages.length > 0 ? (
          <>
            <p className="text-xs text-slate-400 mb-3">{t("learn.imageCaption")}</p>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              {learnImages.map((img) => (
                <div key={img.id} className="relative group">
                  <div
                    onClick={() => {
                      setPreviewImage(img);
                      setZoom(1);
                    }}
                    className="w-full h-32 rounded-lg border border-slate-100 bg-slate-50 overflow-hidden flex items-center justify-center cursor-zoom-in"
                  >
                    <img src={img.url} alt={img.name} className="max-w-full max-h-full object-contain" />
                  </div>
                  <div className="absolute inset-0 rounded-lg flex items-center justify-center bg-black/0 group-hover:bg-black/20 transition-colors pointer-events-none">
                    <Maximize2 size={18} className="text-white opacity-0 group-hover:opacity-100 transition-opacity drop-shadow" />
                  </div>
                  <div className="absolute top-1.5 right-1.5 flex items-center gap-1">
                    <a
                      href={img.url}
                      download={img.name}
                      onClick={(e) => e.stopPropagation()}
                      className="bg-white/90 rounded-full p-1 text-slate-400 hover:text-teal-600 shadow"
                      title={t("learn.downloadImageBtn")}
                    >
                      <Download size={12} />
                    </a>
                    {(
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          removeImage(img.id);
                        }}
                        className="bg-white/90 rounded-full p-1 text-slate-400 hover:text-red-500 shadow"
                        title={t("learn.removeImageBtn")}
                      >
                        <Trash2 size={12} />
                      </button>
                    )}
                  </div>
                  <p className="text-xs text-slate-400 mt-1 truncate">{img.name}</p>
                </div>
              ))}
            </div>
          </>
        ) : (
          <div className="border border-dashed border-slate-200 rounded-lg py-10 flex flex-col items-center justify-center gap-1.5 mt-3">
            <ImageIcon size={26} className="text-slate-300" />
            <p className="text-sm text-slate-400">{mediaLoaded ? t("learn.noImage") : (lang === "en" ? "Loading…" : "불러오는 중…")}</p>
            <p className="text-xs text-slate-400">{t("learn.noImageAdminHint")}</p>
          </div>
        )}
      </div>

      {previewImage && (
        <div className="fixed inset-0 z-50 bg-black/80 flex flex-col" onClick={() => setPreviewImage(null)}>
          <div className="flex items-center justify-between px-5 py-3 text-white flex-shrink-0" onClick={(e) => e.stopPropagation()}>
            <p className="text-sm truncate pr-4">{previewImage.name}</p>
            <div className="flex items-center gap-1.5 flex-shrink-0">
              <button
                onClick={() => setZoom((z) => Math.max(0.5, +(z - 0.25).toFixed(2)))}
                className="p-2 rounded-lg hover:bg-white/10"
                title={t("learn.zoomOutBtn")}
              >
                <ZoomOut size={18} />
              </button>
              <span className="text-xs w-10 text-center select-none">{Math.round(zoom * 100)}%</span>
              <button
                onClick={() => setZoom((z) => Math.min(3, +(z + 0.25).toFixed(2)))}
                className="p-2 rounded-lg hover:bg-white/10"
                title={t("learn.zoomInBtn")}
              >
                <ZoomIn size={18} />
              </button>
              <a href={previewImage.url} download={previewImage.name} className="p-2 rounded-lg hover:bg-white/10" title={t("learn.downloadImageBtn")}>
                <Download size={18} />
              </a>
              <button onClick={() => setPreviewImage(null)} className="p-2 rounded-lg hover:bg-white/10" title={t("common.close")}>
                <X size={18} />
              </button>
            </div>
          </div>
          <div className="flex-1 overflow-auto flex items-center justify-center p-6" onClick={(e) => e.stopPropagation()}>
            <img
              src={previewImage.url}
              alt={previewImage.name}
              className="transition-transform duration-150 select-none"
              style={{
                transform: `scale(${zoom})`,
                maxWidth: zoom <= 1 ? "100%" : "none",
                maxHeight: zoom <= 1 ? "100%" : "none",
              }}
            />
          </div>
        </div>
      )}

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">{t("learn.tipsTitle")}</h3>
        <ul className="space-y-2">
          {content.tips.map((tip, i) => (
            <li key={i} className="flex items-start gap-2 text-sm text-slate-600">
              <span className="text-teal-600 font-semibold flex-shrink-0">{i + 1}.</span>
              <span className="leading-relaxed whitespace-pre-wrap">{tip}</span>
            </li>
          ))}
        </ul>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mt-5">
        <h3 className="text-sm font-semibold text-slate-700 mb-1 flex items-center gap-2">
          <ClipboardList size={16} className="text-teal-600" /> {t("learn.sampleTableTitle")}
        </h3>
        <p className="text-xs text-slate-400 mb-4">{t("learn.sampleTableDesc")}</p>
        <div className="overflow-x-auto">
          <table className="text-sm border-collapse rounded-lg overflow-hidden" style={{ width: "auto", maxWidth: 640 }}>
            <thead>
              <tr>
                <th className="text-left text-xs font-medium text-slate-500 px-4 py-2.5 bg-slate-50 whitespace-nowrap border-b border-slate-100">{t("learn.sampleTableImportanceHeader")}</th>
                {FREQUENCY_OPTIONS.map((f) => (
                  <th key={f.id} className="text-center text-xs font-medium text-slate-500 px-4 py-2.5 bg-slate-50 whitespace-nowrap border-b border-slate-100">{f[lang]}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {IMPORTANCE_OPTIONS.map((im, i) => (
                <tr key={im.id} className={i % 2 === 1 ? "bg-slate-50/50" : ""}>
                  <td className="px-4 py-2 text-slate-700 font-medium whitespace-nowrap">{im[lang]}</td>
                  {FREQUENCY_OPTIONS.map((f) => (
                    <td key={f.id} className="text-center px-4 py-2 text-slate-600 whitespace-nowrap tabular-nums">
                      {recommendedSample(im.id, f.id)}{t("common.items")}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p className="text-xs text-slate-400 mt-3">{t("learn.sampleTableFootnote")}</p>
      </div>
    </div>
  );
}

function ControlList({ controls: allControls, filter, setFilter, isAdmin, allowedDepts, currentUser }) {
  const { lang, t } = useLang();
  const { departments, users } = useAppData();
  const [detail, setDetail] = useState(null);
  const [search, setSearch] = useState("");
  const [listPage, setListPage] = useState(0);
  const LIST_PAGE_SIZE = 20;

  const myEmail = (currentUser?.email || "").toLowerCase();
  const scoped = isAdmin ? allControls : allControls.filter((c) => (c.accessor || "").toLowerCase() === myEmail || (c.reviewer || "").toLowerCase() === myEmail || (allowedDepts && allowedDepts.includes(c.dept)));
  const scopedDeptIds = [...new Set(scoped.map((c) => c.dept))];
  const visibleDeptOptions = isAdmin ? departments : departments.filter((d) => scopedDeptIds.includes(d.id));

  const filtered = scoped.filter((c) => {
    if (filter.dept && c.dept !== filter.dept) return false;
    if (filter.cat && c.cat !== filter.cat) return false;
    if (filter.risk && finalRisk(c) !== filter.risk) return false;
    if (filter.status && c.status !== filter.status) return false;
    if (search && !(cName(c, lang).includes(search) || c.code.includes(search))) return false;
    return true;
  });

  const listTotalPages = Math.max(1, Math.ceil(filtered.length / LIST_PAGE_SIZE));
  const clampedListPage = Math.min(listPage, listTotalPages - 1);
  const pagedControls = filtered.slice(clampedListPage * LIST_PAGE_SIZE, (clampedListPage + 1) * LIST_PAGE_SIZE);
  // 검색·필터가 바뀌면 첫 페이지로 되돌린다 (빈 화면 방지)
  useEffect(() => { setListPage(0); }, [search, filter.dept, filter.cat, filter.risk, filter.status]);

  return (
    <div>
      <SectionHeader
        icon={Building2}
        title={t("list.title")}
        subtitle={isAdmin ? t("list.subtitleAdmin") : `${t("list.subtitleScoped")} (${visibleDeptOptions.map((d) => d[lang]).join(", ") || t("dashboard.noAssigned")})`}
      />

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-4 flex flex-wrap items-center gap-3">
        <div className="relative flex-1 min-w-[180px]">
          <Search size={15} className="absolute left-3 top-2.5 text-slate-400" />
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder={t("list.searchPlaceholder")} className={`${inputCls} pl-8`} />
        </div>
        <select value={filter.dept} onChange={(e) => setFilter({ ...filter, dept: e.target.value })} className={`${inputCls} w-auto`}>
          <option value="">{isAdmin ? t("common.allDept") : t("common.assignedDeptAll")}</option>
          {visibleDeptOptions.map((d) => <option key={d.id} value={d.id}>{d[lang]}</option>)}
        </select>
        <select value={filter.cat} onChange={(e) => setFilter({ ...filter, cat: e.target.value })} className={`${inputCls} w-auto`}>
          <option value="">{t("common.allCategory")}</option>
          {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c[lang]}</option>)}
        </select>
        <select value={filter.risk} onChange={(e) => setFilter({ ...filter, risk: e.target.value })} className={`${inputCls} w-auto`}>
          <option value="">{t("common.allRisk")}</option>
          {["green", "orange", "red", "none"].map((r) => <option key={r} value={r}>{RISK_META[r][lang]}</option>)}
        </select>
        {(filter.dept || filter.cat || filter.risk || filter.status) && (
          <button onClick={() => setFilter({ dept: "", cat: "", risk: "", status: "" })} className="text-xs text-slate-500 hover:text-slate-700 flex items-center gap-1">
            <X size={13} /> {t("common.resetFilter")}
          </button>
        )}
        <span className="text-xs text-slate-400 ml-auto">{filtered.length}{t("common.items")}</span>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
            <tr>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colCode")}</th>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colName")}</th>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colDept")}</th>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colCat")}</th>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colAccessor")}</th>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colReviewer")}</th>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colStatus")}</th>
              <th className="text-left font-semibold px-4 py-3 whitespace-nowrap">{t("list.colRisk")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {pagedControls.map((c, i) => {
              const risk = finalRisk(c);
              return (
                <tr key={c.id} onClick={() => setDetail(c)} className={`cursor-pointer transition-colors hover:bg-slate-100/70 ${i % 2 === 1 ? "bg-slate-50/50" : ""}`}>
                  <td className="pl-3 pr-4 py-3 text-slate-500 text-xs font-mono whitespace-nowrap" style={{ boxShadow: `inset 3px 0 0 ${RISK_META[risk].color}` }}>{c.code}</td>
                  <td className="px-4 py-3 text-slate-700 font-medium"><div className="max-w-[420px] truncate" title={cName(c, lang)}>{cName(c, lang)}</div></td>
                  <td className="px-4 py-3 text-slate-600 whitespace-nowrap">{deptName(c.dept, lang, departments)}</td>
                  <td className="px-4 py-3 text-slate-600 whitespace-nowrap">{catName(c.cat, lang)}</td>
                  <td className="px-4 py-3 text-slate-600"><div className="max-w-[180px] truncate" title={personByEmail(c.accessor, lang, users)}>{personByEmail(c.accessor, lang, users)}</div></td>
                  <td className="px-4 py-3 text-slate-600"><div className="max-w-[180px] truncate" title={personByEmail(c.reviewer, lang, users)}>{personByEmail(c.reviewer, lang, users)}</div></td>
                  <td className="px-4 py-3 whitespace-nowrap"><StatusBadge status={c.status} kind="isa" /></td>
                  <td className="px-4 py-3 whitespace-nowrap"><RiskBadge risk={risk} /></td>
                </tr>
              );
            })}
            {filtered.length === 0 && (
              <tr><td colSpan={8}><EmptyState text={t("list.emptyText")} /></td></tr>
            )}
          </tbody>
        </table>
        {filtered.length > 0 && (
          <div className="flex items-center justify-between px-5 py-3 border-t border-slate-100 text-xs text-slate-500">
            <span>{clampedListPage * LIST_PAGE_SIZE + 1}–{Math.min((clampedListPage + 1) * LIST_PAGE_SIZE, filtered.length)} / {filtered.length}{t("common.items")}</span>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setListPage((p) => Math.max(0, p - 1))}
                disabled={clampedListPage === 0}
                className="px-2.5 py-1 rounded-lg border border-slate-200 disabled:opacity-40 hover:border-teal-400 hover:text-teal-600"
              >
                <ChevronLeft size={14} />
              </button>
              <span>{clampedListPage + 1} / {listTotalPages}</span>
              <button
                onClick={() => setListPage((p) => Math.min(listTotalPages - 1, p + 1))}
                disabled={clampedListPage >= listTotalPages - 1}
                className="px-2.5 py-1 rounded-lg border border-slate-200 disabled:opacity-40 hover:border-teal-400 hover:text-teal-600"
              >
                <ChevronRight size={14} />
              </button>
            </div>
          </div>
        )}
      </div>

      {detail && (
        <Modal title={`${detail.code} · ${cName(detail, lang)}`} onClose={() => setDetail(null)} wide>
          <ControlDetailBody control={detail} />
        </Modal>
      )}
    </div>
  );

/* 엑셀 업로드 시 셀 값(코드 또는 한글/영문 라벨)을 실제 옵션으로 매칭하는 헬퍼들 */
// SheetJS 커뮤니티 버전은 데이터 유효성(드롭다운) 쓰기를 지원하지 않는다.
// 생성된 xlsx(zip)를 풀어 첫 시트 XML 에 dataValidations 를 주입하고 다시 압축한다.
// colMap: { 열인덱스(0부터): "선택값!$A$2:$A$14" }
function injectDataValidations(arrayBuffer, colMap) {
  const files = fflate.unzipSync(new Uint8Array(arrayBuffer));
  const path = "xl/worksheets/sheet1.xml";
  if (!files[path]) throw new Error("sheet1.xml 없음");
  let xml = new TextDecoder().decode(files[path]);

  const colLetter = (n) => {
    let s = "";
    n += 1;
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  };
  const esc = (v) => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const entries = Object.entries(colMap);
  const dv = entries.map(([col, ref]) => {
    const L = colLetter(Number(col));
    return `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1"`
      + ` errorStyle="stop" errorTitle="${esc("입력값 확인")}"`
      + ` error="${esc("목록에 있는 값만 입력할 수 있습니다. 셀 오른쪽의 화살표를 눌러 선택해 주세요.")}"`
      + ` promptTitle="${esc("선택")}" prompt="${esc("목록에서 선택해 주세요.")}"`
      + ` sqref="${L}2:${L}1000"><formula1>${esc(ref)}</formula1></dataValidation>`;
  }).join("");

  const block = `<dataValidations count="${entries.length}">${dv}</dataValidations>`;
  // dataValidations 는 sheetData 뒤에 와야 한다. pageMargins 가 있으면 그 앞에 넣는다.
  if (xml.includes("<pageMargins")) xml = xml.replace("<pageMargins", block + "<pageMargins");
  else xml = xml.replace("</worksheet>", block + "</worksheet>");

  files[path] = new TextEncoder().encode(xml);
  return fflate.zipSync(files);
}

// 통제 항목 변경 요청의 결재선을 만든다.
//   1차 Line Manager : employee_search.xlsx 의 Boss (G열)
//   2차 ICS 검토     : system_config_final.xlsx 의 ICS_CONTACT
//   3차 최종 승인    : system_config_final.xlsx 의 ICS_APPROVER_FINAL
//
// G열이 "-" 이면 최상위 임원(RD 대표)이라 Line Manager 단계를 생략한다.
// 통제 항목 변경 요청의 결재선을 만든다.
//   1차 MC        : 요청자가 직접 지정 (employee_search.xlsx 의 임직원 중 선택)
//   2차 ICS Admin : system_config_final.xlsx 의 ICS_CONTACT
//   3차 CFO       : system_config_final.xlsx 의 ICS_APPROVER_FINAL
//
// 지정한 MC 가 ICS Admin 이나 CFO 와 같으면 그 단계를 생략하고, 뒤 단계에서 한 번만 승인한다.
// 요청자 본인도 승인자가 될 수 없다.
// 관리자 화면에서 1차 MC 를 지정받는다. 이름 또는 이메일로 입력하면 사용자 목록에서 찾는다.
// 취소하면 null 을 돌려주어 호출부가 요청 생성을 중단한다.
function pickMcApprover(users, requesterEmail, lang) {
  const me = String(requesterEmail || "").toLowerCase();
  const cands = ICS_MC_CANDIDATES.filter((x) => x.email !== me);
  if (!cands.length) {
    alert(lang === "en" ? "No approver is available. Please contact IT."
                        : "선택 가능한 결재자가 없습니다. IT로 문의해 주세요.");
    return null;
  }
  // 후보가 소수(H열 기준)라 번호로 고르게 한다.
  const menu = cands.map((x, i) => `${i + 1}. ${x.name} (${x.email})`).join("\n");
  const raw = window.prompt(
    (lang === "en" ? "Select the 1st approver (MC) — enter a number:\n\n"
                   : "1차 결재자(MC)를 선택해 주세요 — 번호를 입력하세요:\n\n") + menu);
  if (raw === null) return null;
  const n = parseInt(String(raw).trim(), 10);
  if (!(n >= 1 && n <= cands.length)) {
    alert(lang === "en" ? "Please enter a valid number." : "목록에 있는 번호를 입력해 주세요.");
    return null;
  }
  return cands[n - 1].email;
}

function buildApprovalSteps(requesterEmail, mcEmail) {
  const me = String(requesterEmail || "").toLowerCase();
  const mc = String(mcEmail || "").toLowerCase();

  const steps = [];
  const skipped = [];           // 생략된 단계와 사유 (화면 안내용)
  const seen = new Set([me]);   // 요청자 본인은 승인자가 될 수 없다
  // 같은 사람이 두 단계에 걸치면(예: 직속 상사가 최종 승인자와 동일) 뒤 단계만 남긴다.
  // 한 사람이 같은 건을 두 번 승인하는 것은 결재의 의미가 없기 때문이다.
  const add = (role, email) => {
    if (!email) return;
    if (email === me) { skipped.push({ role, approver: email, reason: "self" }); return; }
    if (seen.has(email)) { skipped.push({ role, approver: email, reason: "dup" }); return; }
    seen.add(email);
    steps.push({ role, approver: email, status: "pending" });
  };
  // 상위 단계(CFO → ICS Admin → MC) 순으로 확정한 뒤 다시 뒤집어 순서를 맞춘다.
  // 이렇게 하면 중복된 사람이 항상 상위 단계에 남는다.
  const contact = (ICS_CONTACT_EMAILS[0] || ICS_CONTACT_EMAIL || "").toLowerCase();
  add("FINAL", ICS_APPROVER_FINAL);
  add("ICS_CONTACT", contact);
  add("MC", mc);
  steps.reverse();
  // 생략 사유는 결재선과 함께 화면에 안내한다. steps 자체에는 담지 않는다
  // (SharePoint 에 저장되는 값은 실제 결재 단계만 유지해야 하기 때문).
  steps.skipped = skipped.reverse();
  return steps;
}

// ICS_ChangeRequests 목록에서 변경 요청을 읽어온다.
async function loadIcsChangeRequests() {
  const items = await icsListAll(ICS_LISTS.changeRequests);
  return items.map((it) => {
    const f = it.fields || {};
    const parse = (v, fallback) => {
      try { return JSON.parse(stripSpRichText(v) || ""); } catch (e) { return fallback; }
    };
    return {
      spId: it.id,
      code: String(f.Title || "").trim(),
      year: String(f.Year || ""),
      reqType: String(f.ReqType || "edit"),
      requester: String(f.RequesterEmail || "").toLowerCase(),
      payload: parse(f.Payload, {}),
      steps: parse(f.Steps, []),
      step: Number(f.Step || 1),
      status: String(f.Status || "pending"),
      created: f.Created || null,
    };
  });
}

function matchOption(raw, options) {
  const v = String(raw || "").trim();
  if (!v) return null;
  const lower = v.toLowerCase();
  return (
    options.find((o) => o.id.toLowerCase() === lower) ||
    options.find((o) => o.ko === v) ||
    options.find((o) => (o.en || "").toLowerCase() === lower) ||
    null
  );
}
function findDeptByLabel(raw, departments) {
  return matchOption(raw, departments);
}
function findCatByLabel(raw) {
  return matchOption(raw, CATEGORIES);
}
function findFreqByLabel(raw) {
  return matchOption(raw, FREQUENCY_OPTIONS);
}
function findImportanceByLabel(raw) {
  return matchOption(raw, IMPORTANCE_OPTIONS);
}
// 엑셀 업로드 시 "1차담당자"/"2차검토자" 셀 값(이름)을 실제 등록된 사용자 이메일로 변환한다.
// 이메일 형식으로 직접 입력된 경우는 그대로 사용하고, 그렇지 않으면 이름(한글/영문)으로 사용자 목록에서 찾는다.
function resolvePersonEmail(raw, users) {
  const v = String(raw || "").trim();
  if (!v) return "";
  if (v.includes("@")) return v;
  const u = users.find((x) => x.name === v || x.nameEn === v);
  return u ? u.email : "";
}

// 이메일을 직접 몰라도 이름(한글/영문)이나 이메일 일부로 검색해서 등록된 계정을 바로 찾아 넣을 수 있는 입력창.
// 직접 타이핑한 값도 그대로 허용(수동 입력 폴백), 매칭되는 사람이 있으면 드롭다운으로 골라서 채울 수 있다.
function PersonAutocomplete({ value, onChange, users, lang, placeholder }) {
  const [query, setQuery] = useState(value || "");
  const [open, setOpen] = useState(false);
  useEffect(() => { setQuery(value || ""); }, [value]);
  const q = query.trim().toLowerCase();
  const matches =
    q.length > 0
      ? users
          .filter((u) => u.email.toLowerCase().includes(q) || (u.name || "").toLowerCase().includes(q) || (u.nameEn || "").toLowerCase().includes(q))
          .slice(0, 6)
      : [];
  return (
    <div className="relative">
      <input
        type="text"
        className={inputCls}
        value={query}
        placeholder={placeholder}
        onChange={(e) => { setQuery(e.target.value); onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      {open && matches.length > 0 && (
        <div className="absolute z-20 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden max-h-48 overflow-y-auto">
          {matches.map((u) => (
            <button
              key={u.id}
              type="button"
              onMouseDown={(e) => e.preventDefault()}
              onClick={() => { onChange(u.email); setQuery(u.email); setOpen(false); }}
              className="w-full px-3 py-2 flex flex-col items-start text-left hover:bg-slate-50"
            >
              <span className="text-sm text-slate-700">{pName(u.name, lang, users)}</span>
              <span className="text-xs text-slate-400">{u.email}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

  async function handleUploadFile(e) {
    setUploading(true);
    setUploadResult(null);
    try { await runUpload(e); } finally { setUploading(false); if (fileInputRef.current) fileInputRef.current.value = ""; }
  }

  async function runUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = "";
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

      let skipped = 0;
      const creates = [];
      const updates = [];

      rows.forEach((row) => {
        const code = String(row["코드"] || "").trim();
        // 템플릿 첫 행의 작성 예시는 등록하지 않는다 (지우지 않아도 안전하도록).
        // 「예시-」·「EXAMPLE-」로 시작하는 경우만 대상으로 해, 실제 코드가 걸리지 않게 한다.
        if (/^(예시|example)-/i.test(code)) return;
        const name = String(row["통제명"] || "").trim();
        const dept = findDeptByLabel(row["부서"], departments);
        const cat = findCatByLabel(row["COSO영역"]);
        const frequency = findFreqByLabel(row["점검빈도"]);
        const importance = findImportanceByLabel(row["중요도"]);
        const accessor = resolvePersonEmail(row["1차담당자"], users);
        const reviewer = resolvePersonEmail(row["2차검토자"], users);
        if (!code || !name || !dept || !cat || !frequency || !importance || !accessor || !reviewer) {
          skipped++;
          return;
        }
        const nameEn = String(row["통제명(영문)"] || "").trim() || name;
        const desc = String(row["설명"] || "").trim();
        const descEn = String(row["설명(영문)"] || "").trim();
        const payload = {
          code, dept: dept.id, cat: cat.id, name, nameEn, desc, descEn,
          accessor, reviewer, frequency: frequency.id, importance: importance.id,
          sampleSize: recommendedSample(importance.id, frequency.id),
        };
        const fields = {
          Title: code, Dept: dept.id, Category: cat.id, NameKo: name, NameEn: nameEn,
          DescKo: desc, DescEn: descEn, AccessorEmail: accessor, ReviewerEmail: reviewer,
          Year: year, Frequency: frequency.id, Importance: importance.id,
        };
        // 기존 항목 판정은 모달 저장(save)의 중복 검사와 같은 기준을 쓴다.
        // 원문 그대로 비교하면 엑셀에 itt-ca-010 처럼 대소문자만 다르게 넣었을 때
        // 기존 ITT-CA-010 을 찾지 못하고 새 항목으로 생성되어 같은 통제가 두 건 등록된다.
        const codeKey = code.trim().toLowerCase();
        const existing = allControls.find(
          (c) => c.year === year && (c.code || "").trim().toLowerCase() === codeKey
        );
        if (existing) updates.push({ localId: existing.id, spId: existing.spId, payload, fields });
        else creates.push({ payload, fields });
      });

      // SharePoint 스로틀링 방지를 위해 순차적으로 반영 (동시 다발 요청 지양)
      let added = 0, updated = 0;
      const createdResults = [];
      for (const item of creates) {
        try {
          const created = await icsCreateItem(ICS_LISTS.controls, item.fields);
          createdResults.push({ ...item, spId: created.id });
          added++;
        } catch (err) {
          skipped++;
        }
      }
      const updatedResults = [];
      for (const item of updates) {
        try {
          if (item.spId) await icsUpdateItem(ICS_LISTS.controls, item.spId, item.fields);
          updatedResults.push(item);
          updated++;
        } catch (err) {
          skipped++;
        }
      }

      setControls((prev) => {
        let next = [...prev];
        updatedResults.forEach(({ localId, payload }) => {
          const idx = next.findIndex((c) => c.id === localId);
          if (idx >= 0) next[idx] = { ...next[idx], ...payload };
        });
        createdResults.forEach(({ payload, spId }) => {
          next = [
            {
              id: uid(), spId, ...payload, year, status: "not_started",
              selfRisk: null, selfComment: "", selfCommentEn: "", selfDate: null,
              reviewRisk: null, reviewComment: "", reviewCommentEn: "", reviewDate: null,
              history: [], actualSample: null, attachments: [], fsaAttachments: [],
              fsaStatus: "not_started", fsaRisk: null, fsaComment: "", fsaCommentEn: "", fsaDate: null, fsaReviewRisk: null, fsaReviewComment: "", fsaReviewCommentEn: "", fsaReviewDate: null, pendingEdit: null,
            },
            ...next,
          ];
        });
        return next;
      });

      addLog(
        currentUser.email,
        "bulk_upload",
        "-",
        `신규 ${added}건 · 수정 ${updated}건 · 오류 ${skipped}건`,
        `${added} added · ${updated} updated · ${skipped} skipped`
      );
      setUploadResult({ added, updated, skipped });
    } catch (err) {
      setUploadResult({ error: true });
    }
  }

  function openAdd() {

    setEditingId(null);

  function openEdit(c) {
    const reason = lockReason(c);
    if (reason) { alert(reason); return; }
    // pendingEdit(수정 요청 → 승인 대기) 흐름은 2026-07-30(895c3f6)에 제거되어 항상 null 이다.
    const src = c;
    setForm({ code: src.code, dept: src.dept, cat: src.cat, name: src.name, desc: src.desc, accessor: src.accessor, reviewer: src.reviewer, frequency: src.frequency, importance: src.importance });
    setEditingId(c.id);
    setCodeError("");
  }
  async function save() {
    if (!form.code.trim() || !form.name.trim()) return;
    // 같은 연도 안에서 통제 코드는 유일해야 한다. 수정 중인 항목 자신은 검사에서 제외.
    const codeKey = form.code.trim().toLowerCase();
    const dup = allControls.find(
      (c) => c.year === year && (c.code || "").trim().toLowerCase() === codeKey && c.id !== editingId
    );
    if (dup) {
      setCodeError(lang === "en"
        ? `Control code "${form.code.trim()}" already exists (${cName(dup, lang)}). Please use a different code.`
        : `이미 등록된 통제 코드입니다 — ${form.code.trim()} (${cName(dup, lang)}). 다른 코드를 입력해 주세요.`);
      return;
    }
    setCodeError("");
    const fields = {
      Title: form.code,
      Dept: form.dept,
      Category: form.cat,
      NameKo: form.name,
      NameEn: form.name,
      DescKo: form.desc,
      DescEn: form.desc,
      AccessorEmail: form.accessor,
      ReviewerEmail: form.reviewer,
      Year: year,
      Frequency: form.frequency,
      Importance: form.importance,
    };
    try {
      if (editingId) {
        const target = allControls.find((c) => c.id === editingId);
        // 기존 항목 수정은 곧바로 반영하지 않고 3단계 결재 요청을 생성한다.
        // (신규 등록은 결재 없이 바로 생성된다)
        if (usingSharePointData && target) {
          const mcEmail = pickMcApprover(users, currentUser.email, lang);
          if (mcEmail === null) return;   // 취소
          const steps = buildApprovalSteps(currentUser.email, mcEmail);
          if (!steps.length) {
            alert(lang === "en"
              ? "Approval line could not be determined. Please contact IT."
              : "결재선을 확인할 수 없습니다. IT로 문의해 주세요.");
            return;
          }
          await icsCreateItem(ICS_LISTS.changeRequests, {
            Title: target.code, Year: year, ReqType: "edit",
            RequesterEmail: currentUser.email,
            Payload: JSON.stringify({
              dept: form.dept, cat: form.cat, name: form.name, desc: form.desc,
              accessor: form.accessor, reviewer: form.reviewer,
              frequency: form.frequency, importance: form.importance,
            }),
            Steps: JSON.stringify(steps), Step: 1, Status: "pending",
          });
          addLog(currentUser.email, "request_edit_control", target.code, form.name, form.name);
          setForm(null);
          setEditingId(null);
          showToast(lang === "en"
            ? "Change request submitted for approval."
            : "수정 요청이 결재로 상신되었습니다.");
          return;
        }
        if (target?.spId) await icsUpdateItem(ICS_LISTS.controls, target.spId, fields);
        setControls((prev) => prev.map((c) => (c.id === editingId ? { ...c, ...form, sampleSize: recommendedSample(form.importance, form.frequency), pendingEdit: null } : c)));
        addLog(currentUser.email, "edit_control", form.code, form.name, form.name);
        showToast(lang === "en" ? "Control item updated." : "통제 항목이 수정되었습니다.");
      } else {
        const created = await icsCreateItem(ICS_LISTS.controls, fields);
        const newControl = {
          id: uid(), spId: created.id, ...form, status: "not_started", year,
          selfRisk: null, selfComment: "", selfCommentEn: "", selfDate: null,
          reviewRisk: null, reviewComment: "", reviewCommentEn: "", reviewDate: null, history: [],
          sampleSize: recommendedSample(form.importance, form.frequency), actualSample: null, attachments: [], fsaAttachments: [],
          fsaStatus: "not_started", fsaRisk: null, fsaComment: "", fsaCommentEn: "", fsaDate: null, fsaReviewRisk: null, fsaReviewComment: "", fsaReviewCommentEn: "", fsaReviewDate: null, pendingEdit: null,
        };
        setControls((prev) => [newControl, ...prev]);
        addLog(currentUser.email, "add_control", form.code, form.name, form.name);
        showToast(lang === "en" ? "Control item added." : "통제 항목이 추가되었습니다.");
      }
      setForm(null);
      setEditingId(null);
    } catch (e) {
      alert("SharePoint 저장에 실패했습니다: " + e.message);
    }
  }
  async function remove(c) {
    setConfirmDelete(null);
    const reason = lockReason(c);
    if (reason) { alert(reason); return; }
    try {

        if (!steps.length) {
          alert(lang === "en"
            ? "Approval line could not be determined. Please contact IT."
            : "결재선을 확인할 수 없습니다. IT로 문의해 주세요.");
          return;

        await icsCreateItem(ICS_LISTS.changeRequests, {
          Title: c.code, Year: c.year, ReqType: "delete",
          RequesterEmail: currentUser.email,
          Payload: JSON.stringify({}),
          Steps: JSON.stringify(steps), Step: 1, Status: "pending",

        showToast(lang === "en"
          ? "Delete request submitted for approval."

      if (c.spId) await icsDeleteItem(ICS_LISTS.controls, c.spId);
      setControls((prev) => prev.filter((x) => x.id !== c.id));
      addLog(currentUser.email, "delete_control", c.code, c.name, c.nameEn);
      showToast(lang === "en" ? "Control item deleted." : "통제 항목이 삭제되었습니다.");

          <div className="flex justify-end gap-2 mt-2">
            <button onClick={() => setForm(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>

      )}

        <Modal title={t("manage.deleteTitle")} onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-600 mb-5">

            <button onClick={() => setConfirmDelete(null)} className="px-4 py-2 text-sm text-slate-500 rounded-lg hover:bg-slate-50">{t("common.cancel")}</button>

        </Modal>
      )}
    </div>
  );
